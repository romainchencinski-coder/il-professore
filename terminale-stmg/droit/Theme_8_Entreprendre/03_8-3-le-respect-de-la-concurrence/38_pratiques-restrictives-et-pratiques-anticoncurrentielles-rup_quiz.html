<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Pratiques restrictives et pratiques anticoncurrentielles : rupture brutale, revente à perte, ententes, abus de position dominante</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Les pratiques restrictives de concurrence sont sanctionnées…",
  "c": [
   "Quels que soient leurs effets sur le marché",
   "Seulement par la Commission européenne",
   "Seulement si elles faussent tout le marché",
   "Seulement si elles sont pénalement réprimées"
  ],
  "a": 0,
  "e": "Elles concernent les relations entre partenaires."
 },
 {
  "q": "Que sanctionne l’article L442-1, II du Code de commerce ?",
  "c": [
   "La rupture brutale d’une relation commerciale établie sans préavis écrit suffisant",
   "La rupture d’un contrat de travail",
   "Le dénigrement",
   "La vente à distance"
  ],
  "a": 0,
  "e": "Le préavis tient compte de la durée de la relation."
 },
 {
  "q": "Quel préavis suffit toujours en cas de rupture d’une relation commerciale établie ?",
  "c": [
   "1 mois",
   "Aucun",
   "18 mois",
   "5 ans"
  ],
  "a": 2,
  "e": "Ordonnance de 2019."
 },
 {
  "q": "Quel préjudice répare-t-on en cas de rupture brutale ?",
  "c": [
   "Celui causé par la brutalité de la rupture (marge perdue pendant le préavis manquant)",
   "La rupture elle-même dans sa totalité",
   "Aucun préjudice",
   "Le préjudice moral uniquement"
  ],
  "a": 0,
  "e": "La rupture reste possible."
 },
 {
  "q": "Qu’est-ce que la revente à perte ?",
  "c": [
   "Vendre moins cher que le concurrent",
   "Faire des soldes",
   "Vendre à crédit",
   "Revendre un produit en l’état à un prix inférieur à son prix d’achat effectif"
  ],
  "a": 3,
  "e": "Article L442-5 du Code de commerce."
 },
 {
  "q": "Quelle exception autorise la revente à perte ?",
  "c": [
   "Le lancement d’un nouveau magasin",
   "La fin du mois",
   "La volonté d’éliminer un concurrent",
   "Les soldes ou la vente de produits périssables menacés d’altération"
  ],
  "a": 3,
  "e": "Exceptions limitativement prévues."
 },
 {
  "q": "Quelle est la sanction de la revente à perte pour une personne physique ?",
  "c": [
   "La fermeture définitive du magasin",
   "Une amende de 75 000 €",
   "Une simple remarque",
   "Un avertissement de la mairie"
  ],
  "a": 1,
  "e": "375 000 € pour une personne morale."
 },
 {
  "q": "Qu’est-ce qu’une entente illicite ?",
  "c": [
   "Une convention collective",
   "Un accord entre entreprises indépendantes qui fausse la concurrence (prix, partage de marchés)",
   "Un contrat de franchise valable",
   "Une fusion autorisée"
  ],
  "a": 1,
  "e": "Article L420-1 ; article 101 TFUE."
 },
 {
  "q": "La position dominante est-elle interdite ?",
  "c": [
   "Oui, toujours",
   "Seulement pour les entreprises publiques",
   "Oui, au-delà de 30 % de parts de marché",
   "Non, seul son abus est interdit"
  ],
  "a": 3,
  "e": "Article L420-2 ; article 102 TFUE."
 },
 {
  "q": "Jusqu’à quel montant l’Autorité de la concurrence peut-elle sanctionner une entreprise ?",
  "c": [
   "1 % du bénéfice",
   "10 % du chiffre d’affaires mondial",
   "1 000 €",
   "Aucune limite"
  ],
  "a": 1,
  "e": "Autorité administrative indépendante créée en 2008."
 }
];

const FICHE = "38_pratiques-restrictives-et-pratiques-anticoncurrentielles-rup_fiche.pdf";
const FDATA = {"title": "Pratiques restrictives et pratiques anticoncurrentielles : rupture brutale, revente à perte, ententes, abus de position dominante", "blocks": [["h", "Deux familles de règles", ["Les **pratiques restrictives de concurrence** (Code de commerce, livre IV, titre IV) sanctionnent des comportements **déloyaux entre partenaires commerciaux**, **quels que soient leurs effets sur le marché** : la victime agit en responsabilité devant les juridictions spécialisées ; le ministre de l’Économie peut aussi agir.", "Les **pratiques anticoncurrentielles** (livre IV, titre II, et traité sur le fonctionnement de l’Union européenne) sanctionnent des comportements qui **faussent le jeu de la concurrence sur un marché** ; elles sont poursuivies par des **autorités** (Autorité de la concurrence, Commission européenne)."]], ["table", "La rupture brutale d’une relation commerciale établie (article L442-1, II)", ["Élément", "Contenu"], [["Principe", "Engage la responsabilité de son auteur le fait de **rompre brutalement**, même partiellement, une **relation commerciale établie**, en l’absence d’un **préavis écrit** qui tienne compte notamment de la **durée** de la relation commerciale"], ["Relation établie", "Relation **suivie, stable et habituelle**, permettant au partenaire d’anticiper sa continuité (contrats successifs, commandes régulières), même sans contrat écrit"], ["Préavis", "Raisonnable selon la durée de la relation et la dépendance économique ; un préavis de **18 mois** suffit toujours (ordonnance de 2019) ; pas de préavis en cas d’**inexécution grave** par l’autre partie ou de force majeure"], ["Réparation", "Le préjudice réparé est celui de la **brutalité** de la rupture (pas la rupture elle-même) : en général la **marge brute** perdue pendant la durée du préavis qui aurait dû être respecté"], ["Exemple", "Une centrale d’achat cesse du jour au lendemain de commander à un fournisseur de biscuits avec lequel elle travaillait depuis 12 ans"]]], ["table", "La revente à perte (article L442-5)", ["Élément", "Contenu"], [["Interdiction", "Il est interdit à tout commerçant de **revendre un produit en l’état à un prix inférieur à son prix d’achat effectif** (prix figurant sur la facture, minoré des avantages financiers et majoré des taxes et du prix du transport)"], ["Raisons", "Éviter les **prix d’appel** qui trompent le consommateur, protéger les petits commerçants et les fournisseurs contre une guerre des prix destructrice"], ["Exceptions", "Ventes volontaires ou forcées pour **cessation** ou changement d’activité, produits **saisonniers** en fin de saison, produits démodés ou dépassés techniquement, produits **périssables** menacés d’altération rapide, **soldes**, alignement sur un prix légalement pratiqué par un concurrent dans la même zone (sous conditions)"], ["Sanction", "Amende pénale de **75 000 €** (portée à 375 000 € pour une personne morale), pouvant être portée à la moitié des dépenses de publicité"], ["Particularité", "Pour les **produits alimentaires**, le seuil de revente à perte est relevé de **10 %** (lois **EGalim**, depuis 2019) afin de mieux rémunérer les agriculteurs ; dispositif prolongé à plusieurs reprises"]]], ["table", "Les pratiques anticoncurrentielles (seulement évoquées)", ["Pratique", "Définition", "Exemple"], [["**Entente**", "Accord, action concertée ou coalition entre entreprises indépendantes ayant pour objet ou effet de **fausser la concurrence** : fixation commune des prix, partage des marchés ou des clients, limitation de la production (article L420-1 du Code de commerce ; **article 101 TFUE**)", "Cartel des produits d’hygiène et d’entretien sanctionné par l’Autorité de la concurrence en 2014 (environ 951 millions d’euros)"], ["**Abus de position dominante**", "Avoir une position dominante n’est pas interdit ; l’**exploiter abusivement** l’est : prix prédateurs, refus de vente injustifié, ventes liées, conditions discriminatoires (article L420-2 ; **article 102 TFUE**)", "Google sanctionné par la Commission européenne (Google Shopping, 2017 ; Android, 2018)"], ["Autres", "Abus de **dépendance économique**, prix abusivement bas aux consommateurs ; le contrôle des **concentrations** (fusions) prévient la création de positions trop puissantes", "Règlement européen sur les marchés numériques (DMA, 2022) pour les grandes plateformes « contrôleurs d’accès »"]]], ["h", "Les autorités de concurrence", ["L’**Autorité de la concurrence** (autorité administrative indépendante, 2008, qui a succédé au Conseil de la concurrence de 1986) veille au respect de la libre concurrence en France ; la **Commission européenne** pour les pratiques affectant le commerce entre États membres. Les articles 101 et 102 du TFUE sont parfois plus protecteurs que le droit national.", "Sanctions : amendes jusqu’à **10 % du chiffre d’affaires mondial** du groupe, injonctions ; procédure de **clémence** (réduction ou exonération d’amende pour l’entreprise qui dénonce une entente) ; les victimes peuvent demander réparation devant le juge.", "Les **partenariats** entre entreprises (franchise, sous-traitance, distribution) sont licites tant qu’ils ne conduisent pas à une entente illicite (prix de revente imposés au franchisé) ou à un abus de position dominante."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Pratiques restrictives et pratiques anticoncurrentielles : rupture brutale, revente à perte, ententes, abus de position dominante</h1>
    <p class="sub">Terminale STMG Droit – 8.3 Le respect de la concurrence</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
