<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Entreprendre seul : l’entreprise individuelle, le patrimoine de l’entrepreneur et sa protection</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "L’entreprise individuelle crée-t-elle une personne morale ?",
  "c": [
   "Non, l’entrepreneur reste une personne physique",
   "Oui, une association",
   "Oui, une société",
   "Oui, un établissement public"
  ],
  "a": 0,
  "e": "Aucune personne juridique nouvelle n’est créée."
 },
 {
  "q": "Que signifie le principe d’unicité du patrimoine ?",
  "c": [
   "Le patrimoine est indivisible entre époux",
   "On ne peut posséder qu’un seul bien",
   "Toute personne a un patrimoine et un seul, qui répond de toutes ses dettes",
   "Chaque entreprise a un compte unique"
  ],
  "a": 2,
  "e": "Théorie d’Aubry et Rau."
 },
 {
  "q": "Quel article du Code civil pose le droit de gage général des créanciers ?",
  "c": [
   "L’article 1101",
   "L’article 1240",
   "L’article 2284",
   "L’article 1832"
  ],
  "a": 2,
  "e": "Tous les biens présents et à venir."
 },
 {
  "q": "Que permet la déclaration d’insaisissabilité ?",
  "c": [
   "Créer une société",
   "Protéger des biens immobiliers non professionnels contre les créanciers professionnels",
   "Ne pas payer ses salariés",
   "Échapper aux impôts"
  ],
  "a": 1,
  "e": "Déclaration notariée publiée (loi de 2003)."
 },
 {
  "q": "Depuis la loi Macron de 2015, la résidence principale de l’entrepreneur individuel est…",
  "c": [
   "Propriété de la banque",
   "Insaisissable seulement après une déclaration",
   "Toujours saisissable",
   "Insaisissable de droit par ses créanciers professionnels"
  ],
  "a": 3,
  "e": "Plus besoin de déclaration notariée pour elle."
 },
 {
  "q": "Qu’est-ce qu’un patrimoine d’affectation ?",
  "c": [
   "Un patrimoine professionnel distinct, affecté à l’activité, seul gage des créanciers professionnels",
   "Le capital social d’une SA",
   "L’épargne salariale",
   "Le patrimoine de l’État"
  ],
  "a": 0,
  "e": "Créé avec l’EIRL en 2010."
 },
 {
  "q": "Peut-on encore créer une EIRL ?",
  "c": [
   "Oui, seulement les commerçants",
   "Non, plus depuis le 15 mai 2022",
   "Oui, sans limite",
   "Oui, seulement en outre-mer"
  ],
  "a": 1,
  "e": "La loi de 2022 a créé un statut unique."
 },
 {
  "q": "Que prévoit la loi du 14 février 2022 pour l’entrepreneur individuel ?",
  "c": [
   "La séparation automatique de ses patrimoines professionnel et personnel",
   "La suppression de l’entreprise individuelle",
   "Un capital minimum de 1 000 €",
   "L’obligation de créer une société"
  ],
  "a": 0,
  "e": "Statut de l’entrepreneur individuel (EI)."
 },
 {
  "q": "Comment l’entrepreneur individuel peut-il étendre le gage d’un créancier professionnel à ses biens personnels ?",
  "c": [
   "Par une renonciation écrite pour un engagement précis, après un délai de réflexion",
   "C’est impossible",
   "Par un simple appel téléphonique",
   "Automatiquement"
  ],
  "a": 0,
  "e": "Article L526-25 du Code de commerce."
 },
 {
  "q": "Le micro-entrepreneur est…",
  "c": [
   "Une forme de société",
   "Un salarié",
   "Une association",
   "Un entrepreneur individuel bénéficiant d’un régime fiscal et social simplifié"
  ],
  "a": 3,
  "e": "Soumis à des plafonds de chiffre d’affaires."
 }
];

const FICHE = "33_entreprendre-seul-lentreprise-individuelle-le-patrimoine-de-_fiche.pdf";
const FDATA = {"title": "Entreprendre seul : l’entreprise individuelle, le patrimoine de l’entrepreneur et sa protection", "blocks": [["h", "La forme la plus simple pour entreprendre", ["L’**entreprise individuelle** est la forme juridique la plus **ancienne** et la plus **simple** : elle découle directement de la **liberté d’entreprendre**. Un commerçant, un artisan, un professionnel libéral ou un agriculteur exerce son activité **en son nom propre**.", "**Aucune personne juridique nouvelle n’est créée** : l’entrepreneur est une **personne physique** ; l’entreprise n’a pas de personnalité morale. Il décide seul, conserve tous les bénéfices (imposés à l’impôt sur le revenu, sauf option pour l’impôt sur les sociétés) et supporte seul les risques.", "Formalités simples et peu coûteuses : déclaration en ligne sur le **guichet unique** (INPI), inscription au **registre national des entreprises** ; pas de capital minimum, pas de statuts."]], ["h", "Le problème : l’unicité du patrimoine", ["Selon la théorie classique d’**Aubry et Rau** (XIXe siècle), toute personne a **un patrimoine et un seul** (**principe d’unicité du patrimoine**), qui répond de **toutes** ses dettes : « quiconque s’est obligé personnellement est tenu de remplir son engagement sur tous ses biens mobiliers et immobiliers, présents et à venir » (article 2284 du Code civil, **droit de gage général**).", "Conséquence historique : l’entrepreneur individuel répondait des dettes de son activité sur **l’ensemble de son patrimoine personnel** (logement, épargne, voiture) : en cas d’échec, il pouvait tout perdre. C’est pourquoi le **risque** est le critère prépondérant du choix d’une forme juridique."]], ["table", "Les réponses successives du législateur pour protéger le patrimoine", ["Mécanisme", "Date", "Contenu"], [["**EURL** (société unipersonnelle)", "Loi du 11 juillet 1985", "Création d’une **société à associé unique** : une **personne morale** distincte, avec son propre patrimoine ; la responsabilité de l’associé est **limitée à ses apports** (puis SASU en 1999)"], ["**Déclaration d’insaisissabilité**", "Loi Dutreil (1er août 2003), étendue en 2008", "Par une **déclaration devant notaire** publiée, l’entrepreneur rend sa **résidence principale**, puis tout bien foncier non affecté à l’activité, **insaisissable** par ses créanciers **professionnels** postérieurs"], ["**Résidence principale insaisissable de droit**", "Loi Macron du 6 août 2015", "La résidence principale est **automatiquement** insaisissable par les créanciers professionnels ; la déclaration notariée reste utile pour les autres biens immobiliers non professionnels"], ["**EIRL** et **patrimoine d’affectation**", "Loi du 15 juin 2010", "Par une déclaration d’affectation, l’entrepreneur crée un **patrimoine d’affectation** professionnel, distinct de son patrimoine personnel, seul gage des créanciers professionnels : **exception au principe d’unicité** ; peu utilisé (formalités) ; **plus aucune EIRL ne peut être créée depuis le 15 mai 2022** (les existantes subsistent)"], ["**Statut unique de l’entrepreneur individuel** (EI)", "Loi du 14 février 2022 (en vigueur le 15 mai 2022)", "**Séparation automatique** du patrimoine **professionnel** et du patrimoine **personnel** (voir ci-dessous)"]]], ["table", "Le statut de l’entrepreneur individuel depuis 2022 (articles L526-22 et suivants du Code de commerce)", ["Règle", "Contenu"], [["Deux patrimoines", "Les biens, droits et obligations **utiles à l’activité professionnelle** (fonds de commerce, matériel, stock, compte bancaire professionnel) forment le **patrimoine professionnel** ; les autres forment le **patrimoine personnel** ; la séparation est **automatique**, sans formalité"], ["Créanciers professionnels", "Leur **gage** est **limité au patrimoine professionnel** : ils ne peuvent saisir les biens personnels"], ["Créanciers personnels", "Gage sur le patrimoine personnel ; s’il est insuffisant, sur le patrimoine professionnel dans la limite du bénéfice du dernier exercice clos"], ["Exceptions", "L’entrepreneur peut **renoncer** à la protection au profit d’un créancier pour un engagement précis (acte écrit séparé, délai de réflexion de 7 jours) ; sûretés personnelles (caution) ; fraude, manœuvres ou manquements graves et répétés aux obligations fiscales et sociales"], ["Transparence", "Mention « entrepreneur individuel » ou « EI » dans la dénomination et les documents ; option possible pour l’impôt sur les sociétés ; transfert universel du patrimoine professionnel possible vers une société"]]], ["h", "Le micro-entrepreneur", ["Le **micro-entrepreneur** (ancien auto-entrepreneur, 2009) n’est **pas une forme juridique** à part : c’est un **entrepreneur individuel** qui bénéficie d’un **régime fiscal et social simplifié** (cotisations et impôt calculés sur le chiffre d’affaires encaissé, comptabilité allégée) tant que son chiffre d’affaires reste sous des **plafonds** fixés par la loi. Il bénéficie, comme tout EI, de la séparation des patrimoines.", "Atouts : création rapide, coûts faibles, adapté pour tester une activité ou compléter un revenu. Limites : plafonds de chiffre d’affaires, charges non déductibles, protection sociale réduite, crédibilité auprès des banques."]], ["h", "Enjeux : choisir de rester seul ou de créer une société", ["L’EI réformée réduit l’écart avec la société unipersonnelle, mais la **société** (EURL, SASU) reste préférable pour **lever des capitaux**, accueillir des associés, **transmettre** l’entreprise ou séparer nettement les rôles (dirigeant, associé).", "Les banques demandent souvent une **caution personnelle** du dirigeant, ce qui limite en pratique la protection, quelle que soit la forme choisie."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Entreprendre seul : l’entreprise individuelle, le patrimoine de l’entrepreneur et sa protection</h1>
    <p class="sub">Terminale STMG Droit – 8.1 L’entreprise individuelle</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
