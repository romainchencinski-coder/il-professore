<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Le contrat de société (article 1832 du Code civil) : apports, affectio societatis, bénéfices et pertes</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quel article définit la société ?",
  "c": [
   "L’article 1832 du Code civil",
   "L’article 1101 du Code civil",
   "L’article 544 du Code civil",
   "L’article L1221-1 du Code du travail"
  ],
  "a": 0,
  "e": "Contrat d’affectation d’apports à une entreprise commune."
 },
 {
  "q": "Quels apports forment le capital social ?",
  "c": [
   "Les apports en industrie uniquement",
   "Les apports en numéraire et en nature",
   "Les salaires des associés",
   "Les emprunts bancaires"
  ],
  "a": 1,
  "e": "L’apport en industrie (travail) n’entre pas dans le capital."
 },
 {
  "q": "Qu’est-ce que l’affectio societatis ?",
  "c": [
   "Un dividende",
   "Un apport en argent",
   "Un contrat de travail",
   "La volonté de collaborer sur un pied d’égalité à l’œuvre commune"
  ],
  "a": 3,
  "e": "Notion dégagée par la jurisprudence."
 },
 {
  "q": "Comment se répartissent en principe les bénéfices entre associés ?",
  "c": [
   "Au prorata des apports",
   "À parts égales toujours",
   "Selon l’âge des associés",
   "Selon le nombre de salariés"
  ],
  "a": 0,
  "e": "Article 1844-1 du Code civil."
 },
 {
  "q": "Qu’est-ce qu’une clause léonine ?",
  "c": [
   "Une clause pénale",
   "Une clause de mobilité",
   "Une clause qui attribue tout le bénéfice à un associé ou l’exonère de toute perte",
   "Une clause de non-concurrence"
  ],
  "a": 2,
  "e": "Elle est réputée non écrite."
 },
 {
  "q": "Quand la société acquiert-elle la personnalité morale ?",
  "c": [
   "Après dix ans",
   "Dès la signature des statuts",
   "Après le premier bénéfice",
   "À compter de son immatriculation au registre"
  ],
  "a": 3,
  "e": "Article 1842 du Code civil."
 },
 {
  "q": "Une société peut-elle être instituée par une seule personne ?",
  "c": [
   "Non, jamais",
   "Oui, dans les cas prévus par la loi (EURL, SASU)",
   "Seulement une association",
   "Oui, toujours sans condition"
  ],
  "a": 1,
  "e": "Article 1832 alinéa 2."
 },
 {
  "q": "Quel organe approuve les comptes annuels ?",
  "c": [
   "Le gérant seul",
   "Le tribunal de commerce",
   "L’assemblée générale des associés (organe délibératif)",
   "Le CSE"
  ],
  "a": 2,
  "e": "Assemblée générale ordinaire."
 },
 {
  "q": "Le gérant de SARL est un organe…",
  "c": [
   "De gestion courante",
   "Juridictionnel",
   "Délibératif",
   "De contrôle de l’État"
  ],
  "a": 0,
  "e": "Il dirige et représente la société."
 },
 {
  "q": "Que confère un apport à l’associé ?",
  "c": [
   "Un droit aux bénéfices, un droit de vote et un droit à l’information, avec une contribution aux pertes",
   "La propriété des biens de la société",
   "Le remboursement assuré de son apport",
   "Un salaire garanti"
  ],
  "a": 0,
  "e": "L’associé n’est pas un créancier."
 }
];

const FICHE = "34_le-contrat-de-societe-article-1832-du-code-civil-apports-aff_fiche.pdf";
const FDATA = {"title": "Le contrat de société (article 1832 du Code civil) : apports, affectio societatis, bénéfices et pertes", "blocks": [["h", "La société naît d’un contrat", ["**Article 1832 du Code civil** : « La société est instituée par **deux ou plusieurs personnes** qui conviennent par un **contrat** d’**affecter à une entreprise commune des biens ou leur industrie** en vue de **partager le bénéfice** ou de **profiter de l’économie** qui pourra en résulter. Elle peut être instituée, dans les cas prévus par la loi, par l’acte de volonté d’**une seule personne**. Les associés s’engagent à **contribuer aux pertes**. »", "L’entreprise individuelle peut évoluer vers une **société**, notamment pour accueillir des associés ou des capitaux. Le contrat de société doit respecter les **conditions de validité de tout contrat** (thème 5) : consentement, capacité, contenu licite et certain ; la société doit avoir un **objet licite** et être gérée dans son **intérêt social** (article 1833)."]], ["table", "Les éléments du contrat de société", ["Élément", "Contenu", "Exemple"], [["**Pluralité d’associés** (ou associé unique)", "Au moins deux associés en principe ; la loi autorise des sociétés unipersonnelles (EURL, SASU)", "Trois amis créent une SAS"], ["**Apports**", "Chaque associé **affecte** quelque chose à l’entreprise commune : argent (**numéraire**), biens (**nature** : local, véhicule, brevet, fonds de commerce) ou travail et savoir-faire (**industrie**). Les apports en numéraire et en nature forment le **capital social** ; en échange, l’associé reçoit des **parts sociales** ou des **actions**", "Lina apporte 20 000 €, Hugo son fonds de commerce"], ["**Affectio societatis**", "**Volonté de collaborer** ensemble, **sur un pied d’égalité**, à l’œuvre commune et d’en accepter les risques (notion dégagée par la jurisprudence) ; elle distingue l’associé d’un simple prêteur ou salarié ; son absence peut révéler une société fictive", "Des associés qui participent aux décisions et partagent les risques"], ["**Vocation aux bénéfices** ou à l’**économie**", "Le but est de **partager les bénéfices** (dividendes) ou de **réaliser une économie** (achats groupés) ; en principe la part de chacun est **proportionnelle à ses apports** (article 1844-1)", "Un associé détenant 40 % du capital reçoit 40 % des dividendes distribués"], ["**Contribution aux pertes**", "Chaque associé supporte les pertes, en principe à proportion de ses apports ; dans les sociétés à responsabilité limitée, la perte est **limitée au montant de ses apports**. La clause qui attribue tout le bénéfice à un associé ou l’exonère de toute perte (**clause léonine**) est **réputée non écrite**", "En cas de faillite d’une SARL, l’associé perd son apport mais pas ses biens personnels"]]], ["h", "Ce qu’implique un apport", ["L’apport confère à l’associé des **droits** : droit au **partage des bénéfices** (dividendes votés par l’assemblée), droit de **participer aux décisions** collectives (droit de vote proportionnel à ses parts, sauf exceptions), droit à l’**information** (comptes, documents), droit sur le **boni de liquidation**.", "Il implique aussi une **contribution aux pertes** et l’acceptation d’un **risque** : l’associé n’est pas un créancier de la société, ses apports ne lui sont pas remboursés comme un prêt."]], ["h", "Une personne morale", ["Les associés rédigent des **statuts écrits** (article 1835 : forme, objet, appellation, siège, capital, durée au plus 99 ans, fonctionnement). La société acquiert la **personnalité morale** à compter de son **immatriculation** au registre (article 1842) : elle devient titulaire d’un **patrimoine propre**, distinct de celui des associés, peut contracter, agir en justice, employer des salariés, être responsable.", "Les décisions sont prises par deux types d’organes : des **organes de gestion courante** (gérant de SARL, président de SAS, conseil d’administration et directeur général de SA) qui dirigent et représentent la société au quotidien ; des **organes délibératifs** (**assemblées générales** d’associés) qui prennent les décisions importantes : approbation des comptes annuels et affectation du résultat (assemblée ordinaire), modification des statuts, augmentation de capital, dissolution (assemblée extraordinaire).", "Depuis la **loi Pacte** (2019), la société est gérée « en prenant en considération les **enjeux sociaux et environnementaux** de son activité » ; elle peut se doter d’une **raison d’être** et devenir **société à mission**."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Le contrat de société (article 1832 du Code civil) : apports, affectio societatis, bénéfices et pertes</h1>
    <p class="sub">Terminale STMG Droit – 8.2 La société commerciale</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
