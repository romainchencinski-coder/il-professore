<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les sources du droit du travail : négociation collective, conventions collectives et partenaires sociaux</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qui sont les partenaires sociaux ?",
  "c": [
   "Les ministres du gouvernement",
   "Les actionnaires",
   "Les juges prud’homaux uniquement",
   "Les représentants des employeurs et des salariés qui négocient"
  ],
  "a": 3,
  "e": "Syndicats et organisations patronales."
 },
 {
  "q": "Comment appelle-t-on un accord signé au niveau national par les confédérations syndicales et patronales ?",
  "c": [
   "Un accord national interprofessionnel (ANI)",
   "Un contrat de travail",
   "Un règlement intérieur",
   "Une convention de branche"
  ],
  "a": 0,
  "e": "Ex. : ANI télétravail de 2020."
 },
 {
  "q": "Qui négocie un accord d’entreprise en présence de syndicats ?",
  "c": [
   "L’employeur et les délégués syndicaux",
   "Le juge et l’avocat",
   "Les clients et les fournisseurs",
   "Le préfet et le maire"
  ],
  "a": 0,
  "e": "À défaut, élus du CSE ou salariés mandatés."
 },
 {
  "q": "À quelle condition un accord d’entreprise est-il valable en principe ?",
  "c": [
   "Il est signé par un seul salarié",
   "Il est approuvé par le maire",
   "Il est publié au Journal officiel",
   "Il est signé par des syndicats représentatifs ayant obtenu plus de 50 % des suffrages"
  ],
  "a": 3,
  "e": "Accord majoritaire (ou 30 % + référendum)."
 },
 {
  "q": "Que permet l’extension d’une convention collective ?",
  "c": [
   "De l’appliquer à l’étranger",
   "De l’appliquer à toutes les entreprises de la branche",
   "De la prolonger de dix ans",
   "De la rendre moins favorable"
  ],
  "a": 1,
  "e": "Arrêté du ministre du Travail."
 },
 {
  "q": "Quelle part des salariés est couverte par une convention collective en France ?",
  "c": [
   "Environ 98 %",
   "Environ 10 %",
   "Environ 25 %",
   "Environ 50 %"
  ],
  "a": 0,
  "e": "Grâce à l’extension des accords de branche."
 },
 {
  "q": "Qu’ont changé les ordonnances de 2017 ?",
  "c": [
   "Elles ont interdit les accords de branche",
   "Elles ont supprimé la loi",
   "Elles donnent la primauté à l’accord d’entreprise dans la plupart des domaines",
   "Elles ont supprimé les syndicats"
  ],
  "a": 2,
  "e": "Sauf domaines réservés à la branche."
 },
 {
  "q": "Quel domaine reste réservé à la branche ?",
  "c": [
   "Les salaires minimaux hiérarchiques",
   "Le choix des fournisseurs",
   "L’organisation des horaires dans l’entreprise",
   "Le règlement intérieur"
  ],
  "a": 0,
  "e": "Bloc 1."
 },
 {
  "q": "Que dit le principe de faveur ?",
  "c": [
   "Le juge favorise l’employeur",
   "Le salarié choisit la loi applicable",
   "Une norme inférieure ne peut déroger à une norme supérieure que dans un sens plus favorable au salarié",
   "L’employeur choisit toujours la règle"
  ],
  "a": 2,
  "e": "Principe traditionnel, aménagé depuis 2016-2017."
 },
 {
  "q": "Quelle organisation internationale élabore des conventions sur le travail ?",
  "c": [
   "Le FMI",
   "L’OMC",
   "L’Organisation internationale du travail (OIT)",
   "L’OCDE"
  ],
  "a": 2,
  "e": "Créée en 1919."
 }
];

const FICHE = "22_les-sources-du-droit-du-travail-negociation-collective-conve_fiche.pdf";
const FDATA = {"title": "Les sources du droit du travail : négociation collective, conventions collectives et partenaires sociaux", "blocks": [["h", "Des sources nombreuses", ["**Sources internationales et européennes** : conventions de l’Organisation internationale du travail (OIT, 1919), directives européennes (temps de travail, information du salarié, travail via des plateformes).", "**Sources étatiques** : Constitution (Préambule de 1946 : droit de grève, liberté syndicale, droit à l’emploi, participation), **lois** et **décrets** réunis dans le **Code du travail**, dont beaucoup sont d’ordre public.", "**Sources professionnelles** (négociées) : **conventions et accords collectifs**, ainsi que les **usages** et engagements unilatéraux de l’employeur, le **règlement intérieur** ; enfin le **contrat de travail** lui-même. La **jurisprudence** (chambre sociale de la Cour de cassation) joue un rôle majeur."]], ["table", "La négociation collective", ["Niveau", "Négociateurs", "Contenu"], [["**Interprofessionnel** (national)", "Confédérations syndicales représentatives (CGT, CFDT, FO, CFE-CGC, CFTC) et organisations patronales (Medef, CPME, U2P)", "**Accords nationaux interprofessionnels** (ANI) souvent repris par la loi : rupture conventionnelle (2008), télétravail (2005 et 2020), assurance chômage"], ["**Branche** (secteur d’activité)", "Fédérations syndicales et patronales de la branche", "**Conventions collectives de branche** (métallurgie, commerce de détail, Syntec…) : classifications, salaires minimaux, période d’essai, CDI de chantier ; environ 200 branches après restructuration"], ["**Entreprise** ou établissement", "Employeur et **délégués syndicaux** (ou, à défaut, élus du CSE ou salariés mandatés, voire référendum dans les petites entreprises)", "**Accords d’entreprise** : temps de travail, rémunérations, télétravail, intéressement, égalité professionnelle"]]], ["h", "Conditions et portée des accords", ["Une **convention collective** porte sur l’ensemble des conditions d’emploi, de formation, de travail et de garanties sociales ; un **accord collectif** sur un ou plusieurs sujets.", "**Validité** d’un accord d’entreprise : signature par des syndicats représentatifs ayant recueilli **plus de 50 %** des suffrages exprimés aux élections professionnelles (accord **majoritaire**), ou plus de 30 % avec approbation des salariés par **référendum**.", "**Extension** : le ministre du Travail peut étendre une convention de branche à toutes les entreprises de la branche, même non adhérentes à l’organisation patronale signataire ; ainsi environ **98 %** des salariés sont couverts par une convention collective.", "Les **partenaires sociaux** sont les représentants des employeurs et des salariés qui négocient ; ils gèrent aussi des organismes paritaires (assurance chômage, retraites complémentaires)."]], ["table", "L’articulation des normes (sans étude exhaustive)", ["Principe", "Contenu"], [["**Ordre public**", "Règles auxquelles aucun accord ne peut déroger (SMIC, durée maximale, repos, libertés fondamentales)"], ["**Principe de faveur** (traditionnel)", "Une norme inférieure ne peut déroger à une norme supérieure que dans un sens plus favorable au salarié ; le contrat de travail peut toujours être plus favorable que l’accord"], ["**Primauté de l’accord d’entreprise** (loi de 2016, ordonnances de 2017)", "Dans la plupart des domaines (organisation du temps de travail, primes…), l’accord d’entreprise **prévaut** sur l’accord de branche, même s’il est moins favorable"], ["Domaines réservés à la **branche**", "Salaires minimaux hiérarchiques, classifications, égalité professionnelle, période d’essai, mesures sur les CDD et l’intérim, CDI de chantier… (bloc 1) ; la branche peut aussi verrouiller certains sujets (bloc 2)"]]], ["h", "Sens de l’évolution", ["Rapprocher la norme du **terrain** pour l’adapter aux réalités économiques de chaque entreprise (compétitivité, emploi) tout en garantissant un socle de protection (ordre public, branche). Critique : risque de dumping social entre entreprises d’une même branche et faiblesse des syndicats dans les petites entreprises."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les sources du droit du travail : négociation collective, conventions collectives et partenaires sociaux</h1>
    <p class="sub">Terminale STMG Droit – 7.1 Le contrat de travail : qualification, pouvoirs de l’employeur et négociation collective</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
