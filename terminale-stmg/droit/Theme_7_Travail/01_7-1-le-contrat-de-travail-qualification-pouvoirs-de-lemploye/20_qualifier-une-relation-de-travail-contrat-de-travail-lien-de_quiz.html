<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Qualifier une relation de travail : contrat de travail, lien de subordination ou contrat d’entreprise</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quels sont les trois éléments du contrat de travail ?",
  "c": [
   "Une prestation de travail, une rémunération et un lien de subordination",
   "Un horaire, un lieu et un uniforme",
   "Un employeur, un syndicat et un juge",
   "Une offre, une acceptation et un écrit"
  ],
  "a": 0,
  "e": "Définition jurisprudentielle."
 },
 {
  "q": "Quel élément est déterminant pour qualifier un contrat de travail ?",
  "c": [
   "Le lien de subordination juridique",
   "L’existence d’un écrit",
   "Le montant de la rémunération",
   "Le nom donné au contrat"
  ],
  "a": 0,
  "e": "Arrêt Société générale, 1996."
 },
 {
  "q": "Comment la Cour de cassation définit-elle le lien de subordination ?",
  "c": [
   "Le pouvoir de l’employeur de donner des ordres, d’en contrôler l’exécution et de sanctionner les manquements",
   "La dépendance économique totale",
   "Le fait de travailler dans les locaux",
   "Le versement d’un salaire élevé"
  ],
  "a": 0,
  "e": "Cass. soc., 13 novembre 1996."
 },
 {
  "q": "Le nom donné au contrat par les parties lie-t-il le juge ?",
  "c": [
   "Non, le juge requalifie selon les conditions réelles d’exercice",
   "Oui, toujours",
   "Oui, si le contrat est écrit",
   "Oui, entre professionnels"
  ],
  "a": 0,
  "e": "Méthode du faisceau d’indices."
 },
 {
  "q": "Qu’est-ce qu’un contrat d’entreprise ?",
  "c": [
   "Un contrat de travail à durée indéterminée",
   "Un contrat de prêt",
   "Un contrat de société",
   "Un contrat par lequel un entrepreneur réalise un ouvrage ou un service en toute indépendance contre un prix"
  ],
  "a": 3,
  "e": "Article 1710 du Code civil."
 },
 {
  "q": "Un auto-entrepreneur immatriculé est présumé…",
  "c": [
   "Associé",
   "Salarié",
   "Non salarié, sauf preuve d’un lien de subordination permanente",
   "Fonctionnaire"
  ],
  "a": 2,
  "e": "Article L8221-6 du Code du travail."
 },
 {
  "q": "Quel arrêt de 2020 a requalifié la relation d’un chauffeur VTC en contrat de travail ?",
  "c": [
   "L’arrêt Blieck",
   "L’arrêt Nikon",
   "L’arrêt Chronopost",
   "L’arrêt Uber (4 mars 2020)"
  ],
  "a": 3,
  "e": "Intégration à un service organisé."
 },
 {
  "q": "Que prévoit la directive (UE) 2024/2831 ?",
  "c": [
   "L’interdiction des plateformes",
   "Une présomption de relation de travail pour les travailleurs des plateformes en cas de contrôle et de direction",
   "Un salaire minimum européen unique",
   "La suppression du salariat"
  ],
  "a": 1,
  "e": "Transposition au plus tard le 2 décembre 2026."
 },
 {
  "q": "À quel ordre public appartient l’essentiel du droit du travail ?",
  "c": [
   "À l’ordre public international",
   "À l’ordre public de direction uniquement",
   "À l’ordre public de protection",
   "À aucun ordre public"
  ],
  "a": 2,
  "e": "On peut y déroger dans un sens plus favorable au salarié."
 },
 {
  "q": "Quel risque court une entreprise qui déguise un salarié en prestataire indépendant ?",
  "c": [
   "Une simple remarque de l’inspecteur",
   "La requalification en contrat de travail et des poursuites pour travail dissimulé",
   "Aucun risque",
   "La perte de sa marque"
  ],
  "a": 1,
  "e": "Charges sociales et sanctions."
 }
];

const FICHE = "20_qualifier-une-relation-de-travail-contrat-de-travail-lien-de_fiche.pdf";
const FDATA = {"title": "Qualifier une relation de travail : contrat de travail, lien de subordination ou contrat d’entreprise", "blocks": [["h", "Un droit protecteur", ["Le **droit du travail** est né au XIXe siècle de la nécessité de **protéger les salariés** (loi de 1841 sur le travail des enfants, loi de 1898 sur les accidents du travail, Code du travail en 1910) : il relève de l’**ordre public de protection** (on ne peut y déroger que dans un sens plus favorable au salarié, sauf exceptions prévues par la loi).", "Il **arbitre** entre les intérêts de l’employeur (flexibilité, compétitivité) et du salarié (sécurité de l’emploi, santé, rémunération). Évolution récente : les normes s’adaptent davantage aux réalités de chaque **entreprise** ou **branche** (lois de 2008, 2016, ordonnances Macron de 2017).", "Le contrat de travail reste **d’abord un contrat** : principes de liberté contractuelle, **liberté d’embauche**, **liberté de licencier** (encadrée), bonne foi (article L1222-1 du Code du travail : il est exécuté de bonne foi)."]], ["table", "Les trois éléments du contrat de travail", ["Élément", "Contenu"], [["Une **prestation de travail**", "Le salarié met sa force de travail, physique ou intellectuelle, à la disposition de l’employeur"], ["Une **rémunération**", "Contrepartie du travail (salaire, au moins égal au SMIC ou au minimum conventionnel) ; le bénévolat n’est pas un contrat de travail"], ["Un **lien de subordination juridique**", "Élément **déterminant** : « l’exécution d’un travail **sous l’autorité d’un employeur** qui a le pouvoir de **donner des ordres et des directives**, d’en **contrôler l’exécution** et de **sanctionner les manquements** de son subordonné » (Cour de cassation, arrêt **Société générale**, 13 novembre 1996)"]]], ["h", "Prouver le lien de subordination : la méthode du faisceau d’indices", ["Le contrat de travail n’est pas nécessairement écrit (sauf CDD, temps partiel…) ; ce sont les **conditions de fait** dans lesquelles l’activité est exercée qui comptent, non le nom donné au contrat par les parties.", "Indices : horaires et lieu imposés, matériel fourni, intégration dans un **service organisé** dont l’employeur fixe unilatéralement les conditions, consignes précises, contrôle de l’activité, pouvoir de sanction, rémunération fixe, exclusivité, absence de clientèle propre.", "Si la relation réunit ces éléments, le juge **requalifie** le contrat en contrat de travail : application de tout le droit du travail (salaire minimum, congés, protection contre le licenciement, cotisations sociales) et éventuellement délit de **travail dissimulé**."]], ["table", "Contrat de travail ou contrat d’entreprise ?", ["", "Contrat de travail", "Contrat d’entreprise (prestation de service)"], [["Définition", "Travail sous l’autorité d’un employeur contre salaire", "Un entrepreneur s’engage à réaliser un ouvrage ou un service, **en toute indépendance**, contre un prix (article 1710 du Code civil, « louage d’ouvrage »)"], ["Lien entre les parties", "**Subordination**", "**Indépendance** : l’entrepreneur organise librement son travail, a sa propre clientèle, fournit son matériel"], ["Rémunération", "Salaire (cotisations sociales, bulletin de paie)", "Prix (facture), risque économique supporté par l’entrepreneur"], ["Droit applicable", "Code du travail (protection, conseil de prud’hommes)", "Droit civil et commercial (tribunal judiciaire ou de commerce)"], ["Intérêt pour l’entreprise", "Contrôle, disponibilité, fidélisation, mais charges et rigidités", "Souplesse, coût variable, pas de licenciement à gérer ; risque de requalification si l’indépendance est fictive"]]], ["h", "Le défi des plateformes numériques", ["Les travailleurs **immatriculés** (auto-entrepreneurs, inscrits au registre du commerce) sont **présumés non salariés** (article L8221-6 du Code du travail), mais la présomption tombe si un lien de subordination permanente est prouvé.", "La Cour de cassation a requalifié en contrat de travail la relation de livreurs (**Take Eat Easy**, 28 novembre 2018 : géolocalisation et système de sanctions) et d’un chauffeur **Uber** (4 mars 2020 : intégration à un service organisé, tarifs fixés, contrôle, déconnexion possible).", "La **directive (UE) 2024/2831** sur le travail via des plateformes crée une **présomption de relation de travail** lorsque des faits indiquent un contrôle et une direction ; elle doit être transposée au plus tard le **2 décembre 2026**. En France, les chauffeurs VTC et livreurs restent en majorité indépendants, avec un dialogue social propre (Autorité des relations sociales des plateformes d’emploi, ARPE, 2021)."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Qualifier une relation de travail : contrat de travail, lien de subordination ou contrat d’entreprise</h1>
    <p class="sub">Terminale STMG Droit – 7.1 Le contrat de travail : qualification, pouvoirs de l’employeur et négociation collective</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
