<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les libertés individuelles du salarié : vie personnelle, liberté d’expression et devoir de loyauté</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quel article fixe les conditions de restriction des libertés du salarié ?",
  "c": [
   "L’article L1121-1 du Code du travail",
   "L’article 1240 du Code civil",
   "L’article L1232-1",
   "L’article 1832 du Code civil"
  ],
  "a": 0,
  "e": "Justification et proportionnalité."
 },
 {
  "q": "À quelles conditions une restriction aux libertés du salarié est-elle licite ?",
  "c": [
   "Si l’employeur la juge utile",
   "Si elle est justifiée par la nature de la tâche et proportionnée au but recherché",
   "Si elle est écrite dans un courriel",
   "Si le salarié est en période d’essai"
  ],
  "a": 1,
  "e": "Article L1121-1."
 },
 {
  "q": "Que décide l’arrêt Nikon (2001) ?",
  "c": [
   "Le salarié a droit au respect de l’intimité de sa vie privée et au secret des correspondances au travail",
   "Les salariés n’ont pas droit à Internet",
   "Les courriels personnels sont interdits",
   "L’employeur peut tout lire sans limite"
  ],
  "a": 0,
  "e": "Cour de cassation, 2 octobre 2001."
 },
 {
  "q": "Un fichier de l’ordinateur professionnel est présumé…",
  "c": [
   "Professionnel, sauf s’il est identifié comme personnel",
   "Illicite",
   "Secret défense",
   "Personnel"
  ],
  "a": 0,
  "e": "L’employeur peut alors l’ouvrir."
 },
 {
  "q": "Avant d’installer une vidéosurveillance, l’employeur doit…",
  "c": [
   "Demander l’avis du maire",
   "Obtenir l’accord du préfet",
   "Informer les salariés et consulter le CSE",
   "Rien du tout"
  ],
  "a": 2,
  "e": "Respect du RGPD et du principe de transparence."
 },
 {
  "q": "Quand la liberté d’expression du salarié devient-elle fautive ?",
  "c": [
   "En cas d’abus : propos injurieux, diffamatoires ou excessifs",
   "Dès qu’il critique son employeur",
   "Dès qu’il parle de son salaire",
   "Jamais"
  ],
  "a": 0,
  "e": "La liberté d’expression est le principe."
 },
 {
  "q": "Des propos critiques tenus dans un groupe privé et fermé sur un réseau social sont en principe…",
  "c": [
   "Une infraction pénale automatique",
   "Une faute grave",
   "Une faute lourde",
   "Une conversation privée qui ne peut être sanctionnée"
  ],
  "a": 3,
  "e": "À la différence d’un profil public."
 },
 {
  "q": "Que recouvre le devoir de loyauté du salarié ?",
  "c": [
   "Adhérer au syndicat de l’employeur",
   "Renoncer à ses congés",
   "Travailler gratuitement",
   "Ne pas concurrencer son employeur, ne pas le dénigrer et respecter la confidentialité"
  ],
  "a": 3,
  "e": "Article L1222-1 : exécution de bonne foi."
 },
 {
  "q": "Une preuve obtenue de façon déloyale est-elle toujours écartée ?",
  "c": [
   "Non, elle est toujours admise",
   "Seulement si elle est écrite",
   "Oui, toujours",
   "Non, le juge peut l’admettre si elle est indispensable et l’atteinte proportionnée"
  ],
  "a": 3,
  "e": "Assemblée plénière, 22 décembre 2023."
 },
 {
  "q": "Qui protège les salariés qui signalent de bonne foi des faits graves ?",
  "c": [
   "Le règlement intérieur",
   "La clause de non-concurrence",
   "Le statut de lanceur d’alerte (lois Sapin II et de 2022)",
   "Le préavis"
  ],
  "a": 2,
  "e": "Protection contre les représailles."
 }
];

const FICHE = "30_les-libertes-individuelles-du-salarie-vie-personnelle-libert_fiche.pdf";
const FDATA = {"title": "Les libertés individuelles du salarié : vie personnelle, liberté d’expression et devoir de loyauté", "blocks": [["h", "Le principe : des libertés maintenues mais encadrées", ["Le salarié reste un **citoyen** dans l’entreprise : il conserve ses libertés fondamentales (vie privée, expression, opinion, religion, liberté de se vêtir…).", "**Article L1121-1 du Code du travail** : « Nul ne peut apporter aux droits des personnes et aux libertés individuelles et collectives de restrictions qui ne seraient pas **justifiées par la nature de la tâche à accomplir** ni **proportionnées au but recherché**. » La même règle s’applique au règlement intérieur (article L1321-3).", "Méthode : 1) identifier la liberté en cause ; 2) identifier la restriction imposée par l’employeur ; 3) vérifier sa **justification** (sécurité, hygiène, image de l’entreprise au contact de la clientèle, protection des données) ; 4) vérifier sa **proportionnalité** (existe-t-il un moyen moins attentatoire ?) ; 5) vérifier la **transparence** (information préalable)."]], ["table", "Le respect de la vie personnelle au travail", ["Situation", "Règles"], [["Courriels et fichiers", "Le salarié a droit, même au temps et au lieu de travail, au **respect de l’intimité de sa vie privée**, qui implique le **secret des correspondances** (arrêt **Nikon**, Cour de cassation, 2 octobre 2001). Les courriels et fichiers sur l’ordinateur professionnel sont **présumés professionnels** : l’employeur peut les ouvrir hors la présence du salarié, **sauf** s’ils sont identifiés comme « **personnels** »"], ["Usage personnel des outils", "Un usage personnel raisonnable de l’ordinateur ou du téléphone professionnel est toléré ; un usage abusif (temps passé, sites illicites) peut être sanctionné"], ["Dispositifs de contrôle", "Vidéosurveillance, géolocalisation, contrôle des connexions : licites s’ils sont **justifiés et proportionnés**, après **information préalable** des salariés et **consultation du CSE** ; pas de filmage permanent d’un poste de travail ni des lieux de pause ; respect du **RGPD** (registre, durée de conservation) sous le contrôle de la **CNIL**"], ["Preuve", "Une preuve obtenue de façon **déloyale** (enregistrement clandestin) n’est plus automatiquement écartée : le juge peut l’admettre si elle est **indispensable** à l’exercice du droit à la preuve et si l’atteinte est **proportionnée** (Assemblée plénière, 22 décembre 2023)"], ["Vie hors travail", "Un fait de la vie personnelle ne peut en principe justifier un licenciement **disciplinaire**, sauf s’il constitue un manquement à une obligation du contrat (loyauté) ou s’il cause un **trouble objectif caractérisé** au fonctionnement de l’entreprise"]]], ["table", "La liberté d’expression", ["Aspect", "Règles"], [["Principe", "Le salarié jouit, dans et hors de l’entreprise, de sa **liberté d’expression** (article 11 de la DDHC), sauf **abus** ; il bénéficie aussi d’un **droit d’expression directe et collective** sur ses conditions de travail (article L2281-1)"], ["Abus", "Propos **injurieux**, **diffamatoires** ou **excessifs** ; dénigrement public de l’employeur ; divulgation d’informations confidentielles"], ["Réseaux sociaux", "Des propos tenus dans un groupe **fermé** et restreint relèvent d’une conversation **privée** (pas de faute) ; des propos **publics** (profil ouvert) dénigrant l’entreprise ou insultant des collègues peuvent être sanctionnés ; l’employeur ne peut utiliser des informations privées obtenues de façon déloyale qu’à des conditions strictes"], ["Lanceurs d’alerte", "Les salariés qui signalent de bonne foi des crimes, délits ou menaces graves pour l’intérêt général sont **protégés** contre les représailles (lois Sapin II de 2016 et du 21 mars 2022)"]]], ["h", "Le devoir de loyauté du salarié", ["Le contrat de travail est exécuté **de bonne foi** (article L1222-1) : pendant son contrat, le salarié ne doit pas **concurrencer** son employeur ni travailler pour un concurrent, ni **détourner** la clientèle, ni **dénigrer** l’entreprise ; il respecte une obligation de **discrétion** et de confidentialité.", "Le devoir de loyauté **limite** la liberté d’expression et la liberté de travailler ; il s’applique même pendant la suspension du contrat (arrêt maladie). Sa violation peut justifier une sanction, voire un licenciement pour faute grave.", "L’employeur est lui aussi tenu à la loyauté : informer, ne pas tendre de piège, payer le salaire, fournir le travail convenu ; il doit respecter le principe de **non-discrimination** (article L1132-1)."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les libertés individuelles du salarié : vie personnelle, liberté d’expression et devoir de loyauté</h1>
    <p class="sub">Terminale STMG Droit – 7.3 Les libertés individuelles et collectives</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
