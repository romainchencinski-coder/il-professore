<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les clauses spécifiques du contrat de travail : mobilité, non-concurrence, télétravail</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Que doit préciser une clause de mobilité pour être valable ?",
  "c": [
   "La date de départ en retraite",
   "La liste des clients",
   "Sa zone géographique d’application",
   "Le salaire du conjoint"
  ],
  "a": 2,
  "e": "L’employeur ne peut l’étendre unilatéralement."
 },
 {
  "q": "Comment la clause de mobilité doit-elle être mise en œuvre ?",
  "c": [
   "Dans l’intérêt de l’entreprise, de bonne foi et avec un délai de prévenance",
   "Pour sanctionner un salarié gréviste",
   "Uniquement le week-end",
   "Par surprise, du jour au lendemain"
  ],
  "a": 0,
  "e": "Respect de la vie personnelle et familiale."
 },
 {
  "q": "Quand s’applique une clause de non-concurrence ?",
  "c": [
   "Pendant la période d’essai seulement",
   "Pendant les congés",
   "Après la rupture du contrat de travail",
   "Avant l’embauche"
  ],
  "a": 2,
  "e": "Pendant le contrat, joue l’obligation de loyauté."
 },
 {
  "q": "Quelle condition de validité de la clause de non-concurrence est exigée depuis 2002 ?",
  "c": [
   "Un écrit notarié",
   "Une contrepartie financière",
   "Une durée minimale de 10 ans",
   "L’accord de l’inspecteur du travail"
  ],
  "a": 1,
  "e": "Cass. soc., 10 juillet 2002."
 },
 {
  "q": "Une clause de non-concurrence sans limitation dans l’espace est…",
  "c": [
   "Valable si le salarié est cadre",
   "Valable",
   "Transformée en clause de mobilité",
   "Nulle"
  ],
  "a": 3,
  "e": "Les conditions sont cumulatives."
 },
 {
  "q": "Quel article encadre le télétravail ?",
  "c": [
   "L’article 1240 du Code civil",
   "L’article L1222-9 du Code du travail",
   "L’article 1832 du Code civil",
   "L’article L1237-11"
  ],
  "a": 1,
  "e": "Accord collectif, charte ou accord individuel."
 },
 {
  "q": "Le refus d’un salarié de passer en télétravail est-il un motif de licenciement ?",
  "c": [
   "Oui, pendant la période d’essai seulement",
   "Non",
   "Oui, toujours",
   "Oui, s’il est cadre"
  ],
  "a": 1,
  "e": "Principe du volontariat."
 },
 {
  "q": "L’employeur peut-il refuser le télétravail à un salarié occupant un poste éligible ?",
  "c": [
   "Seulement avec l’accord du juge",
   "Oui, mais il doit motiver sa réponse",
   "Oui, sans explication",
   "Non, jamais"
  ],
  "a": 1,
  "e": "Article L1222-9."
 },
 {
  "q": "Quand l’employeur peut-il imposer le télétravail ?",
  "c": [
   "Jamais",
   "En cas de circonstances exceptionnelles comme une épidémie",
   "Dès qu’il le souhaite",
   "Seulement aux cadres dirigeants"
  ],
  "a": 1,
  "e": "Article L1222-11 du Code du travail."
 },
 {
  "q": "Un accident survenu au domicile pendant le télétravail est…",
  "c": [
   "Toujours un accident domestique",
   "Exclu de toute prise en charge",
   "Un accident de trajet",
   "Présumé accident du travail"
  ],
  "a": 3,
  "e": "Pendant l’exercice de l’activité professionnelle."
 }
];

const FICHE = "24_les-clauses-specifiques-du-contrat-de-travail-mobilite-non-c_fiche.pdf";
const FDATA = {"title": "Les clauses spécifiques du contrat de travail : mobilité, non-concurrence, télétravail", "blocks": [["h", "Pourquoi des clauses spécifiques ?", ["Elles **individualisent** la relation de travail et l’adaptent aux **contraintes économiques** de l’entreprise (réseau d’agences, protection du savoir-faire, organisation hybride). Parce qu’elles restreignent la liberté du salarié, le juge contrôle strictement leurs **conditions de validité** et leur **mise en œuvre**."]], ["table", "La clause de mobilité", ["Aspect", "Règles"], [["Définition et intérêt", "Le salarié accepte à l’avance que son **lieu de travail** puisse être modifié ; l’employeur gagne en souplesse (redéploiement, ouverture d’agences)"], ["Validité", "Elle doit définir **précisément sa zone géographique** d’application (ex. : « les départements de Bretagne ») et ne peut conférer à l’employeur le pouvoir d’en étendre unilatéralement la portée ; elle doit être **acceptée** par écrit (contrat ou avenant) ; elle doit être justifiée et proportionnée au regard de l’emploi"], ["Mise en œuvre", "Dans l’**intérêt de l’entreprise**, de **bonne foi**, avec un **délai de prévenance** suffisant, sans porter une atteinte disproportionnée à la **vie personnelle et familiale** du salarié (enfant handicapé, conjoint malade)"], ["Effet", "Une mutation régulière s’impose : le refus du salarié peut constituer une faute justifiant un licenciement (cause réelle et sérieuse, pas nécessairement faute grave) ; une mise en œuvre abusive rend le licenciement injustifié"]]], ["table", "La clause de non-concurrence", ["Aspect", "Règles"], [["Définition et intérêt", "Interdit au salarié, **après la rupture** du contrat, d’exercer une activité concurrente (chez un concurrent ou à son compte) : protège la clientèle et le savoir-faire de l’employeur"], ["Conditions de validité **cumulatives** (Cour de cassation, 10 juillet 2002)", "1) **Indispensable** à la protection des **intérêts légitimes** de l’entreprise ; 2) **limitée dans le temps** ; 3) **limitée dans l’espace** ; 4) tenant compte des **spécificités de l’emploi** du salarié ; 5) assortie d’une **contrepartie financière** (indemnité versée après la rupture, quel que soit le mode de rupture)"], ["Sanction", "Clause **nulle** si une condition manque : le salarié retrouve sa liberté et peut obtenir des dommages et intérêts s’il l’a respectée ; s’il viole une clause valable, il doit rembourser la contrepartie et peut être condamné à réparer"], ["Renonciation", "L’employeur peut y renoncer si le contrat ou la convention collective le prévoit, dans le délai fixé (au plus tard à la date du départ effectif en cas de dispense de préavis)"]]], ["table", "Le télétravail (article L1222-9 du Code du travail)", ["Aspect", "Règles"], [["Définition", "Forme d’organisation du travail dans laquelle un travail qui aurait pu être exécuté dans les locaux de l’employeur est effectué par un salarié **hors de ces locaux**, de façon **volontaire**, en utilisant les technologies de l’information et de la communication"], ["Mise en place", "Par **accord collectif** ou, à défaut, **charte** élaborée par l’employeur après avis du CSE ; en l’absence d’accord ou de charte, simple **accord entre l’employeur et le salarié**, formalisé par tout moyen (courriel)"], ["Principes", "**Double volontariat** : le refus du salarié d’accepter un poste en télétravail n’est pas un motif de rupture ; l’employeur qui refuse le télétravail à un salarié occupant un poste éligible doit **motiver** son refus ; **réversibilité** selon les modalités prévues"], ["Droits", "Le télétravailleur a les **mêmes droits** que les autres salariés (tickets-restaurant, formation, évolution) ; un accident survenu sur le lieu de télétravail pendant l’activité est présumé accident du travail ; respect du **droit à la déconnexion** et des plages horaires de contact"], ["Circonstances exceptionnelles", "En cas d’épidémie ou de force majeure, l’employeur peut **imposer** le télétravail (article L1222-11), comme pendant la crise sanitaire de 2020"]]], ["h", "Autres clauses fréquentes", ["Clause d’**exclusivité** (interdiction d’exercer une autre activité pendant le contrat : valable seulement si indispensable, justifiée et proportionnée ; inopposable au temps partiel), clause de **confidentialité**, clause de **dédit-formation** (remboursement d’une formation coûteuse en cas de départ anticipé, sous conditions), clause d’**objectifs**."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les clauses spécifiques du contrat de travail : mobilité, non-concurrence, télétravail</h1>
    <p class="sub">Terminale STMG Droit – 7.1 Le CDI et les autres formes de contrat de travail</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
