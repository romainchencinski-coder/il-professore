<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Une volonté libre et éclairée : obligation d’information et de conseil, protection du consommateur et du cyberconsommateur</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quel article du Code civil impose un devoir général d’information précontractuel ?",
  "c": [
   "L’article 1128",
   "L’article 1240",
   "L’article 1112-1",
   "L’article 1832"
  ],
  "a": 2,
  "e": "Information déterminante légitimement ignorée."
 },
 {
  "q": "Le devoir d’information peut-il être exclu par une clause ?",
  "c": [
   "Oui, toujours",
   "Non, les parties ne peuvent ni le limiter ni l’exclure",
   "Oui, entre professionnels uniquement",
   "Oui, si le contrat est écrit"
  ],
  "a": 1,
  "e": "Article 1112-1 alinéa 5."
 },
 {
  "q": "Combien de jours le consommateur a-t-il pour se rétracter d’un achat en ligne ?",
  "c": [
   "2 ans",
   "7 jours",
   "14 jours",
   "30 jours"
  ],
  "a": 2,
  "e": "Article L221-18 du Code de la consommation."
 },
 {
  "q": "Le consommateur doit-il justifier sa rétractation ?",
  "c": [
   "Oui, il doit prouver un défaut",
   "Oui, il doit obtenir l’accord du vendeur",
   "Non, il se rétracte sans motif et sans pénalité",
   "Oui, devant le juge"
  ],
  "a": 2,
  "e": "Droit de repentir."
 },
 {
  "q": "Quel bien est exclu du droit de rétractation ?",
  "c": [
   "Un téléviseur",
   "Une paire de chaussures standard",
   "Un bien nettement personnalisé selon les demandes du consommateur",
   "Un livre neuf"
  ],
  "a": 2,
  "e": "Article L221-28 du Code de la consommation."
 },
 {
  "q": "Que se passe-t-il si le vendeur n’a pas informé le consommateur de son droit de rétractation ?",
  "c": [
   "Le délai est réduit à 7 jours",
   "Le contrat est nul de plein droit",
   "Le droit disparaît",
   "Le délai est prolongé de 12 mois"
  ],
  "a": 3,
  "e": "Sanction prévue par le Code de la consommation."
 },
 {
  "q": "Quelle est la durée de la garantie légale de conformité pour un bien neuf ?",
  "c": [
   "6 mois",
   "5 ans",
   "10 ans",
   "2 ans"
  ],
  "a": 3,
  "e": "Articles L217-3 et suivants."
 },
 {
  "q": "Que change la règle en vigueur depuis le 11 août 2026 pour le démarchage téléphonique ?",
  "c": [
   "Il faut s’inscrire sur Bloctel pour être protégé",
   "Il est autorisé sans limite",
   "Il est réservé aux banques",
   "Il faut le consentement préalable du consommateur"
  ],
  "a": 3,
  "e": "Loi du 30 juin 2025."
 },
 {
  "q": "Pourquoi le droit protège-t-il davantage le cyberconsommateur ?",
  "c": [
   "Parce qu’il contracte à distance, souvent par adhésion, face à un professionnel mieux informé",
   "Parce qu’il paie plus cher",
   "Parce qu’il est mineur",
   "Parce qu’il ne paie pas de TVA"
  ],
  "a": 0,
  "e": "Asymétrie d’information et risques du numérique."
 },
 {
  "q": "Envers qui le banquier a-t-il un devoir de mise en garde ?",
  "c": [
   "Envers tous les tiers",
   "Envers l’emprunteur non averti, sur le risque d’endettement excessif",
   "Envers les autres banques",
   "Envers l’État"
  ],
  "a": 1,
  "e": "Obligation des professionnels."
 }
];

const FICHE = "05_une-volonte-libre-et-eclairee-obligation-dinformation-et-de-_fiche.pdf";
const FDATA = {"title": "Une volonté libre et éclairée : obligation d’information et de conseil, protection du consommateur et du cyberconsommateur", "blocks": [["h", "Le devoir général d’information (Code civil)", ["**Article 1112-1** : celle des parties qui connaît une information dont l’importance est **déterminante** pour le consentement de l’autre doit l’en informer dès lors que, légitimement, cette dernière ignore cette information ou fait confiance à son cocontractant. Le devoir ne porte pas sur l’estimation de la valeur de la prestation.", "Les parties **ne peuvent ni limiter ni exclure** ce devoir ; son manquement engage la responsabilité de son auteur et peut entraîner la **nullité** pour vice du consentement (réticence dolosive).", "La preuve : celui qui prétend qu’une information lui était due doit le prouver ; l’autre doit prouver qu’il l’a fournie."]], ["h", "L’obligation de conseil et de mise en garde des professionnels", ["Le professionnel doit parfois **aller au-delà de l’information** : il doit **conseiller** son client sur l’adéquation du produit ou du service à ses besoins (vendeur de matériel informatique, installateur, assureur, banquier, notaire).", "Le banquier a un **devoir de mise en garde** envers l’emprunteur non averti sur le risque d’endettement excessif.", "Fondement : déséquilibre de compétences entre un professionnel et un profane ; sanction : responsabilité contractuelle (dommages et intérêts)."]], ["table", "La protection du consommateur (Code de la consommation)", ["Mesure", "Contenu"], [["**Information précontractuelle** (article L111-1)", "Avant tout contrat : caractéristiques essentielles du bien ou du service, prix, délai de livraison, identité et coordonnées du professionnel, garanties légales, fonctionnalités des contenus numériques, possibilité de recourir à un médiateur de la consommation"], ["**Droit de rétractation** (articles L221-18 et suivants)", "Contrats **à distance** (en ligne, par téléphone, catalogue) et **hors établissement** (démarchage à domicile) : **14 jours** pour se rétracter **sans motif** et sans pénalité, à compter de la conclusion (services) ou de la réception du bien ; remboursement dans les 14 jours ; délai prolongé de 12 mois si le consommateur n’a pas été informé de ce droit"], ["Exceptions au droit de rétractation (article L221-28)", "Biens **confectionnés selon les spécifications du consommateur ou nettement personnalisés**, biens périssables, biens descellés pour des raisons d’hygiène, contenus numériques fournis avec l’accord du consommateur, prestations d’hébergement ou de loisirs à date déterminée, journaux, etc."], ["Autres droits de rétractation", "**Crédit à la consommation** : 14 jours ; achat d’un logement neuf ou ancien : 10 jours ; démarchage à domicile : aucun paiement dans les 7 jours"], ["**Démarchage téléphonique**", "Depuis le **11 août 2026** (loi du 30 juin 2025), un professionnel ne peut plus démarcher par téléphone un consommateur qui n’a **pas donné son consentement préalable** (fin de la logique d’opposition Bloctel)"], ["**Garantie légale de conformité** (articles L217-3 et suivants)", "**2 ans** à compter de la délivrance d’un bien neuf : réparation ou remplacement, à défaut réduction du prix ou résolution ; le défaut est présumé exister au moment de la délivrance pendant 24 mois (12 mois pour un bien d’occasion)"], ["**Clauses abusives** (article L212-1)", "Clauses créant un **déséquilibre significatif** au détriment du consommateur : réputées non écrites (voir fiche 5.2)"], ["Résiliation des abonnements", "Depuis juin 2023, un contrat conclu en ligne doit pouvoir être résilié en ligne en quelques clics (« résiliation en trois clics »)"]]], ["h", "Pourquoi une protection renforcée du cyberconsommateur ?", ["**Asymétrie d’information et de puissance** : le consommateur contracte souvent par **adhésion**, face à un professionnel qui rédige les conditions générales et maîtrise l’information.", "**Contrat à distance** : le consommateur ne voit pas le bien, ne peut pas l’essayer, ne connaît pas toujours l’identité du vendeur ; achats impulsifs (achat en un clic, publicité ciblée, influenceurs, interfaces trompeuses ou « dark patterns »).", "**Risques propres au numérique** : fraudes, données personnelles (RGPD, 2018), faux avis, conseils erronés donnés par des intelligences artificielles conversationnelles ; régulation des plateformes (règlement européen sur les services numériques, DSA, applicable depuis 2024).", "Le **cybervendeur** a donc des obligations renforcées : information précontractuelle et confirmation sur support durable, double clic, accusé de réception, rétractation, délai de livraison (30 jours au plus à défaut d’indication), responsabilité de plein droit de la bonne exécution du contrat.", "Cette protection relève de l’**ordre public de protection** : le consommateur ne peut pas y renoncer. Elle rétablit l’équilibre et restaure la **confiance**, condition du développement du commerce en ligne."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Une volonté libre et éclairée : obligation d’information et de conseil, protection du consommateur et du cyberconsommateur</h1>
    <p class="sub">Terminale STMG Droit – 5.1 La formation du contrat</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
