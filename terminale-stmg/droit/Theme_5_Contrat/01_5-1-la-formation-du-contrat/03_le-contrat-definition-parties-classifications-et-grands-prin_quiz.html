<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Le contrat : définition, parties, classifications et grands principes</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Selon l’article 1101 du Code civil, qu’est-ce qu’un contrat ?",
  "c": [
   "Un écrit signé devant notaire",
   "Une décision du juge",
   "Un accord de volontés destiné à créer, modifier, transmettre ou éteindre des obligations",
   "Un fait juridique involontaire"
  ],
  "a": 2,
  "e": "Le contrat est un acte juridique."
 },
 {
  "q": "Qui est le débiteur d’une obligation ?",
  "c": [
   "Celui qui peut l’exiger",
   "Le juge",
   "Le notaire",
   "Celui qui doit exécuter la prestation"
  ],
  "a": 3,
  "e": "Le créancier peut exiger la prestation."
 },
 {
  "q": "Qui est un consommateur au sens du Code de la consommation ?",
  "c": [
   "Toute personne qui achète",
   "Une société qui achète du matériel",
   "Un commerçant qui vend",
   "Une personne physique qui agit à des fins non professionnelles"
  ],
  "a": 3,
  "e": "Article liminaire du Code de la consommation."
 },
 {
  "q": "Un contrat de vente est un contrat…",
  "c": [
   "Gratuit",
   "Synallagmatique",
   "Unilatéral",
   "Réel"
  ],
  "a": 1,
  "e": "Obligations réciproques : livrer et payer."
 },
 {
  "q": "Un abonnement téléphonique aux conditions générales non négociables est un contrat…",
  "c": [
   "Unilatéral",
   "Solennel",
   "De gré à gré",
   "D’adhésion"
  ],
  "a": 3,
  "e": "Article 1110 du Code civil."
 },
 {
  "q": "Quel article pose la force obligatoire du contrat ?",
  "c": [
   "L’article 1832",
   "L’article 1240",
   "L’article 1103 du Code civil",
   "L’article 544"
  ],
  "a": 2,
  "e": "« Les contrats légalement formés tiennent lieu de loi… »"
 },
 {
  "q": "Que signifie l’effet relatif des contrats ?",
  "c": [
   "Le contrat s’impose à tous les citoyens",
   "Le contrat ne crée d’obligations qu’entre les parties",
   "Le juge peut modifier le contrat",
   "Le contrat ne vaut que s’il est relatif à un bien"
  ],
  "a": 1,
  "e": "Article 1199 ; il reste opposable aux tiers."
 },
 {
  "q": "La bonne foi doit être respectée…",
  "c": [
   "Lors de la négociation, de la formation et de l’exécution du contrat",
   "Seulement lors de la signature",
   "Seulement devant le juge",
   "Seulement par le professionnel"
  ],
  "a": 0,
  "e": "Article 1104, d’ordre public."
 },
 {
  "q": "Quelle limite s’impose à la liberté contractuelle ?",
  "c": [
   "Les usages des consommateurs",
   "Le prix du marché",
   "La volonté du créancier",
   "Les règles d’ordre public"
  ],
  "a": 3,
  "e": "Article 1102 alinéa 2."
 },
 {
  "q": "Quelle réforme a refondu le droit commun des contrats ?",
  "c": [
   "Le Code Napoléon de 1904",
   "La loi Hamon de 1985",
   "L’ordonnance du 10 février 2016",
   "La loi Macron de 2015"
  ],
  "a": 2,
  "e": "Entrée en vigueur le 1er octobre 2016."
 }
];

const FICHE = "03_le-contrat-definition-parties-classifications-et-grands-prin_fiche.pdf";
const FDATA = {"title": "Le contrat : définition, parties, classifications et grands principes", "blocks": [["h", "Qu’est-ce qu’un contrat ?", ["**Article 1101 du Code civil** : « Le contrat est un accord de volontés entre deux ou plusieurs personnes destiné à créer, modifier, transmettre ou éteindre des obligations. » C’est un **acte juridique** (une manifestation de volonté destinée à produire des effets de droit), à distinguer du **fait juridique** (accident, dommage) dont les effets ne sont pas voulus.", "Le contrat est le support de l’**échange marchand** (vente, prestation de services), du **travail salarié** (contrat de travail), de la **société** (contrat de société) et de l’**association**. Il matérialise une opération économique.", "Le droit commun des contrats a été réformé par l’**ordonnance du 10 février 2016** (entrée en vigueur le 1er octobre 2016, ratifiée par la loi du 20 avril 2018) : articles 1100 et suivants du Code civil. Des règles spéciales s’ajoutent (Code de la consommation, Code du travail, Code de commerce).", "Une **obligation** est un lien de droit entre un **créancier** (qui peut exiger la prestation) et un **débiteur** (qui doit l’exécuter) : payer une somme, livrer un bien, réaliser un travail, s’abstenir."]], ["table", "Qualifier les parties", ["Qualification", "Définition", "Intérêt"], [["Consommateur", "Personne physique qui agit à des fins qui n’entrent pas dans le cadre de son activité commerciale, industrielle, artisanale, libérale ou agricole (article liminaire du Code de la consommation)", "Bénéficie des règles protectrices du Code de la consommation"], ["Non-professionnel", "Personne morale qui n’agit pas à des fins professionnelles (ex. : une association, un syndicat de copropriétaires)", "Protection partielle (clauses abusives)"], ["Professionnel", "Personne physique ou morale, publique ou privée, qui agit à des fins entrant dans le cadre de son activité commerciale, industrielle, artisanale, libérale ou agricole", "Supporte des obligations renforcées (information, conseil, garanties)"], ["Créancier / débiteur", "Dans un contrat synallagmatique, chaque partie est à la fois créancière et débitrice (le vendeur est créancier du prix et débiteur de la livraison)", "Identifier qui doit quoi à qui"], ["Personne physique / morale", "Un individu / une société, une association, une collectivité", "Capacité, représentation, responsabilité"]]], ["table", "Classer les contrats (articles 1106 à 1111-1 du Code civil)", ["Catégorie", "Définition", "Exemple"], [["Synallagmatique / unilatéral", "Obligations réciproques / obligation d’une seule partie", "Vente / donation, prêt gratuit"], ["À titre onéreux / gratuit", "Chaque partie reçoit un avantage en contrepartie / une partie procure un avantage sans contrepartie", "Bail / prêt gratuit entre amis"], ["Consensuel / solennel / réel", "Formé par le seul échange des consentements / exige une forme (écrit, acte notarié) / exige la remise d’une chose", "Vente d’un bien / vente d’immeuble, contrat de mariage / prêt d’une chose"], ["De gré à gré / d’adhésion", "Stipulations librement négociées / conditions générales soustraites à la négociation, déterminées à l’avance par une partie", "Contrat négocié entre entreprises / abonnement téléphonique, contrat en ligne"], ["À exécution instantanée / successive", "Une seule prestation / prestations échelonnées dans le temps", "Achat d’un livre / bail, abonnement, contrat de travail"], ["Nommé / innommé ; cadre / d’application", "Régi par la loi / non prévu par la loi ; accord fixant les règles générales des contrats futurs", "Vente, bail / contrat de déménagement-garde ; contrat-cadre de distribution"]]], ["table", "Les quatre grands principes du droit des contrats", ["Principe", "Contenu", "Limites et atténuations"], [["**Liberté contractuelle** (article 1102)", "Chacun est libre de contracter ou non, de choisir son cocontractant et de déterminer le contenu et la forme du contrat", "Ne permet pas de déroger aux règles d’**ordre public** ; obligations de contracter (assurance automobile), interdiction des discriminations, contrats imposés (adhésion)"], ["**Force obligatoire** (article 1103)", "« Les contrats légalement formés tiennent lieu de loi à ceux qui les ont faits » : les parties doivent exécuter ; modification ou révocation seulement d’un commun accord (articles 1193)", "Imprévision (article 1195) : renégociation puis révision possible si un changement imprévisible rend l’exécution excessivement onéreuse ; force majeure (article 1218) ; délais de grâce"], ["**Effet relatif** (article 1199)", "Le contrat ne crée d’obligations qu’entre les parties ; les tiers ne peuvent ni en demander l’exécution ni être contraints de l’exécuter", "Le contrat est **opposable** aux tiers (ils doivent le respecter : article 1200) ; stipulation pour autrui (assurance-vie), action directe du sous-traitant"], ["**Bonne foi** (article 1104)", "Les contrats doivent être négociés, formés et exécutés de bonne foi ; disposition d’**ordre public**", "Le juge sanctionne la mauvaise foi (rupture abusive des négociations, mise en œuvre déloyale d’une clause) mais ne peut pas porter atteinte à la substance des droits et obligations"]]], ["h", "Pourquoi ces principes ?", ["Ils viennent de la philosophie des Lumières et de l’**autonomie de la volonté** : l’individu libre s’oblige par sa volonté ; le contrat assure la **sécurité juridique** des échanges (on peut compter sur l’engagement d’autrui).", "Le législateur et le juge les **atténuent** pour garantir l’équilibre contractuel et protéger la partie faible (consommateur, salarié, contrat d’adhésion) ou l’intérêt général."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Le contrat : définition, parties, classifications et grands principes</h1>
    <p class="sub">Terminale STMG Droit – 5.1 La formation du contrat</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
