<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Mettre fin au contrat ou sanctionner : résolution, résiliation, clause pénale et clauses abusives</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quelle est la différence essentielle entre résolution et résiliation ?",
  "c": [
   "La résolution peut être rétroactive, la résiliation ne vaut que pour l’avenir",
   "La résiliation est rétroactive",
   "Elles sont identiques",
   "La résolution concerne seulement les baux"
  ],
  "a": 0,
  "e": "Article 1229 du Code civil."
 },
 {
  "q": "Quel contrat est en principe résilié plutôt que résolu ?",
  "c": [
   "La vente d’un livre",
   "Le don d’un objet",
   "Un abonnement (contrat à exécution successive)",
   "L’achat d’une voiture comptant"
  ],
  "a": 2,
  "e": "Les prestations passées restent acquises."
 },
 {
  "q": "Que faut-il avant de mettre en œuvre une clause résolutoire ?",
  "c": [
   "Un jugement préalable",
   "Rien du tout",
   "Une mise en demeure infructueuse mentionnant la clause",
   "L’accord du débiteur"
  ],
  "a": 2,
  "e": "Article 1225."
 },
 {
  "q": "La résolution par notification se fait…",
  "c": [
   "Sans aucune condition",
   "Aux risques et périls du créancier, en cas d’inexécution suffisamment grave",
   "Avec l’autorisation du juge",
   "Uniquement en cas de force majeure"
  ],
  "a": 1,
  "e": "Article 1226."
 },
 {
  "q": "Un contrat à durée indéterminée peut-il être résilié unilatéralement ?",
  "c": [
   "Non, jamais",
   "Oui, à tout moment, en respectant un préavis",
   "Seulement avec l’accord du juge",
   "Seulement après 10 ans"
  ],
  "a": 1,
  "e": "Les engagements perpétuels sont prohibés (articles 1210 et 1211)."
 },
 {
  "q": "Qu’est-ce qu’une clause pénale ?",
  "c": [
   "Une clause qui fixe à l’avance et forfaitairement les dommages et intérêts dus en cas d’inexécution",
   "Une clause de non-concurrence",
   "Une clause qui annule le contrat",
   "Une clause qui prévoit une peine de prison"
  ],
  "a": 0,
  "e": "Article 1231-5."
 },
 {
  "q": "Que peut faire le juge face à une clause pénale manifestement excessive ?",
  "c": [
   "Annuler tout le contrat",
   "Rien, elle s’impose",
   "La modérer (ou l’augmenter si elle est dérisoire)",
   "Doubler la pénalité"
  ],
  "a": 2,
  "e": "Même d’office."
 },
 {
  "q": "Quel est le critère de la clause abusive ?",
  "c": [
   "Une clause écrite en petits caractères",
   "Un prix élevé",
   "Un déséquilibre significatif entre les droits et obligations des parties",
   "Une clause rédigée par un avocat"
  ],
  "a": 2,
  "e": "Article L212-1 du Code de la consommation."
 },
 {
  "q": "Quelle est la sanction d’une clause abusive ?",
  "c": [
   "Le contrat entier est nul",
   "Le professionnel va en prison",
   "Elle est réputée non écrite, le reste du contrat demeure",
   "Le prix est remboursé"
  ],
  "a": 2,
  "e": "La clause disparaît du contrat."
 },
 {
  "q": "Quel article du Code civil étend la lutte contre les clauses abusives aux contrats d’adhésion ?",
  "c": [
   "L’article 1103",
   "L’article 1128",
   "L’article 1171",
   "L’article 1240"
  ],
  "a": 2,
  "e": "Issu de la réforme de 2016."
 }
];

const FICHE = "08_mettre-fin-au-contrat-ou-sanctionner-resolution-resiliation-_fiche.pdf";
const FDATA = {"title": "Mettre fin au contrat ou sanctionner : résolution, résiliation, clause pénale et clauses abusives", "blocks": [["table", "Trois manières de provoquer la résolution (articles 1224 à 1230)", ["Mode", "Conditions", "Particularités"], [["**Clause résolutoire** (article 1225)", "Le contrat désigne les engagements dont l’inexécution entraînera la résolution ; **mise en demeure** préalable restée infructueuse, mentionnant expressément la clause", "Automatique : le juge ne peut que constater la résolution"], ["**Résolution par notification** (article 1226)", "Le créancier peut, **à ses risques et périls**, résoudre le contrat par notification en cas d’inexécution **suffisamment grave**, après mise en demeure (sauf urgence)", "Le débiteur peut saisir le juge pour contester ; le créancier doit prouver la gravité"], ["**Résolution judiciaire** (article 1227)", "Peut toujours être demandée en justice", "Le juge apprécie la gravité, peut ordonner l’exécution, accorder un délai ou allouer seulement des dommages et intérêts"]]], ["table", "Résolution et résiliation : bien distinguer", ["", "Résolution", "Résiliation"], [["Définition", "Anéantissement du contrat pour inexécution", "Fin du contrat **pour l’avenir** seulement"], ["Effet dans le temps", "**Rétroactif** quand les prestations n’avaient d’utilité que par l’exécution complète : **restitutions** intégrales (article 1229)", "**Pas de rétroactivité** : les prestations déjà échangées et utiles restent acquises (pas de restitution pour la période écoulée)"], ["Contrats concernés", "Contrats à exécution **instantanée** (vente)", "Contrats à **exécution successive** (bail, abonnement, contrat de travail, assurance)"], ["Exemple", "Le canapé n’est pas livré : le contrat est résolu, l’acheteur récupère l’acompte", "L’abonnement salle de sport n’est plus fourni : le contrat est résilié ; les mois déjà consommés restent dus"]]], ["h", "La résiliation unilatérale des contrats à durée indéterminée", ["Les **engagements perpétuels sont prohibés** (article 1210) : chaque partie peut mettre fin à un contrat à durée indéterminée à tout moment, sous réserve de respecter un **préavis** contractuel ou, à défaut, raisonnable (article 1211).", "Un contrat à durée déterminée doit en principe être exécuté jusqu’à son terme ; il peut être prorogé ou renouvelé (articles 1212 à 1215). Résiliation par consentement mutuel toujours possible (article 1193)."]], ["h", "La clause pénale (article 1231-5)", ["**Définition** : clause par laquelle les parties évaluent **à l’avance et forfaitairement** les dommages et intérêts dus par le débiteur en cas d’inexécution (ou de retard). Ex. : pénalité de 100 € par jour de retard dans la livraison d’une maison.", "**Double fonction** : **sanction** comminatoire (elle incite à exécuter) et **sécurisation** (le créancier n’a pas à prouver l’étendue de son préjudice ; l’aléa du procès est anticipé).", "**Pouvoir du juge** : il peut, même d’office, **modérer ou augmenter** la pénalité si elle est **manifestement excessive ou dérisoire** ; en cas d’exécution partielle, la diminuer à proportion. Toute stipulation contraire est réputée non écrite. Sauf inexécution définitive, la pénalité n’est encourue qu’après **mise en demeure**."]], ["table", "La clause abusive : protéger la partie faible", ["Texte", "Champ", "Critère et sanction"], [["**Article L212-1 du Code de la consommation**", "Contrats entre un **professionnel** et un **consommateur** (ou non-professionnel)", "Clause qui crée, au détriment du consommateur, un **déséquilibre significatif** entre les droits et obligations des parties : **réputée non écrite**, le reste du contrat demeure"], ["**Article 1171 du Code civil** (réforme de 2016)", "Tous les **contrats d’adhésion**, y compris entre professionnels ou particuliers", "Clause **non négociable**, déterminée à l’avance par une partie, créant un déséquilibre significatif : réputée non écrite ; l’appréciation ne porte ni sur l’objet principal ni sur l’adéquation du prix"], ["Article L442-1 du Code de commerce", "Relations entre partenaires commerciaux", "Soumettre l’autre partie à des obligations créant un déséquilibre significatif engage la responsabilité de l’auteur (pratique restrictive, thème 8)"]]], ["h", "Repérer une clause abusive", ["**Liste noire** (article R212-1) : clauses **irréfragablement présumées abusives**, toujours interdites : réserver au professionnel le droit de modifier unilatéralement le contrat ou d’interpréter seul ses clauses, **supprimer ou réduire le droit à réparation** du consommateur en cas de manquement du professionnel, interdire au consommateur d’opposer l’exception d’inexécution…", "**Liste grise** (article R212-2) : clauses **présumées abusives**, sauf preuve contraire par le professionnel : pénalité manifestement disproportionnée, délai de résiliation plus long pour le consommateur que pour le professionnel, limitation des moyens de preuve…", "La **Commission des clauses abusives** formule des recommandations ; le juge doit relever d’office le caractère abusif d’une clause ; les associations de consommateurs peuvent agir pour la faire supprimer.", "Sens de la règle : la liberté contractuelle suppose une égalité réelle ; dans un contrat **d’adhésion**, la partie faible ne négocie pas : le droit rétablit l’**équilibre contractuel**."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Mettre fin au contrat ou sanctionner : résolution, résiliation, clause pénale et clauses abusives</h1>
    <p class="sub">Terminale STMG Droit – 5.2 L’exécution du contrat</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
