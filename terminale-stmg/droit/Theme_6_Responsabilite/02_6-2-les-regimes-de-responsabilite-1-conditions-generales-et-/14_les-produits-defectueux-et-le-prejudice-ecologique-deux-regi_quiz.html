<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les produits défectueux et le préjudice écologique : deux régimes spéciaux</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qui est responsable du dommage causé par un défaut d’un produit ?",
  "c": [
   "La victime elle-même",
   "Seulement le vendeur",
   "Le producteur, qu’il soit ou non lié par un contrat avec la victime",
   "L’État"
  ],
  "a": 2,
  "e": "Article 1245 du Code civil."
 },
 {
  "q": "Qu’est-ce qu’un produit défectueux ?",
  "c": [
   "Un produit livré en retard",
   "Un produit qui ne plaît pas",
   "Un produit qui n’offre pas la sécurité à laquelle on peut légitimement s’attendre",
   "Un produit trop cher"
  ],
  "a": 2,
  "e": "C’est un défaut de sécurité."
 },
 {
  "q": "La victime doit-elle prouver une faute du producteur ?",
  "c": [
   "Oui, devant le juge pénal",
   "Oui, si elle n’a pas acheté le produit",
   "Non, il s’agit d’une responsabilité de plein droit",
   "Oui, toujours"
  ],
  "a": 2,
  "e": "Elle prouve le défaut, le dommage et le lien de causalité."
 },
 {
  "q": "Qu’est-ce que le risque de développement ?",
  "c": [
   "Un risque de faillite",
   "Un défaut que l’état des connaissances ne permettait pas de déceler lors de la mise en circulation",
   "Un produit en cours de fabrication",
   "Un risque assuré"
  ],
  "a": 1,
  "e": "Cause d’exonération du producteur."
 },
 {
  "q": "Dans quel délai la victime doit-elle agir ?",
  "c": [
   "30 ans",
   "6 mois",
   "Aucun délai",
   "3 ans à compter de la connaissance du dommage, du défaut et du producteur"
  ],
  "a": 3,
  "e": "La responsabilité s’éteint 10 ans après la mise en circulation."
 },
 {
  "q": "Quel texte a été transposé par la loi du 19 mai 1998 ?",
  "c": [
   "Le traité de Rome",
   "La Convention européenne des droits de l’homme",
   "La directive européenne de 1985 sur les produits défectueux",
   "Le RGPD"
  ],
  "a": 2,
  "e": "Articles 1245 et suivants."
 },
 {
  "q": "Que prévoit la nouvelle directive (UE) 2024/2853 ?",
  "c": [
   "Elle inclut les logiciels et facilite la preuve pour les produits mis sur le marché à partir du 9 décembre 2026",
   "Elle supprime la responsabilité des producteurs",
   "Elle impose une faute prouvée",
   "Elle ne concerne que les voitures"
  ],
  "a": 0,
  "e": "Remplacement de la directive de 1985."
 },
 {
  "q": "Quelle affaire a conduit à reconnaître le préjudice écologique en jurisprudence ?",
  "c": [
   "L’affaire Chronopost",
   "Le naufrage de l’Erika",
   "L’affaire du Mediator",
   "L’incendie de Notre-Dame"
  ],
  "a": 1,
  "e": "Cour de cassation, 25 septembre 2012."
 },
 {
  "q": "Qui peut agir en réparation du préjudice écologique ?",
  "c": [
   "Seulement les propriétaires des terrains",
   "N’importe qui sans condition",
   "Seulement les pêcheurs",
   "Notamment l’État, l’Office français de la biodiversité, les collectivités et les associations de protection de l’environnement"
  ],
  "a": 3,
  "e": "Article 1248 du Code civil."
 },
 {
  "q": "Comment le préjudice écologique est-il réparé en priorité ?",
  "c": [
   "Par une peine de prison",
   "Par une amende",
   "Par une indemnité versée à l’État pour son budget général",
   "En nature, par la remise en état de l’environnement"
  ],
  "a": 3,
  "e": "Article 1249 du Code civil."
 }
];

const FICHE = "14_les-produits-defectueux-et-le-prejudice-ecologique-deux-regi_fiche.pdf";
const FDATA = {"title": "Les produits défectueux et le préjudice écologique : deux régimes spéciaux", "blocks": [["h", "Les produits défectueux : un régime européen", ["Issu de la **directive européenne du 25 juillet 1985**, transposée par la **loi du 19 mai 1998** (articles **1245 à 1245-17** du Code civil). Article 1245 : « Le **producteur** est responsable du dommage causé par un **défaut de son produit**, qu’il soit ou non lié par un contrat avec la victime. »", "Le régime s’applique **à toutes les victimes**, cocontractantes ou tiers (acheteur, utilisateur, passant), à l’exclusion des autres régimes pour un même défaut de sécurité (la victime peut toutefois invoquer la garantie des vices cachés ou une faute distincte)."]], ["table", "Les conditions", ["Élément à prouver par la victime", "Précisions"], [["Un **produit**", "Tout **bien meuble**, même incorporé dans un immeuble, y compris les produits du sol, de l’élevage, de la chasse et de la pêche, et l’**électricité**"], ["Un **défaut**", "Le produit n’offre pas la **sécurité à laquelle on peut légitimement s’attendre** (présentation, notice, usage raisonnablement attendu, date de mise en circulation) : ce n’est pas un simple défaut de fonctionnement mais un **défaut de sécurité**"], ["Un **dommage**", "Atteinte à la **personne** (blessures, décès) ou à un **bien autre que le produit défectueux** lui-même (au-delà d’un seuil de 500 € pour les biens)"], ["Un **lien de causalité**", "Entre le défaut et le dommage ; le juge peut l’admettre à partir de **présomptions graves, précises et concordantes** (ex. : vaccins, médicaments)"]]], ["h", "Le responsable et ses moyens de défense", ["**Producteur** : fabricant d’un produit fini ou d’une partie composante, producteur de matière première, celui qui appose sa marque, importateur dans l’Union européenne. Si le producteur ne peut être identifié, le **vendeur** professionnel est responsable, sauf s’il désigne son fournisseur dans les 3 mois.", "Responsabilité **de plein droit** : la victime n’a pas à prouver de faute. Le producteur s’exonère s’il prouve notamment qu’il **n’avait pas mis le produit en circulation**, que le défaut **n’existait pas** au moment de la mise en circulation, que l’état des connaissances scientifiques et techniques ne permettait pas de déceler le défaut (**risque de développement**), ou que le défaut est dû à la conformité à des **règles impératives** (article 1245-10). La **faute de la victime** peut réduire ou supprimer sa responsabilité.", "**Délais** : action dans les **3 ans** à compter de la date à laquelle la victime a eu ou aurait dû avoir connaissance du dommage, du défaut et de l’identité du producteur ; la responsabilité **s’éteint 10 ans** après la mise en circulation du produit (sauf faute du producteur).", "Exemples : explosion d’une batterie de téléphone, airbag défectueux, médicament aux effets indésirables graves (affaire du Mediator).", "**Évolution** : la **directive (UE) 2024/2853** remplace celle de 1985 pour les produits mis sur le marché à partir du **9 décembre 2026** : elle inclut expressément les **logiciels** (y compris systèmes d’intelligence artificielle) et les mises à jour, et facilite la preuve pour les victimes."]], ["h", "Le préjudice écologique : un régime d’action spécial", ["**Article 1246** : « Toute personne responsable d’un préjudice écologique est tenue de le réparer. » Ce régime, créé par la loi du 8 août 2016 pour la reconquête de la biodiversité, consacre une jurisprudence née de la marée noire de l’**Erika** (Cour de cassation, 25 septembre 2012).", "**Préjudice** : atteinte **non négligeable** aux éléments ou fonctions des écosystèmes ou aux bénéfices collectifs tirés de l’environnement (article 1247) ; il est distinct des préjudices personnels des victimes (pêcheurs, hôteliers), réparés selon le droit commun.", "**Action** ouverte à toute personne ayant qualité et intérêt à agir : État, Office français de la biodiversité, collectivités territoriales, établissements publics, associations agréées ou créées depuis au moins 5 ans pour protéger la nature (article 1248).", "**Réparation par priorité en nature** (article 1249) ; à défaut, dommages et intérêts affectés à la réparation de l’environnement. Les dépenses engagées pour **prévenir** le dommage ou en éviter l’aggravation sont aussi réparables (article 1251). Délai : 10 ans à compter du jour où le titulaire de l’action a connu ou aurait dû connaître la manifestation du préjudice."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les produits défectueux et le préjudice écologique : deux régimes spéciaux</h1>
    <p class="sub">Terminale STMG Droit – 6.2 Les régimes de responsabilité (1) : conditions générales et régimes spéciaux</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
