<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : L’accident du travail et la maladie professionnelle : une réparation forfaitaire automatique</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quelle loi crée le régime d’indemnisation des accidents du travail ?",
  "c": [
   "La loi de 1975 sur la sous-traitance",
   "La loi du 9 avril 1898",
   "La loi Badinter de 1985",
   "La loi du 4 août 1982"
  ],
  "a": 1,
  "e": "Premier régime sans faute fondé sur le risque professionnel."
 },
 {
  "q": "Selon l’article L411-1 du Code de la sécurité sociale, qu’est-ce qu’un accident du travail ?",
  "c": [
   "Tout accident de la vie privée",
   "Seulement un accident mortel",
   "Un accident survenu par le fait ou à l’occasion du travail, quelle qu’en soit la cause",
   "Seulement un accident causé par la faute de l’employeur"
  ],
  "a": 2,
  "e": "La cause importe peu."
 },
 {
  "q": "Que signifie la présomption d’imputabilité ?",
  "c": [
   "L’employeur est présumé innocent",
   "Un accident survenu au temps et au lieu de travail est présumé professionnel",
   "Le salarié est présumé fautif",
   "La victime doit prouver la faute de l’employeur"
  ],
  "a": 1,
  "e": "La victime n’a pas à prouver de faute."
 },
 {
  "q": "Un salarié tombe en vélo sur son trajet direct domicile-travail : de quoi s’agit-il ?",
  "c": [
   "D’un accident de la vie privée sans protection",
   "D’un accident de trajet",
   "D’une maladie professionnelle",
   "D’un accident domestique"
  ],
  "a": 1,
  "e": "Article L411-2 du Code de la sécurité sociale."
 },
 {
  "q": "Dans quel délai l’employeur déclare-t-il l’accident du travail ?",
  "c": [
   "15 jours",
   "48 heures",
   "2 mois",
   "1 an"
  ],
  "a": 1,
  "e": "Déclaration à la CPAM."
 },
 {
  "q": "Quelle est la contrepartie de l’indemnisation automatique pour l’employeur ?",
  "c": [
   "Il peut licencier la victime",
   "Une immunité : la victime ne peut pas en principe l’attaquer selon le droit commun",
   "Il ne paie aucune cotisation",
   "Il fixe lui-même l’indemnité"
  ],
  "a": 1,
  "e": "Compromis de 1898."
 },
 {
  "q": "Qu’est-ce que la faute inexcusable de l’employeur ?",
  "c": [
   "Une faute du salarié",
   "Toute erreur administrative",
   "Avoir eu ou dû avoir conscience du danger sans prendre les mesures de protection nécessaires",
   "Un retard de paiement du salaire"
  ],
  "a": 2,
  "e": "Arrêts amiante de 2002."
 },
 {
  "q": "Quel est l’effet de la faute inexcusable de l’employeur ?",
  "c": [
   "La fermeture de l’entreprise",
   "Une indemnisation complémentaire de la victime (majoration de rente, autres préjudices)",
   "La suppression de toute indemnisation",
   "Une simple amende de 135 €"
  ],
  "a": 1,
  "e": "Elle améliore la réparation."
 },
 {
  "q": "Quel article du Code du travail impose l’obligation de sécurité de l’employeur ?",
  "c": [
   "L’article L1221-1",
   "L’article L2511-1",
   "L’article L1232-1",
   "L’article L4121-1"
  ],
  "a": 3,
  "e": "Prévention des risques professionnels."
 },
 {
  "q": "Qui finance la branche accidents du travail de la Sécurité sociale ?",
  "c": [
   "Les assureurs privés",
   "Les salariés seuls",
   "Les communes",
   "Les employeurs, par leurs cotisations"
  ],
  "a": 3,
  "e": "Cotisations modulées selon la sinistralité."
 }
];

const FICHE = "13_laccident-du-travail-et-la-maladie-professionnelle-une-repar_fiche.pdf";
const FDATA = {"title": "L’accident du travail et la maladie professionnelle : une réparation forfaitaire automatique", "blocks": [["h", "Un régime né de la révolution industrielle", ["La **loi du 9 avril 1898** crée le premier régime de responsabilité **sans faute** : les ouvriers victimes d’accidents (machines, mines) n’avaient pas à prouver la faute de l’employeur, en échange d’une indemnisation **forfaitaire** (le « compromis de 1898 » : **risque professionnel**).", "Depuis 1946, le régime est intégré à la **Sécurité sociale** (branche accidents du travail et maladies professionnelles, AT-MP), financée par les **cotisations des employeurs** ; il est géré par les caisses primaires d’assurance maladie (CPAM)."]], ["table", "Les conditions", ["Notion", "Définition"], [["**Accident du travail** (article L411-1 du Code de la sécurité sociale)", "« Est considéré comme accident du travail, **quelle qu’en soit la cause**, l’accident survenu **par le fait ou à l’occasion du travail** à toute personne salariée » : événement soudain, à une date certaine, causant une lésion corporelle ou psychique"], ["**Présomption d’imputabilité**", "Tout accident survenu **au temps et au lieu du travail** (sous l’autorité de l’employeur) est **présumé** d’origine professionnelle ; la victime n’a pas à prouver de faute ; l’employeur ou la caisse peut prouver une cause totalement étrangère au travail"], ["**Accident de trajet** (article L411-2)", "Accident survenu sur le parcours normal entre la résidence et le lieu de travail (ou le lieu de restauration habituel), sans détour pour un motif personnel"], ["**Maladie professionnelle**", "Maladie inscrite dans un **tableau** (exposition à l’amiante, au bruit, troubles musculo-squelettiques…) ou reconnue par un comité régional d’experts"]]], ["h", "La réparation et ses limites", ["**Démarches** : le salarié informe l’employeur dans les 24 heures ; l’employeur déclare l’accident à la CPAM dans les **48 heures** ; la caisse statue sur le caractère professionnel.", "**Indemnisation forfaitaire**, sans avoir à prouver une faute : soins pris en charge à 100 %, **indemnités journalières** majorées pendant l’arrêt, **rente** ou capital en cas d’incapacité permanente, rente aux ayants droit en cas de décès ; protection contre le licenciement pendant l’arrêt.", "**Contrepartie** : l’employeur bénéficie d’une **immunité** : la victime ne peut pas agir contre lui selon le droit commun pour obtenir une réparation intégrale."]], ["table", "Les fautes qui changent la réparation", ["Faute", "Effet"], [["**Faute inexcusable de l’employeur**", "L’employeur avait ou aurait dû avoir **conscience du danger** auquel était exposé le salarié et n’a pas pris les **mesures nécessaires** pour l’en préserver (arrêts « amiante » de la Cour de cassation, 2002) : majoration de la rente et réparation complémentaire des préjudices (souffrances, préjudice esthétique, d’agrément, déficit fonctionnel permanent)"], ["**Faute intentionnelle** de l’employeur ou d’un préposé", "La victime retrouve une action de droit commun pour une réparation intégrale"], ["Faute d’un **tiers** (autre que l’employeur ou un collègue)", "La victime et la caisse peuvent agir contre ce tiers selon le droit commun"], ["Faute intentionnelle de la victime", "Aucune prestation (l’accident n’est pas « accidentel ») ; une simple imprudence ne prive pas la victime de la protection"]]], ["h", "Prévenir : l’obligation de sécurité de l’employeur", ["L’employeur doit prendre les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs (**article L4121-1 du Code du travail**) : évaluation des risques (document unique), prévention, formation, équipements. Il ne méconnaît pas cette obligation s’il justifie avoir pris toutes les mesures de prévention prévues par la loi.", "Les cotisations AT-MP varient selon la **sinistralité** de l’entreprise : une incitation financière à la prévention."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : L’accident du travail et la maladie professionnelle : une réparation forfaitaire automatique</h1>
    <p class="sub">Terminale STMG Droit – 6.2 Les régimes de responsabilité (1) : conditions générales et régimes spéciaux</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
