<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Le dommage réparable et l’indemnisation des victimes : préjudices, assurance, fonds de garantie</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quelle est la condition première de la responsabilité civile ?",
  "c": [
   "Une condamnation pénale",
   "L’existence d’un contrat",
   "L’existence d’un dommage",
   "Une assurance"
  ],
  "a": 2,
  "e": "Le dommage est une atteinte à un droit."
 },
 {
  "q": "Une perte de chiffre d’affaires est un dommage…",
  "c": [
   "Corporel",
   "Écologique",
   "Matériel",
   "Moral"
  ],
  "a": 2,
  "e": "Atteinte au patrimoine."
 },
 {
  "q": "Les souffrances endurées par une victime constituent un dommage…",
  "c": [
   "Illégitime",
   "Moral (extrapatrimonial)",
   "Matériel",
   "Écologique"
  ],
  "a": 1,
  "e": "Pretium doloris."
 },
 {
  "q": "Quels sont les caractères du dommage réparable ?",
  "c": [
   "Certain, direct, personnel et légitime",
   "Prévisible, grave, ancien et public",
   "Volontaire, fautif, écrit et daté",
   "Matériel, corporel, moral et écologique"
  ],
  "a": 0,
  "e": "Ce sont des conditions de recevabilité."
 },
 {
  "q": "Un gain purement hypothétique est-il réparable ?",
  "c": [
   "Oui, toujours",
   "Oui, si la victime est un professionnel",
   "Oui, s’il est important",
   "Non, le dommage doit être certain"
  ],
  "a": 3,
  "e": "Le dommage éventuel n’est pas réparé."
 },
 {
  "q": "Que signifie le principe de réparation intégrale ?",
  "c": [
   "Doubler l’indemnité",
   "Punir le responsable",
   "Réparer la moitié du dommage",
   "Réparer tout le dommage, mais rien que le dommage"
  ],
  "a": 3,
  "e": "La victime ne doit ni s’appauvrir ni s’enrichir."
 },
 {
  "q": "Comment le Code civil définit-il le préjudice écologique ?",
  "c": [
   "Toute pollution, même minime",
   "Une atteinte non négligeable aux éléments ou fonctions des écosystèmes ou aux bénéfices collectifs tirés de l’environnement",
   "Un dommage subi par un agriculteur",
   "Une infraction pénale"
  ],
  "a": 1,
  "e": "Article 1247 du Code civil (2016)."
 },
 {
  "q": "Comment le préjudice écologique est-il réparé par priorité ?",
  "c": [
   "Par une amende",
   "En nature (remise en état du milieu)",
   "Par une peine de prison",
   "Par une indemnité versée à chaque habitant"
  ],
  "a": 1,
  "e": "Article 1249 du Code civil."
 },
 {
  "q": "Que signifie la mutualisation des risques par l’assurance ?",
  "c": [
   "Le coût des sinistres de quelques-uns est réparti sur l’ensemble des assurés",
   "L’État paie tous les dommages",
   "Chaque assuré paie ses propres dommages",
   "La victime renonce à son indemnité"
  ],
  "a": 0,
  "e": "Grâce aux primes versées."
 },
 {
  "q": "Quel fonds indemnise les victimes d’un conducteur non assuré ou en fuite ?",
  "c": [
   "La CAF",
   "Le FGAO",
   "Le FIVA",
   "L’ONIAM"
  ],
  "a": 1,
  "e": "Fonds de garantie des assurances obligatoires de dommages."
 }
];

const FICHE = "10_le-dommage-reparable-et-lindemnisation-des-victimes-prejudic_fiche.pdf";
const FDATA = {"title": "Le dommage réparable et l’indemnisation des victimes : préjudices, assurance, fonds de garantie", "blocks": [["h", "Le dommage, condition première de la responsabilité civile", ["Sans **dommage**, pas de responsabilité civile : il s’agit d’une **atteinte à un droit** ou à un intérêt de la victime. En STMG, **dommage** et **préjudice** peuvent être considérés comme synonymes.", "La victime doit **prouver** son dommage (factures, certificats médicaux, expertises, attestations)."]], ["table", "Qualifier le dommage", ["Type", "Définition", "Exemples"], [["**Matériel**", "Atteinte aux biens ou au patrimoine : destruction, dégradation, perte financière", "Voiture endommagée, perte de chiffre d’affaires, frais de réparation, perte de salaire"], ["**Corporel**", "Atteinte à l’intégrité physique ou psychique de la personne", "Blessures, invalidité, décès ; il entraîne des préjudices économiques (frais médicaux, perte de revenus) et non économiques"], ["**Moral**", "Atteinte aux sentiments, à l’honneur, à la vie privée", "Souffrances endurées (pretium doloris), préjudice d’affection après le décès d’un proche, atteinte à la réputation, préjudice esthétique"], ["Autre classement", "**Patrimonial** (évaluable en argent par nature) / **extrapatrimonial** (non économique mais compensé en argent)", "Perte de revenus / douleur, perte de qualité de vie"]]], ["table", "Les caractères du dommage réparable", ["Caractère", "Signification", "Exemple"], [["**Certain**", "Réel, actuel ou futur mais inévitable ; un dommage **éventuel** ou hypothétique n’est pas réparable", "Frais de soins futurs certains : réparables ; gain hypothétique : non"], ["**Direct**", "Conséquence directe du fait reproché (lien de causalité)", "Le magasin dont la vitrine est cassée, non le client qui aurait voulu y acheter"], ["**Personnel**", "Subi par celui qui demande réparation ; les proches peuvent agir pour leur propre dommage (**par ricochet**)", "Les parents d’une victime décédée réparent leur préjudice d’affection"], ["**Légitime**", "Atteinte à un intérêt **licite**", "Le trafiquant ne peut être indemnisé de la perte de ses gains illicites"]]], ["h", "La réparation", ["Principe de **réparation intégrale** : « tout le dommage, mais rien que le dommage » ; la victime ne doit ni s’appauvrir ni s’enrichir.", "Formes : **dommages et intérêts** (le plus fréquent) ou **réparation en nature** (remise en état, publication d’un jugement, suppression d’un contenu, restauration d’un milieu naturel)."]], ["h", "Le préjudice écologique (articles 1246 à 1252 du Code civil)", ["Inscrit en 2016 (loi pour la reconquête de la biodiversité, après l’affaire du naufrage de l’**Erika** en 1999 jugée par la Cour de cassation en 2012) : « toute personne responsable d’un préjudice écologique est tenue de le réparer ».", "**Définition** (article 1247) : **atteinte non négligeable** aux éléments ou aux fonctions des **écosystèmes** ou aux bénéfices collectifs tirés par l’homme de l’environnement. C’est un préjudice **collectif**, qui ne touche pas d’abord une personne déterminée.", "Réparation **par priorité en nature** (dépollution, réintroduction d’espèces) ; à défaut, dommages et intérêts **affectés** à la réparation de l’environnement. L’action est ouverte à l’État, à l’Office français de la biodiversité, aux collectivités, aux associations agréées de protection de l’environnement."]], ["h", "L’assurance : la mutualisation des risques", ["**Mécanisme** : de nombreux assurés versent une **prime** (cotisation) à un assureur qui constitue un fonds ; il indemnise ceux qui subissent un **sinistre**. Le coût des dommages de quelques-uns est réparti sur tous (**mutualisation**). Une **franchise** peut rester à la charge de l’assuré.", "Types : assurance de **choses** (dommages aux biens de l’assuré : incendie, vol), de **responsabilité** (dommages causés aux autres : responsabilité civile « vie privée », professionnelle), de **personnes** (santé, décès).", "**Assurances obligatoires** : responsabilité civile automobile (depuis 1958), assurance décennale des constructeurs, risques locatifs du locataire, responsabilité civile de certaines professions (médecins, avocats…).", "Après avoir indemnisé, l’assureur peut se retourner contre le responsable (**subrogation**) ; la victime agit pour la part restée à sa charge."]], ["table", "Un système d’indemnisation à plusieurs étages", ["Acteur", "Rôle"], [["**Sécurité sociale** (1945) et complémentaires santé", "Prennent en charge l’essentiel des dommages **corporels** (soins, indemnités journalières, rentes)"], ["Assureurs de biens et de responsabilité", "Indemnisent les dommages **matériels** et la responsabilité de leurs assurés"], ["**Fonds de garantie** fondés sur la solidarité nationale", "**FGAO** (accidents causés par des conducteurs non assurés ou inconnus), **FGTI** (victimes d’actes de terrorisme et d’infractions), **ONIAM** (accidents médicaux sans faute, 2002), **FIVA** (victimes de l’amiante, 2000), régime des **catastrophes naturelles** (1982)"], ["Responsabilité civile", "Intervient **en second temps** : désigner celui qui doit finalement supporter la charge du dommage"]]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Le dommage réparable et l’indemnisation des victimes : préjudices, assurance, fonds de garantie</h1>
    <p class="sub">Terminale STMG Droit – 6.1 Le dommage réparable</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
