<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : S’exonérer de sa responsabilité : la cause étrangère (force majeure, fait d’un tiers, faute de la victime)</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qu’est-ce qu’une cause étrangère ?",
  "c": [
   "Une faute du responsable",
   "Une décision du juge pénal",
   "Un événement non imputable au responsable qui rompt ou affaiblit le lien de causalité",
   "Une clause du contrat"
  ],
  "a": 2,
  "e": "Force majeure, fait d’un tiers, faute de la victime."
 },
 {
  "q": "Quels sont les caractères classiques de la force majeure en matière extracontractuelle ?",
  "c": [
   "Extériorité, imprévisibilité et irrésistibilité",
   "Faute, dommage et lien",
   "Certitude, légitimité et personnalité",
   "Gravité, rapidité et rareté"
  ],
  "a": 0,
  "e": "Le contractuel retient l’événement échappant au contrôle du débiteur."
 },
 {
  "q": "Quel article définit la force majeure contractuelle ?",
  "c": [
   "L’article 1171",
   "L’article 1218 du Code civil",
   "L’article 1240",
   "L’article L411-1"
  ],
  "a": 1,
  "e": "Issu de la réforme de 2016."
 },
 {
  "q": "Quel est l’effet de la force majeure ?",
  "c": [
   "Aucun effet",
   "Une exonération partielle de 50 %",
   "Une exonération totale du responsable",
   "Une aggravation de la responsabilité"
  ],
  "a": 2,
  "e": "En contrat : suspension ou résolution."
 },
 {
  "q": "Quel est en principe l’effet d’une simple faute de la victime ?",
  "c": [
   "Une exonération partielle (partage de responsabilité)",
   "Une condamnation pénale de la victime",
   "Aucun effet",
   "Une exonération totale"
  ],
  "a": 0,
  "e": "Sauf si elle présente les caractères de la force majeure."
 },
 {
  "q": "Si le fait d’un tiers ne présente pas les caractères de la force majeure, que se passe-t-il ?",
  "c": [
   "Le responsable reste tenu in solidum envers la victime et se retourne contre le tiers",
   "Le tiers seul est poursuivi pénalement",
   "Le responsable est totalement libéré",
   "La victime n’est pas indemnisée"
  ],
  "a": 0,
  "e": "Protection de la victime."
 },
 {
  "q": "Une grève du personnel de l’entreprise débitrice est-elle un cas de force majeure ?",
  "c": [
   "Oui, si elle est nationale",
   "En principe non, car elle n’est pas extérieure",
   "Oui, si elle dure plus d’un jour",
   "Oui, toujours"
  ],
  "a": 1,
  "e": "L’événement doit échapper au contrôle du débiteur."
 },
 {
  "q": "Dans un accident de la circulation, le conducteur peut-il opposer la force majeure au piéton ?",
  "c": [
   "Non, elle est inopposable aux victimes",
   "Oui, si l’accident a eu lieu la nuit",
   "Oui, si le piéton est mineur",
   "Oui, toujours"
  ],
  "a": 0,
  "e": "Article 2 de la loi Badinter."
 },
 {
  "q": "La Covid-19 a-t-elle été automatiquement reconnue comme force majeure ?",
  "c": [
   "Non, jamais",
   "Oui, pour les contrats signés après 2021",
   "Oui, pour tous les contrats",
   "Non, le juge apprécie au cas par cas"
  ],
  "a": 3,
  "e": "Dépend notamment de la date du contrat."
 },
 {
  "q": "Quelle est la dernière étape de la méthode sur l’exonération ?",
  "c": [
   "Conclure à une exonération totale, partielle ou à l’absence d’exonération",
   "Annuler le contrat",
   "Désigner un avocat",
   "Calculer l’amende"
  ],
  "a": 0,
  "e": "Après vérification des caractères de la cause étrangère."
 }
];

const FICHE = "19_sexonerer-de-sa-responsabilite-la-cause-etrangere-force-maje_fiche.pdf";
const FDATA = {"title": "S’exonérer de sa responsabilité : la cause étrangère (force majeure, fait d’un tiers, faute de la victime)", "blocks": [["h", "Principe", ["Le responsable désigné peut **échapper totalement ou partiellement** à son obligation de réparer en prouvant que le dommage est dû, en tout ou partie, à une **cause étrangère** : un événement qui ne lui est pas imputable et qui rompt ou affaiblit le lien de causalité.", "Dans une responsabilité **pour faute**, l’auteur peut aussi contester sa faute ; dans une responsabilité **de plein droit** (fait des choses, d’autrui, produits défectueux, obligation de résultat), seule la cause étrangère (ou les causes prévues par la loi) l’exonère."]], ["table", "Les trois causes étrangères", ["Cause", "Définition", "Effet"], [["**Force majeure** (ou cas fortuit)", "Événement **imprévisible**, **irrésistible** et (en matière extracontractuelle) **extérieur** au responsable : catastrophe naturelle exceptionnelle, guerre, décision de l’autorité publique… En matière contractuelle (article 1218) : événement **échappant au contrôle du débiteur**, qui **ne pouvait être raisonnablement prévu** lors de la conclusion du contrat et dont les effets **ne peuvent être évités** par des mesures appropriées", "Exonération **totale** ; en matière contractuelle : suspension de l’exécution si l’empêchement est temporaire, résolution de plein droit s’il est définitif"], ["**Fait ou faute d’un tiers**", "Intervention d’une personne étrangère au responsable et à la victime (et dont le responsable ne doit pas répondre)", "**Totale** s’il présente les caractères de la force majeure ; sinon, le responsable reste tenu envers la victime **in solidum** avec le tiers et se retourne ensuite contre lui"], ["**Fait ou faute de la victime**", "Comportement de la victime qui a contribué à son propre dommage (imprudence, inattention, acceptation d’un danger évident)", "**Partielle** (partage de responsabilité proportionnel à la gravité des fautes) ; **totale** si elle présente les caractères de la force majeure"]]], ["h", "Apprécier la force majeure", ["L’**imprévisibilité** s’apprécie au jour du contrat (matière contractuelle) ou de l’accident ; l’**irrésistibilité** signifie que l’on ne pouvait ni empêcher l’événement ni en éviter les effets. L’Assemblée plénière (14 avril 2006) a jugé que l’événement doit être imprévisible lors de sa survenance et irrésistible dans ses effets.", "Exemples refusés : une grève interne à l’entreprise (pas extérieure), une pluie ou une neige saisonnières habituelles, une panne mécanique du véhicule du débiteur, une épidémie connue au moment de la conclusion du contrat. Exemples admis : tempête d’une violence exceptionnelle, attentat imprévisible, interdiction administrative soudaine.", "Le juge apprécie **au cas par cas** : la **Covid-19** n’a pas été automatiquement qualifiée de force majeure ; tout dépend de la date du contrat et de la possibilité d’exécuter autrement."]], ["h", "Des exceptions protectrices des victimes", ["Dans les **accidents de la circulation** (loi Badinter), la force majeure et le fait d’un tiers **ne sont pas opposables** aux victimes ; seule la faute de la victime joue, dans des conditions très restrictives (faute inexcusable cause exclusive, recherche volontaire du dommage).", "Dans les **accidents du travail**, l’imprudence du salarié ne le prive pas de l’indemnisation forfaitaire.", "Les parties à un contrat peuvent aménager la force majeure par une clause (liste d’événements, procédure de notification), dans les limites de l’ordre public."]], ["h", "Méthode", ["1) Identifier le régime et le responsable. 2) Rechercher dans les faits un événement susceptible de constituer une cause étrangère. 3) Vérifier ses caractères (extériorité, imprévisibilité, irrésistibilité). 4) Conclure : exonération **totale**, **partielle** (partage) ou **aucune** exonération.", "Exemple : un cycliste roulant de nuit sans éclairage est heurté par une branche tombée d’un arbre mal entretenu (fait des choses). Sa faute a contribué au dommage : exonération **partielle** du gardien de l’arbre, mais pas totale, faute d’imprévisibilité et d’irrésistibilité."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : S’exonérer de sa responsabilité : la cause étrangère (force majeure, fait d’un tiers, faute de la victime)</h1>
    <p class="sub">Terminale STMG Droit – 6.3 Les moyens d’exonération</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
