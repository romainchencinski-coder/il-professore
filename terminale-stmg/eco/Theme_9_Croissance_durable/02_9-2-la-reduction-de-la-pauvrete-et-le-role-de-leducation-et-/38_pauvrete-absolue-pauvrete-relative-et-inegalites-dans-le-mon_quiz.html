<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Pauvreté absolue, pauvreté relative et inégalités dans le monde : mesurer, comprendre, agir</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qu’est-ce que la pauvreté absolue ?",
  "c": [
   "Ne pas disposer du minimum vital pour satisfaire ses besoins fondamentaux",
   "Être au chômage depuis plus d’un an",
   "Avoir un revenu inférieur à la moyenne nationale",
   "Ne pas posséder de logement en propriété"
  ],
  "a": 0,
  "e": "Seuil fixe."
 },
 {
  "q": "Quel est le seuil d’extrême pauvreté de la Banque mondiale depuis juin 2025 ?",
  "c": [
   "3 dollars par jour et par personne",
   "1 dollar par mois",
   "10 dollars par heure",
   "60 % du revenu médian"
  ],
  "a": 0,
  "e": "En parité de pouvoir d’achat de 2021."
 },
 {
  "q": "Combien de personnes vivaient dans l’extrême pauvreté en 2022 ?",
  "c": [
   "Environ 8 millions",
   "Personne",
   "Environ 838 millions",
   "Environ 4 milliards"
  ],
  "a": 2,
  "e": "Environ une personne sur dix."
 },
 {
  "q": "Comment est définie la pauvreté relative en France ?",
  "c": [
   "Un niveau de vie inférieur à 60 % du niveau de vie médian",
   "Un revenu inférieur à 3 dollars par jour",
   "L’absence de diplôme",
   "Un revenu inférieur au SMIC"
  ],
  "a": 0,
  "e": "1 337 € par mois en 2024."
 },
 {
  "q": "Quelle région concentre aujourd’hui l’extrême pauvreté ?",
  "c": [
   "L’Europe de l’Ouest",
   "L’Amérique du Nord",
   "L’Asie de l’Est",
   "L’Afrique subsaharienne"
  ],
  "a": 3,
  "e": "Et les pays en conflit."
 },
 {
  "q": "Quel pays a le plus contribué au recul de la pauvreté mondiale depuis 1990 ?",
  "c": [
   "Les États-Unis",
   "Le Royaume-Uni",
   "La France",
   "La Chine"
  ],
  "a": 3,
  "e": "Grâce à une croissance rapide."
 },
 {
  "q": "Que montre la « courbe de l’éléphant » de Milanovic ?",
  "c": [
   "Tous les pays pauvres se sont appauvris depuis 1988",
   "Les gagnants de la mondialisation sont les classes moyennes des émergents et les plus riches",
   "Les inégalités ont disparu dans tous les pays du monde",
   "La croissance mondiale a été nulle entre 1988 et 2008"
  ],
  "a": 1,
  "e": "Période 1988-2008."
 },
 {
  "q": "Pourquoi la croissance n’est-elle pas suffisante pour réduire la pauvreté ?",
  "c": [
   "Parce qu’elle est interdite dans les pays pauvres",
   "Parce que ses fruits peuvent être inégalement répartis",
   "Parce qu’elle réduit toujours l’emploi",
   "Parce qu’elle fait baisser tous les revenus"
  ],
  "a": 1,
  "e": "Il faut une croissance « pro-pauvres »."
 },
 {
  "q": "Qu’est-ce que le microcrédit ?",
  "c": [
   "Un crédit immobilier à taux zéro pour les primo-accédants",
   "Un prêt de la BCE aux États de la zone euro",
   "Une aide de l’État aux banques en difficulté",
   "De petits prêts accordés à des personnes exclues du système bancaire"
  ],
  "a": 3,
  "e": "Grameen Bank, Muhammad Yunus."
 },
 {
  "q": "Quel est l’objectif d’aide publique au développement des pays riches ?",
  "c": [
   "60 % de leur dette",
   "0,7 % de leur revenu national",
   "3 % de leur PIB",
   "10 % de leurs exportations"
  ],
  "a": 1,
  "e": "Rarement atteint."
 }
];

const FICHE = "38_pauvrete-absolue-pauvrete-relative-et-inegalites-dans-le-mon_fiche.pdf";
const FDATA = {"title": "Pauvreté absolue, pauvreté relative et inégalités dans le monde : mesurer, comprendre, agir", "blocks": [["table", "Deux façons de définir la pauvreté", ["", "Pauvreté absolue", "Pauvreté relative"], [["Définition", "Situation des personnes qui ne disposent pas du **minimum vital** pour satisfaire leurs **besoins fondamentaux** (se nourrir, se loger, se soigner)", "Situation des personnes dont le niveau de vie est **nettement inférieur** à celui de la société dans laquelle elles vivent"], ["Seuil", "**Fixe** : la Banque mondiale retient depuis juin 2025 un seuil d’extrême pauvreté de **3 dollars par jour et par personne** (en parité de pouvoir d’achat de 2021)", "**Relatif** : en France et dans l’UE, **60 % du niveau de vie médian** (1 337 € par mois pour une personne seule en 2024)"], ["Usage", "Comparer la pauvreté dans le monde, surtout dans les pays pauvres et émergents", "Mesurer la pauvreté dans les pays riches : elle évolue avec le niveau de vie général"], ["Données", "Environ **838 millions** de personnes en 2022, soit environ **une personne sur dix**", "France : **15,4 %** de la population en 2024 (9,8 millions de personnes)"]]], ["h", "Le recul de la pauvreté absolue", ["La pauvreté absolue a **fortement reculé** depuis 1990 alors que la population mondiale augmentait : plus d’un tiers de l’humanité vivait alors dans l’extrême pauvreté, contre environ une personne sur dix aujourd’hui. Ce recul s’explique surtout par la **croissance** rapide de la **Chine**, de l’Inde et de l’Asie de l’Est (industrialisation, ouverture aux échanges, investissements en éducation et infrastructures).", "Mais il **ralentit** depuis la crise sanitaire, et l’extrême pauvreté se **concentre** en **Afrique subsaharienne** et dans les pays touchés par des conflits. Selon la Banque mondiale, environ **9 %** de la population mondiale serait encore en extrême pauvreté en 2030 : l’**objectif de développement durable n° 1** (éliminer l’extrême pauvreté d’ici 2030) ne sera pas atteint."]], ["h", "La persistance de la pauvreté relative dans les pays riches", ["En France, le taux de pauvreté est passé de 12,9 % en 2008 à **15,4 %** en 2024, après une période de forte inflation (2021-2023) ; la pauvreté devient plus **durable** : 71,4 % des personnes pauvres en 2023 l’étaient encore en 2024 (Insee). Sont particulièrement touchés les **familles monoparentales**, les **chômeurs**, les jeunes adultes, les personnes peu qualifiées."]], ["table", "Inégalités entre pays et inégalités dans les pays", ["Tendance", "Explication"], [["Les inégalités **entre pays** se réduisent", "Les pays émergents rattrapent en partie les pays riches (croissance plus forte)"], ["Les inégalités **dans** la plupart des pays augmentent", "Depuis les années 1980, hausse de la part des revenus captée par les plus riches (travaux de Thomas [[Piketty|Thomas_Piketty]]), concurrence internationale sur les emplois peu qualifiés, progrès technique favorable aux plus qualifiés"], ["La « **courbe de l’éléphant** » ([[Branko Milanovic|?Branko_Milanović]], 2016)", "Entre 1988 et 2008, les grands gagnants de la mondialisation sont les **classes moyennes des pays émergents** et les **1 % les plus riches** du monde ; les classes populaires et moyennes des pays riches ont peu progressé"], ["La courbe de [[Kuznets|Simon_Kuznets]] (1955)", "Simon Kuznets pensait que les inégalités augmentent puis diminuent avec le développement ; l’évolution depuis 1980 a remis en cause cette idée"]]], ["table", "La croissance suffit-elle ? Les politiques de lutte contre la pauvreté", ["Levier", "Contenu"], [["Croissance", "**Nécessaire** (elle crée emplois et revenus) mais **pas suffisante** : ses fruits doivent être partagés (croissance « pro-pauvres »)"], ["Redistribution et protection sociale", "Transferts monétaires (**Bolsa Família** au Brésil depuis 2003, versée aux familles pauvres si les enfants vont à l’école et sont vaccinés), minima sociaux"], ["Accès au crédit", "**Microcrédit** : petits prêts aux personnes exclues du système bancaire (Grameen Bank de [[Muhammad Yunus|Muhammad_Yunus]], prix Nobel de la paix 2006)"], ["Services essentiels", "Éducation, santé, eau potable, électricité (voir la fiche suivante)"], ["Aide publique au développement", "Objectif de **0,7 %** du revenu national des pays riches, rarement atteint ; l’aide **recule** depuis 2024 (démantèlement de l’agence américaine USAID en 2025, baisses en Europe)"], ["Évaluation", "[[Esther Duflo|Esther_Duflo]], [[Abhijit Banerjee|?Abhijit_Banerjee]] et [[Michael Kremer|?Michael_Kremer]] (prix Nobel 2019) testent l’efficacité des politiques par des **expérimentations** de terrain"]]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Pauvreté absolue, pauvreté relative et inégalités dans le monde : mesurer, comprendre, agir</h1>
    <p class="sub">Terminale STMG Économie – 9.2 La réduction de la pauvreté et le rôle de l’éducation et de la formation</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
