<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : La croissance économique : définition, mesure et sources (facteurs de production, progrès technique, innovation, institutions)</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Comment mesure-t-on la croissance économique ?",
  "c": [
   "Par le taux de croissance du PIB en volume",
   "Par le niveau des prix",
   "Par le taux de chômage",
   "Par le montant de la dette publique"
  ],
  "a": 0,
  "e": "Corrigé de l’inflation."
 },
 {
  "q": "Quelle était la croissance moyenne de la France pendant les Trente Glorieuses ?",
  "c": [
   "Environ 0,5 % par an",
   "Environ 10 % par an",
   "Environ 5 % par an",
   "Environ 1 % par an"
  ],
  "a": 2,
  "e": "1945-1975."
 },
 {
  "q": "Quelle a été la croissance du PIB français en 2025 ?",
  "c": [
   "3,1 %",
   "-0,1 %",
   "0,9 %",
   "5 %"
  ],
  "a": 2,
  "e": "Environ 0,4-0,5 % attendu en 2026."
 },
 {
  "q": "Une croissance obtenue seulement par l’augmentation des quantités de facteurs est…",
  "c": [
   "Endogène",
   "Extensive",
   "Négative",
   "Intensive"
  ],
  "a": 1,
  "e": "La croissance intensive repose sur la productivité."
 },
 {
  "q": "Qu’est-ce que la productivité globale des facteurs ?",
  "c": [
   "Le taux de chômage qui subsiste au sommet du cycle",
   "Le montant des investissements réalisés par les entreprises",
   "Le nombre total de salariés employés dans l’économie",
   "La part de la croissance non expliquée par la hausse des quantités de travail et de capital"
  ],
  "a": 3,
  "e": "Le « résidu » de Solow (1956)."
 },
 {
  "q": "Que montrent les théories de la croissance endogène ?",
  "c": [
   "Que le progrès technique est produit par l’activité économique (recherche, capital humain)",
   "Que la croissance devient impossible dans les pays développés",
   "Que l’État doit cesser de financer l’éducation et la recherche",
   "Que le progrès technique tombe du ciel, sans lien avec l’économie"
  ],
  "a": 0,
  "e": "Romer, Lucas."
 },
 {
  "q": "Pour Schumpeter, qu’est-ce que la destruction créatrice ?",
  "c": [
   "La faillite de l’État qui ne peut plus rembourser sa dette",
   "L’apparition d’activités nouvelles qui en font disparaître d’autres",
   "La destruction volontaire des stocks pour faire monter les prix",
   "La baisse du PIB pendant deux trimestres consécutifs"
  ],
  "a": 1,
  "e": "Les innovations arrivent par grappes."
 },
 {
  "q": "Qui a reçu le prix Nobel d’économie 2025 ?",
  "c": [
   "Philippe Aghion, Peter Howitt et Joel Mokyr",
   "Paul Krugman",
   "Elinor Ostrom",
   "Esther Duflo et Abhijit Banerjee"
  ],
  "a": 0,
  "e": "Croissance tirée par l’innovation."
 },
 {
  "q": "Quelle est la durée de protection d’un brevet ?",
  "c": [
   "20 ans",
   "Illimitée",
   "70 ans",
   "5 ans"
  ],
  "a": 0,
  "e": "En échange de la publication de l’invention."
 },
 {
  "q": "Pourquoi les droits de propriété favorisent-ils la croissance ?",
  "c": [
   "Ils interdisent la concurrence",
   "Ils suppriment les impôts",
   "Ils augmentent les dépenses publiques",
   "Ils incitent à investir et à innover en garantissant les gains"
  ],
  "a": 3,
  "e": "Institutions favorables à la croissance."
 }
];

const FICHE = "33_la-croissance-economique-definition-mesure-et-sources-facteu_fiche.pdf";
const FDATA = {"title": "La croissance économique : définition, mesure et sources (facteurs de production, progrès technique, innovation, institutions)", "blocks": [["h", "Définir et mesurer la croissance", ["La **croissance économique** est l’**augmentation durable** de la production de biens et services d’un pays, sur une longue période. Elle se mesure par le **taux de croissance du PIB en volume** (corrigé de l’inflation) ; le **PIB par habitant** renseigne sur le niveau de vie moyen ; les comparaisons internationales utilisent la **parité de pouvoir d’achat**.", "Elle se distingue de l’**expansion** (hausse de court terme) et du **développement** (transformations qualitatives : santé, éducation, conditions de vie)."]], ["table", "Quelques repères", ["Période ou zone", "Croissance"], [["France, **Trente Glorieuses** (1945-1975)", "Environ **5 % par an**, grâce au progrès technique, à l’innovation protégée par les **brevets** et à la reconstruction ; essoufflement à partir de la fin des années 1970"], ["France, depuis les années 2000", "Environ 1 à 1,5 % par an en moyenne ; **0,9 %** en 2025 ; environ **0,4 à 0,5 %** attendu en 2026 (FMI, gouvernement)"], ["Monde", "**3,1 %** en 2026 selon le FMI (octobre 2026) ; zone euro 1,1 % ; Chine 4,5 % : les **pays émergents** croissent plus vite que les pays développés"]]], ["table", "Les sources de la croissance", ["Source", "Contenu"], [["Plus de **travail**", "Hausse de la population active (démographie, activité des femmes et des seniors), de la durée du travail, de la **qualification** : croissance **extensive** si l’on utilise seulement plus de facteurs"], ["Plus de **capital**", "**Investissement** (formation brute de capital fixe) : machines, bâtiments, logiciels, infrastructures"], ["Une meilleure **productivité**", "Produire plus avec la même quantité de facteurs : croissance **intensive** ; productivité du travail = production / heures travaillées"], ["La **productivité globale des facteurs** (PGF)", "[[Robert Solow|Robert_Solow]] (1956) : la part de la croissance **non expliquée** par la hausse des quantités de travail et de capital (le « **résidu** ») ; elle reflète le **progrès technique**, l’organisation du travail, la qualification, les infrastructures"]]], ["h", "Progrès technique et croissance endogène", ["Le **progrès technique** désigne l’ensemble des innovations qui améliorent les produits et les méthodes de production. Pour Solow, il « tombait du ciel » ; les théories de la **croissance endogène** ([[Paul Romer|Paul_Romer]], 1990 ; [[Robert Lucas|?Robert_Lucas]], 1988) montrent qu’il est **produit par l’activité économique elle-même** : investissement en **recherche et développement**, en **capital humain** (éducation, formation), en **infrastructures publiques**.", "Ces investissements ont des **externalités positives** (les connaissances se diffusent) : la croissance peut s’**auto-entretenir**. L’État a un rôle à jouer : financement de l’éducation et de la recherche, protection de la propriété intellectuelle."]], ["table", "L’innovation selon Joseph Schumpeter", ["Notion", "Contenu"], [["Invention et innovation", "L’**invention** est une découverte ; l’**innovation** est son **application économique** par un entrepreneur"], ["Cinq formes d’innovation", "Nouveau **produit**, nouveau **procédé** de production, nouvelle **organisation**, nouveau **débouché** (marché), nouvelle **source de matières premières**"], ["Destruction créatrice", "Les innovations font naître de nouvelles activités et en font disparaître d’autres (le smartphone a remplacé l’appareil photo compact et le GPS) ; elles arrivent par **grappes**"], ["Prolongements", "[[Philippe Aghion|Philippe_Aghion]], [[Peter Howitt|?Peter_Howitt]] et [[Joel Mokyr|?Joel_Mokyr]] ont reçu le prix Nobel d’économie **2025** pour avoir expliqué la croissance tirée par l’innovation et la destruction créatrice"]]], ["table", "Le rôle des institutions", ["Institution", "Effet sur la croissance"], [["**Droits de propriété**", "Garantir la propriété des biens et des idées incite à investir et à innover. Le **brevet** donne à l’inventeur un **monopole d’exploitation de 20 ans** en échange de la publication de l’invention (INPI en France, brevet unitaire européen depuis 2023)"], ["État de droit et stabilité", "Justice indépendante, respect des contrats, faible corruption, stabilité politique"], ["**Système financier**", "Il collecte l’épargne et finance l’investissement et l’innovation (crédit bancaire, Bourse, capital-risque pour les start-up)"], ["Institutions inclusives", "Daron [[Acemoglu|?Daron_Acemoglu]], Simon Johnson et James [[Robinson|?James_Robinson_économiste]] (prix Nobel 2024) : les pays dont les institutions protègent les droits de tous prospèrent davantage que ceux dont les institutions profitent à une élite (institutions « extractives »)"]]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : La croissance économique : définition, mesure et sources (facteurs de production, progrès technique, innovation, institutions)</h1>
    <p class="sub">Terminale STMG Économie – 9.1 Les sources d’une croissance économique soutenable</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
