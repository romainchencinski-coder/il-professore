<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les biens publics mondiaux et la nécessité de la coopération internationale</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qu’est-ce qu’un bien public mondial ?",
  "c": [
   "Un bien appartenant en propre à l’Organisation des Nations unies",
   "Un bien non rival et non exclusif dont les bénéfices concernent tous les pays",
   "Un bien échangé sur le marché mondial à un prix unique",
   "Un bien produit et vendu par une firme multinationale"
  ],
  "a": 1,
  "e": "Ex. : climat stable, couche d’ozone."
 },
 {
  "q": "Quel exemple est un bien public mondial ?",
  "c": [
   "Une autoroute à péage",
   "Un climat stable",
   "Un champ privé",
   "Un smartphone"
  ],
  "a": 1,
  "e": "Non rival et non exclusif à l’échelle mondiale."
 },
 {
  "q": "Pourquoi les biens publics mondiaux sont-ils sous-produits ?",
  "c": [
   "Parce qu’ils sont interdits",
   "Parce que les marchés les produisent en excès",
   "Parce que chaque État a intérêt à laisser les autres faire les efforts",
   "Parce qu’ils sont trop rentables"
  ],
  "a": 2,
  "e": "Passager clandestin."
 },
 {
  "q": "Quel accord est souvent cité comme un succès de la coopération ?",
  "c": [
   "Le protocole de Kyoto sur les émissions de gaz à effet de serre",
   "La COP30 de Belém sur la sortie des énergies fossiles",
   "Le cycle de Doha sur le commerce et le développement",
   "Le protocole de Montréal sur la couche d’ozone (1987)"
  ],
  "a": 3,
  "e": "Interdiction progressive des CFC."
 },
 {
  "q": "Quel est l’objectif de l’accord de Paris (2015) ?",
  "c": [
   "Permettre aux pays pauvres de doubler leurs émissions",
   "Contenir le réchauffement nettement en dessous de 2 °C et viser 1,5 °C",
   "Interdire le commerce international de produits fossiles",
   "Supprimer toutes les voitures thermiques dès 2020"
  ],
  "a": 1,
  "e": "Contributions nationales révisées tous les cinq ans."
 },
 {
  "q": "Que signifie le principe des responsabilités communes mais différenciées ?",
  "c": [
   "Tous les pays font exactement les mêmes efforts, quels que soient leurs moyens",
   "Aucun pays n’est responsable du changement climatique",
   "Seuls les pays pauvres doivent réduire leurs émissions",
   "Tous les pays doivent agir, mais les efforts dépendent de leur responsabilité et de leurs moyens"
  ],
  "a": 3,
  "e": "Rio, 1992."
 },
 {
  "q": "Qu’a décidé la COP30 de Belém (2025) ?",
  "c": [
   "Une feuille de route obligatoire de sortie des énergies fossiles",
   "La création de l’OMC",
   "La fin de l’accord de Paris",
   "Un appel à tripler le financement de l’adaptation d’ici 2035"
  ],
  "a": 3,
  "e": "Pas d’accord sur la sortie des fossiles."
 },
 {
  "q": "Quel pays est sorti de l’accord de Paris et de l’OMS en janvier 2026 ?",
  "c": [
   "Le Brésil",
   "La France",
   "La Chine",
   "Les États-Unis"
  ],
  "a": 3,
  "e": "Deuxième émetteur mondial."
 },
 {
  "q": "Quel est l’objectif de l’accord de Kunming-Montréal (2022) ?",
  "c": [
   "Interdire la pêche partout",
   "Réduire les droits de douane",
   "Créer une monnaie mondiale",
   "Protéger 30 % des terres et des mers d’ici 2030"
  ],
  "a": 3,
  "e": "Biodiversité."
 },
 {
  "q": "Que proposent les « clubs climatiques » de Nordhaus ?",
  "c": [
   "Une subvention mondiale aux énergies fossiles les moins chères",
   "La suppression des conférences annuelles sur le climat (COP)",
   "Un prix du carbone commun et une taxe sur les importations des pays non participants",
   "L’interdiction des voitures électriques importées de Chine"
  ],
  "a": 2,
  "e": "Pour limiter le passager clandestin."
 }
];

const FICHE = "37_les-biens-publics-mondiaux-et-la-necessite-de-la-cooperation_fiche.pdf";
const FDATA = {"title": "Les biens publics mondiaux et la nécessité de la coopération internationale", "blocks": [["h", "Qu’est-ce qu’un bien public mondial ?", ["Un **bien public mondial** est un bien **non rival** et **non exclusif** (voir les biens publics, fiche 6.2) dont les bénéfices s’étendent à **tous les pays**, à toutes les populations et aux **générations futures** : un **climat stable**, la **qualité de l’air**, la couche d’**ozone**, la **biodiversité**, la **santé mondiale** (prévention des pandémies), la stabilité financière, la paix, la connaissance.", "Aucun État ne peut les produire ou les protéger **seul**, et aucun marché ne les fournit spontanément."]], ["h", "Le problème du passager clandestin entre États", ["Chaque pays supporte seul le **coût** de ses efforts (réduire ses émissions, vacciner, protéger ses forêts) alors que les **bénéfices** profitent à tous. Chacun a donc intérêt à laisser les autres agir : c’est le comportement de **passager clandestin** à l’échelle mondiale, qui conduit à une **sous-production** du bien public mondial.", "S’y ajoutent des questions d’**équité** : les pays riches sont historiquement responsables de la plupart des émissions, les pays pauvres en subissent fortement les effets et revendiquent leur droit au développement. D’où le principe des **responsabilités communes mais différenciées** (Rio, 1992).", "Seule la **coopération internationale** (accords, institutions, financements, sanctions) permet de dépasser ce dilemme."]], ["table", "La coopération internationale : exemples", ["Domaine", "Accords et institutions"], [["Couche d’ozone", "**Protocole de Montréal** (1987) : interdiction progressive des CFC, ratifié par tous les pays ; la couche d’ozone est en voie de reconstitution : un **succès** de la coopération"], ["Climat", "**Convention-cadre des Nations unies** (1992), **protocole de Kyoto** (1997), **accord de Paris** (COP21, 2015) : contenir le réchauffement « nettement en dessous de 2 °C » et poursuivre l’effort pour 1,5 °C, grâce à des **contributions nationales** révisées tous les cinq ans ; **GIEC** (1988) pour l’expertise scientifique"], ["Négociations récentes", "COP28 (Dubaï, 2023) : appel à une « **transition hors des énergies fossiles** » ; COP29 (Bakou, 2024) : financement climat de **300 Md$** par an d’ici 2035 ; **COP30** (Belém, novembre 2025) : appel à tripler le financement de l’**adaptation** d’ici 2035, mais pas de feuille de route sur la sortie des fossiles"], ["Biodiversité", "Accord de **Kunming-Montréal** (2022) : protéger 30 % des terres et des mers d’ici 2030 ; traité sur la **haute mer** (2023), entré en vigueur en **janvier 2026**"], ["Santé", "**Organisation mondiale de la santé** (1948) ; **accord sur les pandémies** adopté en mai 2025"]]], ["table", "Les obstacles", ["Obstacle", "Explication"], [["Souveraineté des États", "Il n’existe pas de gouvernement mondial capable d’imposer et de **sanctionner** : les engagements reposent sur la bonne volonté"], ["Intérêts divergents", "Pays producteurs d’énergies fossiles, pays émergents, pays vulnérables n’ont pas les mêmes priorités ; règle du **consensus** dans les COP"], ["Retraits", "Les **États-Unis**, deuxième émetteur mondial, sont sortis de l’**accord de Paris** et de l’**OMS** (retraits effectifs en janvier 2026)"], ["Financement", "Les pays en développement réclament davantage d’aide pour s’adapter ; promesses souvent tenues avec retard"]]], ["h", "Des pistes pour coopérer", ["**Financements** et transferts de technologies vers les pays du Sud (Fonds vert pour le climat, 2010) ; **mécanismes d’ajustement aux frontières** pour éviter le passager clandestin (MACF européen) ; **clubs climatiques** proposés par [[William Nordhaus|William_Nordhaus]] (prix Nobel 2018) : des pays ambitieux appliquent un prix du carbone commun et taxent les importations des pays qui ne participent pas ; mobilisation des villes, des entreprises et des citoyens."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les biens publics mondiaux et la nécessité de la coopération internationale</h1>
    <p class="sub">Terminale STMG Économie – 9.1 Les sources d’une croissance économique soutenable</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
