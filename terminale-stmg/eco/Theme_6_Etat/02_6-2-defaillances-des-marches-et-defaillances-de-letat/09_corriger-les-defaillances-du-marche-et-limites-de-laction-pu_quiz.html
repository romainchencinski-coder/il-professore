<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Corriger les défaillances du marché et limites de l’action publique : les défaillances de l’État</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quel instrument corrige une externalité négative par le prix ?",
  "c": [
   "Une baisse des droits de douane",
   "Une taxe sur le pollueur",
   "Une subvention au pollueur",
   "Un label de qualité"
  ],
  "a": 1,
  "e": "Principe pollueur-payeur."
 },
 {
  "q": "Comment l’État finance-t-il les biens publics ?",
  "c": [
   "Par l’impôt",
   "Par des dons volontaires uniquement",
   "Par les droits de douane exclusivement",
   "Par la vente au prix du marché"
  ],
  "a": 0,
  "e": "Le paiement est obligatoire."
 },
 {
  "q": "Qu’est-ce qu’une défaillance de l’État ?",
  "c": [
   "Une intervention publique qui ne corrige pas, corrige mal ou crée de nouvelles inefficacités",
   "Un refus de l’État de lever des impôts nouveaux",
   "Une faillite de l’État qui ne peut plus payer ses fonctionnaires",
   "La privatisation d’une entreprise publique déficitaire"
  ],
  "a": 0,
  "e": "L’intervention peut elle-même dysfonctionner."
 },
 {
  "q": "Quel courant souligne que les élus poursuivent aussi leurs propres intérêts ?",
  "c": [
   "La théorie des choix publics",
   "Le mercantilisme",
   "Le keynésianisme",
   "La théorie des avantages comparatifs"
  ],
  "a": 0,
  "e": "James Buchanan, prix Nobel 1986."
 },
 {
  "q": "Une aide à l’embauche versée pour un recrutement qui aurait eu lieu de toute façon est…",
  "c": [
   "Un aléa moral",
   "Un bien public",
   "Une externalité positive",
   "Un effet d’aubaine"
  ],
  "a": 3,
  "e": "Coût sans effet réel."
 },
 {
  "q": "Que désigne la « capture » de la décision publique ?",
  "c": [
   "L’influence de groupes d’intérêt qui obtiennent des décisions qui les favorisent",
   "La prise de contrôle d’une entreprise par l’État",
   "La saisie de biens par un huissier",
   "L’arrestation d’un fraudeur fiscal"
  ],
  "a": 0,
  "e": "Lobbying, niches fiscales."
 },
 {
  "q": "Quel exemple illustre une inaction de l’État reconnue par un juge ?",
  "c": [
   "Le plan France 2030",
   "La privatisation de la Française des jeux",
   "L’« Affaire du siècle » sur le climat (2021)",
   "La création de la Sécurité sociale"
  ],
  "a": 2,
  "e": "Carence fautive de l’État."
 },
 {
  "q": "Quel organisme évalue l’usage de l’argent public en France ?",
  "c": [
   "La Cour des comptes",
   "La Banque centrale européenne",
   "L’Organe de règlement des différends",
   "Le Conseil constitutionnel"
  ],
  "a": 0,
  "e": "Elle contrôle et évalue les politiques publiques."
 },
 {
  "q": "Quel exemple est cité pour la mauvaise gestion d’un service public ?",
  "c": [
   "Les difficultés des hôpitaux et des urgences",
   "La politique monétaire de la BCE",
   "Le marché des voitures d’occasion",
   "L’éclairage public"
  ],
  "a": 0,
  "e": "Exemple proposé par les ressources officielles."
 },
 {
  "q": "Comment limiter les défaillances de l’État ?",
  "c": [
   "En renonçant à toute évaluation des dispositifs publics",
   "En évaluant les politiques publiques et en assurant la transparence",
   "En supprimant le contrôle du Parlement sur le budget",
   "En multipliant les niches fiscales et les aides ciblées"
  ],
  "a": 1,
  "e": "Cour des comptes, HATVP, autorités indépendantes."
 }
];

const FICHE = "09_corriger-les-defaillances-du-marche-et-limites-de-laction-pu_fiche.pdf";
const FDATA = {"title": "Corriger les défaillances du marché et limites de l’action publique : les défaillances de l’État", "blocks": [["table", "À chaque défaillance du marché, ses instruments", ["Défaillance", "Instruments de l’État", "Exemples"], [["Asymétries d’information", "Obligation d’information, labels, contrôle par des autorités indépendantes, sanctions des fraudes", "Étiquetage de l’origine des viandes, AMF, DGCCRF"], ["Pouvoir de marché", "Politique de la concurrence, régulation sectorielle, production publique des monopoles naturels", "Amendes de l’Autorité de la concurrence, ARCEP, SNCF Réseau"], ["Externalités négatives", "**Réglementation** (normes, interdictions), **taxation** (pollueur-payeur), **marchés de quotas** d’émission", "Normes d’émission des véhicules, taxe sur les carburants, système d’échange de quotas européen"], ["Externalités positives", "**Subventions**, obligations, production publique", "Vaccinations obligatoires, crédit d’impôt recherche, école gratuite"], ["Biens publics", "Production ou financement public par l’**impôt**", "Défense, éclairage public, recherche fondamentale"], ["Biens communs", "Quotas, permis, droits d’accès, coopération internationale", "Quotas de pêche, limitation des prélèvements d’eau, accords sur le climat"]]], ["h", "Les défaillances de l’État : définition", ["On parle de **défaillance de l’État** lorsque l’intervention publique **ne corrige pas** la défaillance du marché, la **corrige mal**, ou **crée de nouvelles inefficacités** dont le coût dépasse les bénéfices. L’intervention publique n’est donc pas toujours la solution : elle peut elle-même dysfonctionner."]], ["table", "Les causes des défaillances de l’État", ["Cause", "Explication", "Exemples"], [["Information imparfaite", "L’État ne connaît pas parfaitement les coûts, les besoins et les réactions des agents", "Mauvais calibrage d’une taxe ou d’une aide ; stocks de masques insuffisants au début de la crise sanitaire (2020)"], ["Coûts et lenteurs", "Bureaucratie, complexité administrative, coûts de gestion et de contrôle", "Délais de traitement, multiplication des dispositifs"], ["Capture et intérêts particuliers", "Des groupes d’intérêt (lobbies) obtiennent des **décisions qui les favorisent indûment** ; la **théorie des choix publics** ([[James Buchanan|?James_M._Buchanan]], prix Nobel 1986) rappelle que les élus et fonctionnaires poursuivent aussi leurs propres intérêts (réélection, carrière)", "Niches fiscales bénéficiant à quelques secteurs ; décisions prises avant une élection (**cycle électoral**)"], ["Effets pervers et effets d’aubaine", "Une aide versée pour une action qui aurait eu lieu de toute façon (**effet d’aubaine**) ; une aide qui décourage l’activité qu’elle devait encourager", "Aide à l’embauche touchée pour une embauche déjà prévue ; trappes à inactivité"], ["Mauvaise gestion des services publics", "Moyens mal répartis, manque de personnel, organisation inadaptée", "Difficultés des **hôpitaux** et des urgences, déserts médicaux"], ["Inaction", "L’État n’agit pas, ou trop tard, faute de volonté politique ou de coopération", "Retards dans la protection des **biens communs naturels** et dans la lutte contre le changement climatique ; la France a été condamnée pour « carence fautive » dans l’« Affaire du siècle » (tribunal administratif de Paris, 2021)"]]], ["h", "Limiter les défaillances de l’État", ["**Évaluer** les politiques publiques avant et après leur mise en œuvre : **Cour des comptes**, Conseil d’analyse économique, France Stratégie, Parlement ; supprimer les dispositifs inefficaces.", "Assurer la **transparence** et prévenir les conflits d’intérêts : Haute Autorité pour la transparence de la vie publique (2013), registre des représentants d’intérêts.", "Confier certaines missions à des **autorités indépendantes** du pouvoir politique (banque centrale, Autorité de la concurrence), expérimenter avant de généraliser, associer les citoyens.", "Le débat oppose ceux qui veulent **moins d’État** (laisser davantage faire le marché) et ceux qui veulent **mieux d’État** (une intervention plus efficace et mieux ciblée) : il faut comparer, au cas par cas, le coût des défaillances du marché et celui des défaillances de l’État."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Corriger les défaillances du marché et limites de l’action publique : les défaillances de l’État</h1>
    <p class="sub">Terminale STMG Économie – 6.2 Défaillances des marchés et défaillances de l’État</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
