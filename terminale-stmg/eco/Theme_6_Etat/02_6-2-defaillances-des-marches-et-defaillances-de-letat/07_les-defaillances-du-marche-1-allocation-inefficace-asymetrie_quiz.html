<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les défaillances du marché (1) : allocation inefficace, asymétries d’information et pouvoir de marché</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qu’est-ce qu’une défaillance du marché ?",
  "c": [
   "Une grève qui bloque un marché pendant plusieurs jours",
   "Une faillite d’entreprise causée par une mauvaise gestion",
   "Une baisse des prix provoquée par une forte concurrence",
   "Une situation où le marché seul conduit à une allocation inefficace des ressources"
  ],
  "a": 3,
  "e": "Elle justifie l’intervention publique."
 },
 {
  "q": "Combien de défaillances du marché le programme retient-il ?",
  "c": [
   "Six",
   "Quatre",
   "Deux",
   "Trois"
  ],
  "a": 1,
  "e": "Asymétries d’information, concurrence imparfaite, externalités, biens publics et communs."
 },
 {
  "q": "Une asymétrie d’information existe quand…",
  "c": [
   "Une partie à l’échange dispose d’informations que l’autre n’a pas",
   "Les prix sont affichés en euros",
   "Les deux parties ont la même information",
   "L’État fixe le prix du bien"
  ],
  "a": 0,
  "e": "Elle fausse les décisions."
 },
 {
  "q": "Quel économiste a étudié le marché des voitures d’occasion ?",
  "c": [
   "Elinor Ostrom",
   "George Akerlof",
   "Adam Smith",
   "Arthur Pigou"
  ],
  "a": 1,
  "e": "The Market for Lemons, 1970."
 },
 {
  "q": "Un assuré devient moins prudent parce qu’il est bien couvert : c’est…",
  "c": [
   "Un monopole naturel",
   "La sélection adverse",
   "L’aléa moral",
   "Une externalité positive"
  ],
  "a": 2,
  "e": "Comportement caché après le contrat."
 },
 {
  "q": "La sélection adverse se produit…",
  "c": [
   "Avant l’échange, à cause d’une information cachée sur la qualité",
   "Lorsque l’État fixe un prix plancher",
   "Uniquement sur les marchés publics",
   "Après la signature d’un contrat d’assurance"
  ],
  "a": 0,
  "e": "Le mauvais chasse le bon."
 },
 {
  "q": "Quel scandale de 2013 illustre une asymétrie d’information ?",
  "c": [
   "La crise des subprimes",
   "Le blocage du canal de Suez",
   "Le Covid-19",
   "Les lasagnes à la viande de cheval"
  ],
  "a": 3,
  "e": "Exemple cité par les ressources officielles."
 },
 {
  "q": "Quelle autorité veille à l’information des épargnants sur les marchés financiers ?",
  "c": [
   "L’Autorité des marchés financiers (AMF)",
   "L’Insee",
   "L’Organisation mondiale du commerce",
   "La Cour de cassation"
  ],
  "a": 0,
  "e": "Autorité administrative indépendante créée en 2003."
 },
 {
  "q": "Quelles sont les conséquences d’un monopole par rapport à la concurrence ?",
  "c": [
   "Aucune différence de prix",
   "Des pertes systématiques pour l’entreprise",
   "Un prix plus bas et des quantités plus élevées",
   "Un prix plus élevé, des quantités plus faibles et un surprofit"
  ],
  "a": 3,
  "e": "Au détriment des consommateurs."
 },
 {
  "q": "Pourquoi un réseau ferré est-il un monopole naturel ?",
  "c": [
   "Parce que la loi interdit les trains privés",
   "Parce que ses coûts fixes très élevés rendent un producteur unique plus efficace",
   "Parce qu’il n’a aucun coût",
   "Parce que les voyageurs refusent la concurrence"
  ],
  "a": 1,
  "e": "Il est confié à une entreprise publique ou régulé."
 }
];

const FICHE = "07_les-defaillances-du-marche-1-allocation-inefficace-asymetrie_fiche.pdf";
const FDATA = {"title": "Les défaillances du marché (1) : allocation inefficace, asymétries d’information et pouvoir de marché", "blocks": [["h", "Quand le marché n’alloue plus efficacement les ressources", ["Sur un marché de **concurrence pure et parfaite**, le prix d’équilibre conduit à une **allocation efficace des ressources** : on produit les quantités que les consommateurs sont prêts à payer à un prix qui couvre les coûts, sans gaspillage.", "Il y a **défaillance du marché** lorsque le marché, laissé à lui-même, aboutit à une allocation **inefficace** : un bien est **trop produit** (pollution), **pas assez produit** (vaccins, recherche), **mal évalué** (produit de mauvaise qualité vendu au prix d’un bon) ou **pas produit du tout** (éclairage public). Ces défaillances **justifient l’intervention de l’État**.", "Le programme retient **quatre défaillances** : les **asymétries d’information**, la **concurrence imparfaite** (pouvoir de marché), les **externalités** et les **biens publics et communs** (voir la fiche suivante)."]], ["table", "Les asymétries d’information", ["Notion", "Contenu"], [["Définition", "Situation dans laquelle une partie à l’échange dispose d’**informations que l’autre n’a pas** (sur la qualité d’un produit, sur un comportement), ce qui fausse les décisions et conduit à une mauvaise allocation"], ["Sélection adverse (antisélection)", "Information cachée **avant** l’échange. [[George Akerlof|George_Akerlof]] (*The Market for Lemons*, 1970) : sur le marché des voitures d’occasion, l’acheteur ne distingue pas les bonnes voitures des « tacots » ; il propose un prix moyen ; les vendeurs de bonnes voitures se retirent ; le marché se dégrade, voire disparaît (« le mauvais chasse le bon »)"], ["Aléa moral", "Comportement caché **après** le contrat : un assuré bien couvert peut devenir moins prudent ; une banque sûre d’être sauvée peut prendre plus de risques"], ["Exemples", "**Scandale de la viande de cheval** (2013) : des lasagnes « pur bœuf » contenaient du cheval ; **smartphones** dont les minerais (cobalt) peuvent provenir de mines employant des enfants ; produits financiers complexes ; compléments alimentaires aux promesses non vérifiées"]]], ["table", "Réduire les asymétries d’information", ["Instrument", "Exemples"], [["Obligations d’information", "**Étiquetage** (composition, origine), **Nutri-Score** (2017), devoir d’information précontractuel du vendeur (voir le droit des contrats), prospectus des produits financiers"], ["Labels et certifications", "Labels publics (agriculture biologique, Label rouge, AOP), Écolabel européen, normes NF ; ils servent de **signal** de qualité"], ["Autorités de contrôle", "**Autorités administratives indépendantes** : **Autorité des marchés financiers** (AMF, 2003) pour l’information des épargnants, **ACPR** (banques et assurances) ; **DGCCRF** (répression des fraudes)"], ["Mécanismes privés", "Garanties, avis vérifiés, réputation de la marque ; en assurance : franchises et bonus-malus pour limiter l’aléa moral"]]], ["table", "Le pouvoir de marché (concurrence imparfaite)", ["Notion", "Contenu"], [["Situations", "**Monopole** (un seul vendeur), **oligopole** (quelques vendeurs), **entente** (cartel) entre concurrents qui fixent ensemble les prix, **abus de position dominante**"], ["Conséquences", "Le vendeur fixe un **prix plus élevé** que le prix de concurrence ; les **quantités vendues sont plus faibles** ; il réalise un **surprofit** (une rente) au détriment des consommateurs ; moins d’incitation à innover et à baisser les coûts"], ["Monopole naturel", "Activité à très forts **coûts fixes** (réseau ferré, électrique, d’eau) : un seul producteur est plus efficace ; il est confié à une entreprise publique ou contrôlé par un **régulateur** (CRE pour l’énergie, ARCEP pour les télécoms, ART pour les transports)"], ["Correction", "**Politique de la concurrence** : interdiction des ententes et des abus, contrôle des fusions, sanctions (voir la fiche sur la politique de la concurrence)"]]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les défaillances du marché (1) : allocation inefficace, asymétries d’information et pouvoir de marché</h1>
    <p class="sub">Terminale STMG Économie – 6.2 Défaillances des marchés et défaillances de l’État</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
