<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : La politique budgétaire : relance, stabilisation, limites et critères européens des déficits publics</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qu’est-ce que la politique budgétaire ?",
  "c": [
   "La gestion des comptes bancaires des ménages",
   "L’action de la BCE sur les taux d’intérêt",
   "La fixation des droits de douane par l’OMC",
   "L’utilisation des dépenses et des recettes publiques pour agir sur l’activité"
  ],
  "a": 3,
  "e": "Elle relève des États."
 },
 {
  "q": "Une politique de relance budgétaire consiste à…",
  "c": [
   "Augmenter les impôts et baisser les dépenses",
   "Augmenter les dépenses publiques ou baisser les impôts",
   "Réduire la masse monétaire",
   "Augmenter les taux d’intérêt"
  ],
  "a": 1,
  "e": "Le déficit augmente volontairement."
 },
 {
  "q": "Que mesure le multiplicateur keynésien ?",
  "c": [
   "La hausse des prix due aux impôts",
   "L’effet des taux d’intérêt sur l’épargne",
   "L’effet d’une dépense publique supplémentaire sur le PIB",
   "Le nombre d’emplois publics"
  ],
  "a": 2,
  "e": "1 € de dépense peut créer plus de 1 € de PIB."
 },
 {
  "q": "Pourquoi une relance profite-t-elle en partie aux producteurs étrangers ?",
  "c": [
   "Parce que l’État achète uniquement à l’étranger",
   "Parce qu’une partie de la demande supplémentaire se porte sur des importations",
   "Parce que les exportations sont interdites",
   "Parce que l’euro est trop faible"
  ],
  "a": 1,
  "e": "C’est la contrainte extérieure."
 },
 {
  "q": "Qu’est-ce que l’effet d’éviction ?",
  "c": [
   "La baisse de l’investissement privé due à la hausse des taux provoquée par l’emprunt public",
   "La baisse des importations provoquée par une hausse des droits de douane",
   "La sortie d’un pays de la zone euro sous la pression des marchés",
   "La fermeture d’une entreprise publique concurrencée par le privé"
  ],
  "a": 0,
  "e": "L’État concurrence les entreprises pour les fonds."
 },
 {
  "q": "Quels sont les deux seuils européens maintenus par la réforme de 2024 ?",
  "c": [
   "3 % du PIB pour le déficit et 60 % du PIB pour la dette",
   "5 % de déficit et 90 % de dette",
   "1 % de déficit et 100 % de dette",
   "2 % d’inflation et 5 % de chômage"
  ],
  "a": 0,
  "e": "Issus du traité de Maastricht (1992)."
 },
 {
  "q": "Qu’est-ce que la « règle d’or » du TSCG (2012) ?",
  "c": [
   "Un excédent budgétaire obligatoire de 3 % du PIB chaque année",
   "Une dette publique interdite au-delà de 30 % du PIB",
   "Une inflation obligatoirement fixée à 0 % dans tous les États",
   "Un déficit structurel limité à 0,5 % du PIB à moyen terme"
  ],
  "a": 3,
  "e": "Elle porte sur le déficit structurel."
 },
 {
  "q": "Pourquoi les règles européennes ont-elles été suspendues de 2020 à 2023 ?",
  "c": [
   "Parce que la zone euro a été dissoute",
   "Pour permettre les plans de soutien face à la crise sanitaire",
   "Parce que tous les États étaient en excédent",
   "À cause de l’entrée de la Bulgarie"
  ],
  "a": 1,
  "e": "Clause dérogatoire générale."
 },
 {
  "q": "Depuis quand la France fait-elle l’objet d’une procédure pour déficit excessif ?",
  "c": [
   "Janvier 2002",
   "Juin 2026",
   "Juillet 2024",
   "Mars 2020"
  ],
  "a": 2,
  "e": "Avec six autres États membres."
 },
 {
  "q": "Que reprochent certains économistes aux règles budgétaires ?",
  "c": [
   "D’imposer une rigueur procyclique qui aggrave les récessions",
   "D’encourager les déficits excessifs",
   "De supprimer la BCE",
   "D’interdire les impôts"
  ],
  "a": 0,
  "e": "D’où leur assouplissement en 2024."
 }
];

const FICHE = "12_la-politique-budgetaire-relance-stabilisation-limites-et-cri_fiche.pdf";
const FDATA = {"title": "La politique budgétaire : relance, stabilisation, limites et critères européens des déficits publics", "blocks": [["h", "Définition", ["La **politique budgétaire** consiste à utiliser le **budget des administrations publiques** (dépenses et recettes) pour agir sur l’activité économique. Elle relève des **États**, même dans la zone euro."]], ["table", "Relance ou stabilisation (rigueur)", ["", "Politique de relance", "Politique de stabilisation (rigueur)"], [["Quand ?", "En **récession**, quand la demande est insuffisante et le chômage élevé", "Quand la **dette et le déficit** sont jugés trop élevés, ou en cas de surchauffe"], ["Comment ?", "**Hausse des dépenses publiques** (investissements, prestations) et/ou **baisse des impôts** : le **déficit augmente** volontairement", "**Baisse des dépenses** et/ou **hausse des impôts** pour **réduire le déficit et la dette** et respecter les critères européens"], ["Effet attendu", "Hausse de la demande, de la production et de l’emploi", "Rétablissement des finances publiques, confiance des prêteurs, baisse des taux d’intérêt"], ["Risque", "Hausse de la dette, inflation, fuite vers les importations", "Ralentissement de l’activité à court terme, hausse du chômage"]]], ["flow", "Le mécanisme de la relance keynésienne", ["Hausse des dépenses publiques (ex. construction d’équipements)", "Hausse des revenus des entreprises et des salariés concernés", "Ces revenus sont en partie dépensés : hausse de la consommation", "Nouvelles commandes, nouvelles embauches", "Hausse du PIB supérieure à la dépense initiale : effet multiplicateur"]], ["h", "Multiplicateur et stabilisateurs automatiques", ["Le **multiplicateur keynésien** mesure l’effet d’une dépense publique supplémentaire sur le PIB : 1 € de dépense peut engendrer plus de 1 € de production, car les revenus distribués sont à leur tour dépensés. Plus les ménages **consomment** une part élevée de leurs revenus supplémentaires, et moins ils **importent** ou épargnent, plus le multiplicateur est élevé. En pratique, il est souvent estimé proche de 1, voire inférieur dans une économie très ouverte.", "Les **stabilisateurs automatiques** soutiennent l’activité sans décision nouvelle : en récession, les recettes fiscales baissent et les allocations chômage augmentent, ce qui creuse le déficit mais **amortit** la baisse des revenus."]], ["table", "Les limites de la politique budgétaire", ["Limite", "Explication"], [["Contrainte extérieure", "Dans une économie ouverte, une partie de la demande supplémentaire se porte sur des **produits importés** : la relance profite aux producteurs étrangers et creuse le déficit commercial (relance de 1981)"], ["Effet d’éviction", "L’État emprunte massivement : les taux d’intérêt montent et l’**investissement privé** diminue"], ["Poids de la dette", "Charge d’intérêts croissante (64,7 Md€ en 2025), méfiance des marchés, moindres marges de manœuvre"], ["Anticipations", "Les ménages peuvent **épargner** au lieu de consommer s’ils anticipent des hausses d’impôts futures pour rembourser la dette (équivalence ricardienne)"], ["Délais", "Vote, mise en œuvre et effets prennent du temps ; la mesure peut arriver à contretemps"]]], ["table", "Les règles budgétaires européennes", ["Étape", "Contenu"], [["Traité de Maastricht (1992)", "**Critères de convergence** pour adopter l’euro : **déficit public inférieur à 3 % du PIB** et **dette publique inférieure à 60 % du PIB** (plus inflation et taux d’intérêt maîtrisés)"], ["Pacte de stabilité et de croissance (1997)", "Pérennise ces règles après l’entrée dans l’euro ; procédure de surveillance et sanctions possibles"], ["TSCG (2012)", "« **Règle d’or** » : déficit **structurel** limité à 0,5 % du PIB à moyen terme"], ["Crise sanitaire", "Règles **suspendues** de 2020 à 2023 (clause dérogatoire générale) pour permettre les plans de soutien"], ["Réforme de 2024", "En vigueur depuis le 30 avril 2024 : les seuils de **3 %** et **60 %** sont maintenus ; chaque État présente un **plan budgétaire et structurel à moyen terme** (4 ans, prolongeable jusqu’à 7 ans en échange de réformes et d’investissements) fixant une trajectoire de **dépenses publiques nettes**"], ["La France", "Placée en **procédure pour déficit excessif** en juillet 2024 (avec six autres États) ; engagée à revenir sous 3 % de déficit d’ici la fin de la décennie ; déficit de 5,1 % en 2025, 5,4 % attendu en 2026, objectif 5 % en 2027 (PLF 2027)"]]], ["h", "Le débat", ["Les règles évitent qu’un pays trop endetté fasse peser un **risque sur toute la zone euro** (crise grecque de 2010) et que certains profitent de la crédibilité collective (comportement de passager clandestin).", "Mais elles peuvent imposer une rigueur **procyclique** (réduire le déficit en pleine récession aggrave la récession) et limiter les **investissements** nécessaires (transition écologique, défense) : d’où leur assouplissement en 2024."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : La politique budgétaire : relance, stabilisation, limites et critères européens des déficits publics</h1>
    <p class="sub">Terminale STMG Économie – 6.3 Les politiques économiques de l’État et de l’Europe</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
