<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Les politiques économiques : objectifs, politiques conjoncturelles et structurelles, politiques de demande et d’offre</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quels sont les quatre objectifs du « carré magique » de Kaldor ?",
  "c": [
   "Croissance, déficit, dette, inflation",
   "Emploi, salaires, profits, impôts",
   "Croissance, plein emploi, stabilité des prix, équilibre extérieur",
   "Consommation, épargne, investissement, exportations"
  ],
  "a": 2,
  "e": "Difficiles à atteindre simultanément."
 },
 {
  "q": "Une politique conjoncturelle agit…",
  "c": [
   "À court terme pour stabiliser l’activité",
   "À long terme sur les structures",
   "Uniquement sur l’éducation",
   "Uniquement à l’échelle mondiale"
  ],
  "a": 0,
  "e": "Instruments : budgétaire et monétaire."
 },
 {
  "q": "Quel exemple relève d’une politique structurelle ?",
  "c": [
   "Une prime exceptionnelle versée en récession",
   "Une réforme de la formation professionnelle",
   "Une baisse temporaire de la TVA",
   "Une baisse des taux directeurs"
  ],
  "a": 1,
  "e": "Elle transforme durablement l’économie."
 },
 {
  "q": "Une politique de demande s’inspire de…",
  "c": [
   "Jean-Baptiste Say",
   "Adam Smith",
   "Keynes",
   "Friedrich Hayek"
  ],
  "a": 2,
  "e": "La production dépend de la demande anticipée."
 },
 {
  "q": "Quel instrument relève d’une politique d’offre ?",
  "c": [
   "La hausse des allocations familiales",
   "La hausse des dépenses publiques de consommation",
   "La baisse des cotisations patronales",
   "La hausse du SMIC"
  ],
  "a": 2,
  "e": "Elle réduit le coût du travail."
 },
 {
  "q": "Pourquoi la relance de 1981-1982 a-t-elle été abandonnée ?",
  "c": [
   "Elle a surtout profité aux importations et creusé le déficit extérieur",
   "Elle a fait disparaître le chômage",
   "Elle a provoqué une déflation",
   "Elle a été interdite par la BCE"
  ],
  "a": 0,
  "e": "Tournant de la rigueur en 1983."
 },
 {
  "q": "À combien a été ramené le taux normal de l’impôt sur les sociétés en 2022 ?",
  "c": [
   "15 %",
   "33,3 %",
   "45 %",
   "25 %"
  ],
  "a": 3,
  "e": "Mesure d’offre."
 },
 {
  "q": "Qu’est-ce que le policy mix ?",
  "c": [
   "Le mélange des cultures d’entreprise",
   "La combinaison des politiques budgétaire et monétaire",
   "La coordination des salaires entre pays",
   "La fusion de deux banques centrales"
  ],
  "a": 1,
  "e": "Gouvernement et banque centrale."
 },
 {
  "q": "Que montre la courbe de Phillips ?",
  "c": [
   "Un lien entre impôts et recettes",
   "Un cycle de 50 ans",
   "Un lien entre dette et croissance",
   "Un arbitrage entre inflation et chômage"
  ],
  "a": 3,
  "e": "1958."
 },
 {
  "q": "Quel était le montant du plan France Relance (2020) ?",
  "c": [
   "750 Md€",
   "10 Md€",
   "100 Md€",
   "1 000 Md€"
  ],
  "a": 2,
  "e": "750 Md€ correspond à NextGenerationEU."
 }
];

const FICHE = "11_les-politiques-economiques-objectifs-politiques-conjoncturel_fiche.pdf";
const FDATA = {"title": "Les politiques économiques : objectifs, politiques conjoncturelles et structurelles, politiques de demande et d’offre", "blocks": [["h", "Définition et objectifs", ["La **politique économique** est l’ensemble des décisions prises par les pouvoirs publics (gouvernement, Parlement, banque centrale, institutions européennes) pour orienter l’activité économique et atteindre des **objectifs**.", "[[Nicholas Kaldor|Nicholas_Kaldor]] (1971) résume les quatre objectifs de la politique conjoncturelle par le « **carré magique** » : **croissance** du PIB, **plein emploi**, **stabilité des prix** (faible inflation) et **équilibre extérieur** (solde commercial équilibré). Il est « magique » car il est très difficile d’atteindre les quatre en même temps. Les ressources officielles insistent sur l’objectif de **croissance**."]], ["table", "Politiques conjoncturelles et politiques structurelles", ["", "Politique conjoncturelle", "Politique structurelle"], [["Horizon", "**Court terme**", "**Long terme**"], ["Objectif", "**Stabiliser** l’activité : relancer ou freiner selon la conjoncture", "**Transformer les structures** de l’économie pour accroître la croissance potentielle, l’emploi, la compétitivité"], ["Instruments", "**Politique budgétaire** et **politique monétaire**", "Quatre grandes formes : politiques **réglementaires** (droit du travail, normes), **production de biens et services publics** (éducation, recherche, infrastructures), politiques **sociales**, politique de la **concurrence** ; aussi politique industrielle, fiscale, énergétique"], ["Exemples", "Plan de relance en 2020 ; mesures de soutien face à la flambée de l’énergie (bouclier tarifaire mis en place à partir de 2021)", "Ouverture à la concurrence des monopoles publics, lutte contre les cartels, réforme de la formation professionnelle, France 2030"]]], ["table", "Politiques de demande et politiques d’offre", ["", "Politique de demande", "Politique d’offre"], [["Inspiration", "**Keynésienne** : la production dépend de la **demande** anticipée par les entreprises", "**Libérale** (néoclassique) : la croissance dépend des **conditions de production**"], ["Mécanisme", "Soutenir la **consommation** et l’**investissement** pour augmenter la production et l’emploi", "Améliorer la **rentabilité** et la **compétitivité** des entreprises pour qu’elles produisent, investissent et embauchent davantage"], ["Instruments", "Hausse des dépenses publiques, baisse des impôts des ménages, hausse des prestations sociales ou du SMIC, baisse des taux d’intérêt", "Baisse du **coût du travail** (cotisations patronales) et des impôts sur les entreprises, **aides à l’innovation** (crédit d’impôt recherche, 1983), formation, simplification, flexibilité du marché du travail"], ["Exemples en France", "Relance de 1981-1982 (gouvernement [[Mauroy|Pierre_Mauroy]]), suivie du « tournant de la rigueur » de 1983 à cause du déficit extérieur", "CICE (2013) transformé en baisse de cotisations (2019) ; baisse de l’impôt sur les sociétés de 33,3 % à **25 %** (2022) ; baisse des impôts de production"], ["Limites", "Fuite de la relance vers les **importations**, hausse du déficit et de la dette, inflation", "Effets lents et incertains, effets d’aubaine, coût pour les finances publiques, risque de compression de la demande"]]], ["h", "Combiner les politiques : le policy mix", ["Le **policy mix** est la combinaison de la **politique budgétaire** (menée par le gouvernement) et de la **politique monétaire** (menée par la banque centrale). Les deux sont **interdépendantes** : une relance budgétaire est plus efficace si les taux d’intérêt restent bas ; une politique monétaire restrictive peut annuler l’effet d’une relance.", "Dans la **zone euro**, la politique monétaire est **unique** (BCE) alors que les politiques budgétaires restent **nationales**, encadrées par des règles communes : la coordination est difficile.", "Beaucoup de plans mêlent les deux approches : **France Relance** (2020, 100 Md€) combinait soutien à la demande et baisse des impôts de production ; le plan européen **NextGenerationEU** (2020, 750 Md€) finance des investissements."]], ["h", "Des objectifs parfois contradictoires", ["La **courbe de [[Phillips|?Alban_William_Phillips]]** (1958) a mis en évidence un **arbitrage** entre inflation et chômage : moins de chômage s’accompagne souvent de plus d’inflation, et inversement.", "En 2026, le choc pétrolier place les pouvoirs publics devant un **dilemme** : la BCE remonte ses taux pour contenir l’inflation, au risque de freiner une croissance déjà faible ; le FMI recommande des aides **temporaires et ciblées** contre la hausse de l’énergie plutôt que des mesures générales coûteuses."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Les politiques économiques : objectifs, politiques conjoncturelles et structurelles, politiques de demande et d’offre</h1>
    <p class="sub">Terminale STMG Économie – 6.3 Les politiques économiques de l’État et de l’Europe</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
