<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : L’Organisation mondiale du commerce : missions, principes de fonctionnement et cycles de négociations</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quand l’OMC a-t-elle été créée ?",
  "c": [
   "En 2001",
   "En 1947",
   "Le 1er janvier 1995",
   "En 1944"
  ],
  "a": 2,
  "e": "Accords de Marrakech (1994)."
 },
 {
  "q": "Quel accord a précédé l’OMC ?",
  "c": [
   "Le traité de Rome (1957)",
   "L’accord de Paris (2015)",
   "Le traité de Maastricht (1992)",
   "Le GATT (1947)"
  ],
  "a": 3,
  "e": "Accord général sur les tarifs douaniers et le commerce."
 },
 {
  "q": "Combien de membres compte l’OMC ?",
  "c": [
   "193",
   "27",
   "50",
   "166"
  ],
  "a": 3,
  "e": "Environ 98 % du commerce mondial."
 },
 {
  "q": "Où se trouve le siège de l’OMC ?",
  "c": [
   "Washington",
   "Genève",
   "Bruxelles",
   "New York"
  ],
  "a": 1,
  "e": "En Suisse."
 },
 {
  "q": "Que prévoit la clause de la nation la plus favorisée ?",
  "c": [
   "Tout avantage accordé à un membre doit être étendu à tous les autres",
   "Un pays peut choisir ses partenaires favoris",
   "Les produits nationaux sont toujours prioritaires",
   "Les pays pauvres paient plus de droits"
  ],
  "a": 0,
  "e": "Non-discrimination entre partenaires."
 },
 {
  "q": "Que prévoit le principe du traitement national ?",
  "c": [
   "Chaque pays fixe ses droits librement",
   "Les produits nationaux ne paient pas de taxes",
   "Les produits importés doivent être traités comme les produits nationaux une fois entrés",
   "Les importations sont interdites dans certains secteurs"
  ],
  "a": 2,
  "e": "Non-discrimination entre produits."
 },
 {
  "q": "Comment l’OMC prend-elle ses décisions ?",
  "c": [
   "Par consensus des membres",
   "Par décision du directeur général",
   "Par tirage au sort",
   "Par vote des seuls pays riches"
  ],
  "a": 0,
  "e": "Ce qui rend les accords difficiles."
 },
 {
  "q": "Quel cycle a créé l’OMC et étendu les règles aux services et à la propriété intellectuelle ?",
  "c": [
   "L’Uruguay Round (1986-1994)",
   "Le Tokyo Round",
   "Le cycle de Doha",
   "Le Kennedy Round"
  ],
  "a": 0,
  "e": "AGCS et ADPIC."
 },
 {
  "q": "Pourquoi le cycle de Doha est-il bloqué ?",
  "c": [
   "Parce qu’il ne concerne que l’Europe",
   "Surtout à cause des désaccords sur l’agriculture",
   "Parce qu’il est terminé depuis 2005",
   "Parce que l’OMC a été dissoute"
  ],
  "a": 1,
  "e": "Subventions agricoles des pays riches."
 },
 {
  "q": "Quel résultat la conférence de Yaoundé (2026) a-t-elle obtenu ?",
  "c": [
   "Le renouvellement du moratoire sur les transmissions électroniques",
   "Un programme complet de réforme de l’OMC",
   "La fin du cycle de Doha",
   "L’application provisoire d’un accord sur le commerce électronique par 66 membres"
  ],
  "a": 3,
  "e": "Environ 70 % du commerce mondial."
 }
];

const FICHE = "31_lorganisation-mondiale-du-commerce-missions-principes-de-fon_fiche.pdf";
const FDATA = {"title": "L’Organisation mondiale du commerce : missions, principes de fonctionnement et cycles de négociations", "blocks": [["h", "Des origines à l’OMC", ["Le protectionnisme des années 1930 a aggravé la crise et les tensions internationales. Après 1945, la communauté internationale a voulu une **régulation mondiale** des échanges : la Charte de La Havane (1948) prévoyait une Organisation internationale du commerce, qui n’a jamais vu le jour ; seul l’**Accord général sur les tarifs douaniers et le commerce** (**GATT**), signé en **1947** par 23 pays, s’est appliqué.", "L’**Organisation mondiale du commerce** (OMC) a été créée le **1er janvier 1995** par les **accords de Marrakech** (1994), à l’issue du cycle de l’Uruguay. Siège : **Genève**. Elle compte **166 membres**, qui réalisent environ **98 %** du commerce mondial (Chine depuis 2001, Russie depuis 2012). Sa directrice générale est [[Ngozi Okonjo-Iweala|Ngozi_Okonjo-Iweala]] (depuis 2021, pour un second mandat depuis 2025).", "Les décisions sont prises par **consensus** des membres. L’organe suprême est la **conférence ministérielle**, réunie environ tous les deux ans (Abou Dhabi en 2024, **Yaoundé** au Cameroun en mars 2026)."]], ["table", "Les missions de l’OMC", ["Mission", "Contenu"], [["Négocier", "Offrir un **cadre de négociation** pour réduire les obstacles aux échanges et fixer des règles communes"], ["Administrer les accords", "Faire appliquer les accords : **GATT** (marchandises), **AGCS** (services), **ADPIC** (propriété intellectuelle), agriculture, subventions…"], ["Régler les différends", "**Organe de règlement des différends** (voir la fiche suivante)"], ["Surveiller", "Examiner les politiques commerciales des membres (transparence)"], ["Aider les pays en développement", "Assistance technique, délais d’application, traitement spécial"], ["Objectif d’ensemble", "Favoriser la **bonne marche**, la **prévisibilité** et la **liberté** des échanges"]]], ["table", "Les grands principes", ["Principe", "Contenu"], [["**Clause de la nation la plus favorisée** (non-discrimination entre partenaires)", "Tout avantage commercial accordé à un membre (une baisse de droit de douane) doit être **étendu à tous** les autres membres"], ["**Traitement national** (non-discrimination entre produits)", "Une fois entrés sur le territoire, les produits importés doivent être traités **comme les produits nationaux** (mêmes taxes, mêmes normes)"], ["**Réciprocité**", "Les concessions sont **mutuelles** : un pays qui baisse ses droits obtient des baisses équivalentes de ses partenaires"], ["Consolidation et transparence", "Les droits de douane sont **plafonnés** (consolidés) et les mesures commerciales doivent être notifiées : les échanges deviennent prévisibles"], ["Exceptions encadrées", "Zones de libre-échange et unions douanières (article XXIV), **traitement spécial et différencié** des pays en développement, mesures **antidumping** et de **sauvegarde**, exceptions pour la santé, l’environnement (article XX) et la **sécurité nationale** (article XXI)"]]], ["table", "Les cycles de négociations (rounds)", ["Cycle", "Résultats"], [["Huit cycles du GATT (1947-1994)", "Les droits de douane moyens sur les produits industriels des pays développés passent d’environ **40 %** en 1947 à environ **4 %**"], ["[[Kennedy|John_F._Kennedy]] Round (1964-1967)", "Baisse d’environ un tiers des droits de douane industriels ; premières règles antidumping"], ["Tokyo Round (1973-1979)", "Nouvelle baisse des droits ; premiers accords sur les **barrières non tarifaires** (normes, marchés publics, subventions)"], ["**Uruguay Round** (1986-1994), le cycle à connaître", "**123 pays** ; extension des règles à l’**agriculture**, au **textile**, aux **services** (AGCS) et à la **propriété intellectuelle** (ADPIC) ; création de l’**OMC** et d’un système de règlement des différends contraignant"], ["Cycle de Doha (depuis 2001)", "« Programme pour le développement » : **bloqué**, surtout sur l’agriculture (subventions des pays riches) ; seuls des accords partiels ont abouti : facilitation des échanges (2013, en vigueur en 2017), fin des subventions aux exportations agricoles (2015), subventions à la pêche (2022, en vigueur en 2025)"]]], ["h", "La conférence de Yaoundé (mars 2026)", ["Les membres n’ont pas adopté de programme de **réforme de l’OMC** ; le moratoire sur les droits de douane appliqués aux **transmissions électroniques** n’a pas été renouvelé. En revanche, **66 membres** (environ 70 % du commerce mondial) ont décidé d’appliquer provisoirement un **accord plurilatéral sur le commerce électronique**. Les négociations se poursuivent sur les subventions à la pêche."]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : L’Organisation mondiale du commerce : missions, principes de fonctionnement et cycles de négociations</h1>
    <p class="sub">Terminale STMG Économie – 8.3 Une organisation mondiale pour gérer les différends entre États</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
