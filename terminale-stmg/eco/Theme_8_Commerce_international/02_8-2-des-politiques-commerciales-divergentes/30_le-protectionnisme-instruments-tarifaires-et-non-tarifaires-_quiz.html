<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Le protectionnisme : instruments tarifaires et non tarifaires, justifications et retour des barrières commerciales (2018-2026)</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Qu’est-ce qu’un droit de douane ?",
  "c": [
   "Une taxe sur les produits importés",
   "Une subvention aux exportations",
   "Un quota d’importation",
   "Un impôt sur les sociétés"
  ],
  "a": 0,
  "e": "Ad valorem ou spécifique."
 },
 {
  "q": "Un quota d’importation est…",
  "c": [
   "Une taxe en pourcentage du prix",
   "Une limite à la quantité de produits importés",
   "Une aide aux exportateurs",
   "Une norme sanitaire"
  ],
  "a": 1,
  "e": "Restriction quantitative."
 },
 {
  "q": "Quel exemple est une barrière non tarifaire ?",
  "c": [
   "Une norme sanitaire interdisant le bœuf aux hormones",
   "Un droit de douane de 50 % sur l’acier",
   "Un tarif extérieur commun",
   "Un droit de douane de 15 %"
  ],
  "a": 0,
  "e": "Normes et réglementations."
 },
 {
  "q": "Qu’est-ce que le protectionnisme éducateur de List ?",
  "c": [
   "Une protection temporaire des industries naissantes",
   "Une politique d’ouverture totale",
   "L’interdiction de l’éducation à l’étranger",
   "Une protection définitive de tous les secteurs"
  ],
  "a": 0,
  "e": "Friedrich List, 1841."
 },
 {
  "q": "Que sont les droits compensateurs ?",
  "c": [
   "Des aides versées par l’État aux entreprises exportatrices",
   "Des indemnités versées aux chômeurs licenciés après une délocalisation",
   "Des droits qui neutralisent les subventions accordées par un État étranger",
   "Des taxes sur les services numériques des grandes plateformes"
  ],
  "a": 2,
  "e": "Ex. : véhicules électriques chinois (2024)."
 },
 {
  "q": "Que fait le mécanisme d’ajustement carbone aux frontières de l’UE ?",
  "c": [
   "Il fait payer le carbone contenu dans certaines importations",
   "Il interdit toutes les importations chinoises",
   "Il supprime les droits de douane sur l’énergie",
   "Il subventionne les exportations de charbon"
  ],
  "a": 0,
  "e": "Période définitive depuis le 1er janvier 2026."
 },
 {
  "q": "Quelle est une limite du protectionnisme ?",
  "c": [
   "La hausse de la concurrence étrangère",
   "La baisse automatique des prix",
   "La disparition des représailles",
   "La hausse des prix pour les consommateurs et les entreprises"
  ],
  "a": 3,
  "e": "Et les représailles."
 },
 {
  "q": "Quelle loi américaine de 1930 a contribué à l’effondrement du commerce mondial ?",
  "c": [
   "Le Sherman Act",
   "Le Glass-Steagall Act",
   "L’Inflation Reduction Act",
   "La loi Smoot-Hawley"
  ],
  "a": 3,
  "e": "Spirale de représailles."
 },
 {
  "q": "Qu’a décidé la Cour suprême des États-Unis le 20 février 2026 ?",
  "c": [
   "Que l’OMC devait fixer les droits américains",
   "Que l’UE devait payer des droits de 50 %",
   "Que tous les droits de douane américains étaient supprimés",
   "Que les droits de douane fondés sur la loi d’urgence économique (IEEPA) étaient illégaux"
  ],
  "a": 3,
  "e": "6 voix contre 3."
 },
 {
  "q": "Quel plafond l’accord UE-États-Unis de juillet 2025 fixe-t-il pour la plupart des produits européens ?",
  "c": [
   "50 %",
   "0 %",
   "15 %",
   "100 %"
  ],
  "a": 2,
  "e": "L’acier, l’aluminium et le cuivre restent à 50 %."
 }
];

const FICHE = "30_le-protectionnisme-instruments-tarifaires-et-non-tarifaires-_fiche.pdf";
const FDATA = {"title": "Le protectionnisme : instruments tarifaires et non tarifaires, justifications et retour des barrières commerciales (2018-2026)", "blocks": [["table", "Les instruments du protectionnisme", ["Type", "Instrument", "Exemples"], [["**Tarifaire**", "**Droits de douane** : taxe sur les produits importés, **ad valorem** (en % du prix) ou **spécifique** (montant par unité) ; elle renchérit les importations", "Tarif extérieur commun de l’UE (en moyenne environ 5 %) ; droits américains de 2025"], ["**Non tarifaire** : restrictions quantitatives", "**Quotas** ou **contingents** : quantité maximale importée ; interdictions, **embargos**", "Quotas d’importation d’acier ; embargo sur certains produits russes"], ["Non tarifaire : réglementaire", "**Normes** techniques, sanitaires ou environnementales plus strictes, formalités douanières complexes", "Interdiction du **bœuf aux hormones** dans l’UE"], ["Non tarifaire : soutien public", "**Subventions** aux producteurs nationaux, **préférence nationale** dans les marchés publics, **exigences de contenu local**", "Inflation Reduction Act américain (2022) : aides réservées aux véhicules électriques et équipements produits en Amérique du Nord"], ["Défense commerciale", "Droits **antidumping** (contre des ventes à perte) et **droits compensateurs** (contre des subventions étrangères), **mesures de sauvegarde** temporaires", "Droits compensateurs de l’UE sur les **véhicules électriques chinois** (jusqu’à 35,3 %, octobre 2024)"], ["Contrôle des exportations", "Restreindre la vente de produits stratégiques", "Restrictions américaines sur les puces vers la Chine, restrictions chinoises sur les **terres rares** (2025)"]]], ["table", "Les justifications du protectionnisme", ["Argument", "Explication"], [["**Protectionnisme éducateur**", "[[Friedrich List|Friedrich_List]] (1841) : protéger **temporairement** les **industries naissantes** le temps qu’elles deviennent compétitives, puis ouvrir les frontières"], ["Protéger l’emploi et les secteurs en difficulté", "Éviter des fermetures d’usines et des pertes d’emplois dans les régions touchées"], ["**Souveraineté** et sécurité", "Garder la maîtrise des productions stratégiques : énergie, défense, santé, semi-conducteurs, alimentation"], ["Riposter à une concurrence **déloyale**", "Dumping, subventions massives, normes sociales et environnementales faibles"], ["Protéger les normes et l’environnement", "Le **mécanisme d’ajustement carbone aux frontières** de l’UE (période définitive depuis le 1er janvier 2026) fait payer le carbone contenu dans certaines importations (acier, ciment, aluminium, engrais) pour éviter les « fuites de carbone »"], ["Négocier en position de force", "Menacer de droits de douane pour obtenir des concessions"]]], ["table", "Les limites du protectionnisme", ["Limite", "Explication"], [["Hausse des prix", "Les **consommateurs** paient plus cher ; les **entreprises** qui importent des composants voient leurs coûts augmenter"], ["Représailles", "Les partenaires ripostent (« **guerre commerciale** ») : les exportateurs sont pénalisés"], ["Inefficacité", "Les entreprises protégées sont moins incitées à innover ; des **rentes** apparaissent"], ["Leçon historique", "Après la loi américaine **Smoot-Hawley** (1930), la spirale de représailles a contribué à l’effondrement du commerce mondial, qui a perdu environ les deux tiers de sa valeur entre 1929 et 1933"]]], ["table", "Le retour du protectionnisme (2018-2026)", ["Date", "Événement"], [["2018-2019", "Premier mandat de [[Donald Trump|Donald_Trump]] : droits sur l’acier (25 %) et l’aluminium (10 %), guerre commerciale avec la Chine"], ["2022-2024", "Inflation Reduction Act aux États-Unis ; droits compensateurs européens sur les véhicules électriques chinois"], ["2025", "Droits de douane « **réciproques** » américains annoncés le 2 avril 2025 sur la plupart des partenaires ; **accord UE-États-Unis** de juillet 2025 plafonnant à **15 %** la plupart des droits sur les produits européens"], ["20 février 2026", "La **Cour suprême** des États-Unis (6 voix contre 3) juge **illégaux** les droits fondés sur une loi d’urgence économique (IEEPA) : le président ne peut pas lever seul un impôt ; remboursements aux importateurs"], ["2026", "Remplacement par un droit uniforme temporaire (expiré le 24 juillet 2026), puis par des droits fondés sur d’autres lois : pour les produits européens, complément jusqu’à **10 %** au total depuis le 24 juillet 2026 ; maintien des droits « de sécurité nationale » (acier, aluminium, cuivre : 50 % ; automobiles européennes : 15 %). L’UE supprime ses droits sur les produits industriels américains (1er juillet 2026), en application de l’accord"]]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Le protectionnisme : instruments tarifaires et non tarifaires, justifications et retour des barrières commerciales (2018-2026)</h1>
    <p class="sub">Terminale STMG Économie – 8.2 Des politiques commerciales divergentes</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
