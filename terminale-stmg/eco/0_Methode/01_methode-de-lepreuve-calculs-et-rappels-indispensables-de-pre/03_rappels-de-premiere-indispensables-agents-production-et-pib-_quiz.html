<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz : Rappels de première indispensables : agents, production et PIB, répartition des revenus, financement et marchés</title>
<style>
  :root { --blue:#1f3a5f; --light:#e8eef6; --ok:#2e7d32; --ko:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6fa; margin:0; padding:20px; color:#222; }
  main { max-width:680px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:var(--blue); font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 18px; }
  .bar { height:8px; background:var(--light); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar div { height:100%; background:var(--blue); width:0; transition:width .3s; }
  .count { font-size:.9rem; color:#666; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin:0 0 14px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border:2px solid var(--light); background:#fff; border-radius:8px; font-size:1rem; cursor:pointer; }
  .choice:hover:enabled { border-color:var(--blue); }
  .choice.correct { border-color:var(--ok); background:#e8f5e9; }
  .choice.wrong { border-color:var(--ko); background:#ffebee; }
  .explain { margin-top:14px; padding:12px; background:var(--light); border-radius:8px; display:none; }
  button.main { margin-top:16px; background:var(--blue); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .score { font-size:2.2rem; color:var(--blue); font-weight:700; }
  a.fiche { display:inline-block; margin-top:10px; color:var(--blue); font-weight:600; }
  ul.recap { padding-left:18px; }
  ul.recap li { margin:6px 0; }
  a.lk { color:var(--blue); font-weight:600; font-size:.92rem; }
  .backq { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:10px 14px; border-radius:8px; margin:-8px -8px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  .backq button { background:#fff; color:var(--blue); border:0; border-radius:6px; padding:8px 12px; font-weight:700; font-size:1rem; cursor:pointer; }
  .fic h2 { color:var(--blue); font-size:1.25rem; }
  .fic h3 { color:var(--blue); margin:18px 0 6px; font-size:1.05rem; padding:2px 4px; }
  .fic ul { padding-left:20px; margin:6px 0; }
  .fic li { margin:5px 0; line-height:1.45; }
  .fic table { border-collapse:collapse; width:100%; font-size:.93rem; }
  .fic td, .fic th { border:1px solid #c9d3e3; padding:6px; vertical-align:top; text-align:left; }
  .fic th { background:var(--light); }
  .tw { overflow-x:auto; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; background:var(--light); border:1px solid var(--blue); border-radius:8px; padding:10px; }
  .flow > div { flex:1 1 120px; text-align:center; font-weight:700; color:var(--blue); }
  .flow > span { align-self:center; color:var(--blue); font-weight:700; }
  .fic h3 { scroll-margin-top:70px; }
  .goto { background:#fff3cd; box-shadow:0 0 0 3px #f2c94c; border-radius:6px; }
  a.wiki { color:var(--blue); text-decoration:underline dotted; font-weight:600; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const QUESTIONS = [
 {
  "q": "Quelle est la fonction principale des ménages ?",
  "c": [
   "Produire des biens marchands",
   "Redistribuer les revenus",
   "Consommer",
   "Financer l’économie"
  ],
  "a": 2,
  "e": "Ils travaillent et épargnent aussi."
 },
 {
  "q": "Comment calcule-t-on la valeur ajoutée ?",
  "c": [
   "Production + consommations intermédiaires",
   "Chiffre d’affaires - salaires",
   "Profits - impôts",
   "Production - consommations intermédiaires"
  ],
  "a": 3,
  "e": "Elle mesure la richesse réellement créée."
 },
 {
  "q": "Le PIB est égal à…",
  "c": [
   "La somme des chiffres d’affaires de toutes les entreprises résidentes",
   "Le total des exportations de biens et de services du pays",
   "La somme des revenus déclarés par les ménages imposables",
   "La somme des valeurs ajoutées des producteurs résidents (plus les impôts sur les produits, moins les subventions)"
  ],
  "a": 3,
  "e": "Optique de la production."
 },
 {
  "q": "Comment appelle-t-on la rémunération du capital dans le partage de la valeur ajoutée ?",
  "c": [
   "La consommation intermédiaire",
   "L’excédent brut d’exploitation",
   "Le salaire",
   "La cotisation sociale"
  ],
  "a": 1,
  "e": "EBE : profits avant impôts et intérêts."
 },
 {
  "q": "Qu’est-ce que la répartition secondaire des revenus ?",
  "c": [
   "L’épargne des ménages",
   "Le partage des dividendes",
   "La distribution des salaires par les entreprises",
   "La redistribution opérée par les administrations publiques"
  ],
  "a": 3,
  "e": "Prélèvements obligatoires et prestations sociales."
 },
 {
  "q": "Le taux d’épargne des ménages se calcule par…",
  "c": [
   "Consommation / épargne × 100",
   "Épargne / PIB × 100",
   "Épargne / revenu disponible brut × 100",
   "Épargne / patrimoine × 100"
  ],
  "a": 2,
  "e": "Le RDB est partagé entre consommation et épargne."
 },
 {
  "q": "Une entreprise qui émet des obligations se finance…",
  "c": [
   "Par une subvention publique non remboursable",
   "De façon directe, sur les marchés financiers",
   "De façon indirecte, par un crédit bancaire",
   "Par autofinancement, grâce à ses bénéfices mis en réserve"
  ],
  "a": 1,
  "e": "L’obligation est un titre de créance."
 },
 {
  "q": "Quel agent a généralement une capacité de financement ?",
  "c": [
   "Les ménages",
   "Les entreprises",
   "Aucun agent",
   "Les administrations publiques françaises"
  ],
  "a": 0,
  "e": "Leur épargne dépasse leur investissement."
 },
 {
  "q": "Quelle hypothèse appartient à la concurrence pure et parfaite ?",
  "c": [
   "Des barrières à l’entrée",
   "L’existence d’un monopole",
   "La différenciation des produits",
   "La transparence de l’information"
  ],
  "a": 3,
  "e": "Avec atomicité, homogénéité, libre entrée, libre circulation."
 },
 {
  "q": "Un marché avec quelques vendeurs face à de nombreux acheteurs est un…",
  "c": [
   "Monopsone",
   "Marché de concurrence parfaite",
   "Oligopole",
   "Monopole"
  ],
  "a": 2,
  "e": "Ex. : téléphonie mobile, aéronautique."
 }
];

const FICHE = "03_rappels-de-premiere-indispensables-agents-production-et-pib-_fiche.pdf";
const FDATA = {"title": "Rappels de première indispensables : agents, production et PIB, répartition des revenus, financement et marchés", "blocks": [["table", "Les agents économiques et leurs fonctions (thème 1 de première)", ["Agent", "Fonction principale", "Ressources principales"], [["Ménages", "**Consommer** (et travailler, épargner)", "Revenus d’activité, de la propriété, prestations sociales"], ["Entreprises (sociétés non financières)", "**Produire** des biens et services marchands", "Ventes (chiffre d’affaires)"], ["Administrations publiques (APU)", "Produire des **services non marchands** et **redistribuer**", "**Prélèvements obligatoires** (impôts, cotisations)"], ["Institutions financières", "**Financer** l’économie (banques, assurances)", "Intérêts, commissions, primes"], ["Reste du monde", "Ensemble des agents **non résidents** en relation avec les agents résidents", "Exportations et importations, flux financiers"]]], ["table", "Produire et mesurer la richesse (thème 2 de première)", ["Notion", "Définition"], [["Facteurs de production", "**Travail** et **capital** (capital fixe : machines, bâtiments, logiciels ; capital circulant : consommations intermédiaires), combinés de façon plus ou moins **substituable** ou **complémentaire**"], ["Productivité", "Rapport entre une production et les facteurs utilisés (productivité du travail = production / heures travaillées)"], ["Valeur ajoutée (VA)", "Production - **consommations intermédiaires** (biens et services détruits ou transformés pendant la production) : elle mesure la richesse **réellement créée** par une organisation"], ["PIB", "Somme des **valeurs ajoutées** des producteurs résidents (+ impôts sur les produits - subventions) ; aussi égal à la somme des emplois finals : consommation + investissement (FBCF) + variation des stocks + exportations - importations"], ["Partage de la VA", "Entre **salaires** (rémunération du travail), **excédent brut d’exploitation** (profits, rémunération du capital) et impôts sur la production"]]], ["table", "Répartir et utiliser les revenus (thème 3 de première)", ["Notion", "Définition"], [["Répartition primaire", "Distribution des revenus issus de la production (salaires, profits, revenus de la propriété : intérêts, dividendes, loyers)"], ["Répartition secondaire (redistribution)", "Opérée par les APU : **prélèvements obligatoires** et **prestations sociales** ; on obtient le **revenu disponible brut** (RDB)"], ["Consommation et épargne", "RDB = consommation + épargne ; **taux d’épargne** = épargne / RDB × 100 ; l’épargne des ménages français est restée élevée depuis la crise sanitaire"], ["Pouvoir d’achat", "Évolution du revenu **corrigée de l’inflation** : il baisse si les prix augmentent plus vite que les revenus (2022-2023, et risque en 2026 avec le choc énergétique)"]]], ["table", "Financer l’activité (thème 4 de première)", ["Mode de financement", "Contenu"], [["Autofinancement", "Financement de l’investissement par l’épargne propre de l’entreprise (bénéfices non distribués et amortissements) : **interne**"], ["Financement indirect (intermédié)", "Par les **banques**, qui accordent des **crédits** et créent de la monnaie ; coût : le **taux d’intérêt**"], ["Financement direct (de marché)", "Émission d’**actions** (titres de propriété, rémunérés par des dividendes) ou d’**obligations** (titres de créance, rémunérés par des intérêts) sur les marchés financiers"], ["Capacité / besoin de financement", "Un agent dont l’épargne dépasse l’investissement a une **capacité de financement** (en général les ménages) ; dans le cas contraire, un **besoin de financement** (en général les entreprises et les APU)"]]], ["table", "Les marchés (thème 5 de première)", ["Notion", "Définition"], [["Marché", "Lieu, réel ou virtuel, de rencontre entre l’**offre** et la **demande** d’un bien ou service, où se forme un **prix**"], ["Loi de l’offre et de la demande", "La demande diminue quand le prix augmente ; l’offre augmente quand le prix augmente ; le **prix d’équilibre** égalise offre et demande"], ["Concurrence pure et parfaite", "Cinq hypothèses : **atomicité**, **homogénéité** des produits, **libre entrée** sur le marché, **transparence** de l’information, **libre circulation** des facteurs de production"], ["Concurrence imparfaite", "**Monopole** (un seul vendeur), **oligopole** (quelques vendeurs), **concurrence monopolistique** (produits différenciés) : les entreprises ont un **pouvoir de marché** sur les prix"], ["Stratégies", "Domination par les coûts, **différenciation**, innovation, concentration (fusions-acquisitions), ententes (interdites)"]]]]};
const app = document.getElementById("app");
let order, idx, score, answers;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  idx = 0; score = 0; answers = [];
  render();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STOP = new Set("dans pour avec sont cette cela ainsi leur leurs mais donc plus aussi entre sans comme tout tous toute toutes dont elle elles nous vous être avoir fait faire peut peuvent selon chez très alors après avant depuis encore même autre autres quand quel quelle ces ses son sur par une des les aux est ont qui que".split(" "));
function norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[*_]|<\/?[a-z]+>|\[\[|\]\]|\|[A-Za-z_.À-ſ()'-]+(?=\]\])/g, " "); }
function md(s) {
  const links = [];
  s = String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g, (m, t, w) => { links.push([t, w]); return "\u0001" + (links.length - 1) + "\u0002"; });
  return esc(s)
    .replace(/&lt;sub&gt;/g, "<sub>").replace(/&lt;\/sub&gt;/g, "</sub>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/\u0001(\d+)\u0002/g, (m, i) => '<a class="wiki" href="https://fr.wikipedia.org/wiki/' +
      encodeURIComponent(links[+i][1].replace(/ /g, "_")) + '" target="_blank" rel="noopener">' + esc(links[+i][0]) + "</a>");
}
function blockText(b) {
  return b[0] === "table" ? b[1] + " " + b[2].join(" ") + " " + b[3].map(r => r.join(" ")).join(" ") : b[1] + " " + b[2].join(" ");
}
function matchBlock(Q) {
  if (!FDATA) return -1;
  const words = Array.from(new Set(norm(Q.q + " " + Q.c[Q.a] + " " + Q.e).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w))));
  let best = 0, bs = -1;
  FDATA.blocks.forEach((b, bi) => {
    const t = " " + norm(blockText(b)).replace(/[^a-z0-9]+/g, " ") + " ";
    let sc = 0;
    words.forEach(w => { if (t.includes(" " + w)) sc += w.length > 6 ? 2 : 1; });
    if (sc > bs) { bs = sc; best = bi; }
  });
  return best;
}
function blockHtml(b) {
  if (b[0] === "h") return "<h3>" + md(b[1]) + "</h3><ul>" + b[2].map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
  if (b[0] === "flow") return "<h3>" + md(b[1]) + '</h3><div class="flow">' + b[2].map((x, i) => (i ? "<span>›</span>" : "") + "<div>" + md(x) + "</div>").join("") + "</div>";
  if (b[0] === "table") return "<h3>" + md(b[1]) + '</h3><div class="tw"><table><tr>' + b[2].map(x => "<th>" + md(x) + "</th>").join("") + "</tr>" +
    b[3].map(r => "<tr>" + r.map((x, i) => i ? "<td>" + md(x) + "</td>" : "<td><b>" + md(x) + "</b></td>").join("") + "</tr>").join("") + "</table></div>";
  return "";
}
function ficheLink(bi, label) {
  if (!FDATA) return `<a class="fiche" href="${FICHE}" target="_blank" rel="noopener">${label} (PDF)</a>`;
  return `<a class="fiche" href="#fiche" data-b="${bi}">${label}</a>`;
}
let saved = null; // contenu du quiz mis de côté pendant la lecture de la fiche
function showFiche(bi, where) {
  saved = { html: app.innerHTML, y: window.scrollY, where };
  app.innerHTML = `<div class="backq"><button id="backq">← Retour ${where}</button></div>
    <div class="fic"><h2>${md(FDATA.title)}</h2>${FDATA.blocks.map(blockHtml).join("")}</div>
    <p><a class="lk" href="${FICHE}" target="_blank" rel="noopener">Version PDF imprimable de la fiche</a></p>
    <button class="main" id="backq2">← Retour ${where}</button>`;
  const hs = app.querySelectorAll(".fic > h3");
  if (bi >= 0 && hs[bi]) {
    hs[bi].classList.add("goto"); const n = hs[bi].nextElementSibling; if (n) n.classList.add("goto");
    setTimeout(() => hs[bi].scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
  try { history.pushState({ fiche: 1 }, "", "#fiche"); } catch (e) {}
  app.querySelector("#backq").addEventListener("click", backToQuiz);
  app.querySelector("#backq2").addEventListener("click", backToQuiz);
}
function backToQuiz() {
  if (!saved) return;
  const s = saved; saved = null;
  app.innerHTML = s.html; rebind();
  window.scrollTo(0, s.y);
  if (location.hash === "#fiche") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (saved) backToQuiz(); });
app.addEventListener("click", ev => {
  const a = ev.target.closest("a.fiche[data-b]");
  if (!a) return;
  ev.preventDefault();
  showFiche(+a.dataset.b, a.dataset.w || (idx >= order.length ? "aux résultats" : `au quiz (question ${idx + 1}/${order.length})`));
});
// Après retour, on rebranche les boutons de la vue restaurée
function rebind() {
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => { idx++; render(); });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", start);
  document.querySelectorAll(".choice:enabled").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function render() {
  if (idx >= order.length) return showResult();
  const Q = QUESTIONS[order[idx]];
  const pct = Math.round(idx / order.length * 100);
  app.innerHTML = `
    <h1>Quiz : Rappels de première indispensables : agents, production et PIB, répartition des revenus, financement et marchés</h1>
    <p class="sub">Terminale STMG Économie – Méthode de l’épreuve, calculs et rappels indispensables de première</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="count">Question ${idx + 1} / ${order.length}</div>
    <p class="question">${esc(Q.q)}</p>
    <div id="choices">
      ${Q.c.map((t, i) => `<button class="choice" data-i="${i}">${esc(t)}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="main" id="next" style="display:none"></button>`;
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i) {
  const Q = QUESTIONS[order[idx]];
  const ok = i === Q.a;
  if (ok) score++;
  answers.push({ q: Q.q, ok, good: Q.c[Q.a], b: matchBlock(Q) });
  document.querySelectorAll(".choice").forEach((b, k) => {
    b.disabled = true;
    if (k === Q.a) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const ex = document.getElementById("explain");
  ex.style.display = "block";
  ex.innerHTML = `<strong>${ok ? "Bonne réponse !" : "Raté."}</strong> ${md(Q.e)}<br>${ficheLink(matchBlock(Q), "📖 Revoir ce point dans la fiche")}`;
  const next = document.getElementById("next");
  next.style.display = "inline-block";
  next.textContent = idx + 1 < order.length ? "Question suivante" : "Voir mon score";
  next.addEventListener("click", () => { idx++; render(); });
}

function showResult() {
  const n = order.length;
  const msg = score >= n * 0.8 ? "Excellent, le cours est maîtrisé !"
            : score >= n * 0.5 ? "Pas mal, relis les points manqués."
            : "À retravailler : reprends la fiche et réessaie.";
  const missed = answers.filter(a => !a.ok);
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p>${msg}</p>
    ${missed.length ? `<h3>À revoir</h3><ul class="recap">${missed.map(a =>
      `<li>${esc(a.q)}<br><em>Réponse : ${esc(a.good)}</em><br>${ficheLink(a.b, "📖 Voir dans la fiche")}</li>`).join("")}</ul>` : ""}
    ${ficheLink(-1, "📖 Relire toute la fiche")}<br><button class="main" id="again">Recommencer</button>`;
  document.getElementById("again").addEventListener("click", start);
}

start();
</script>
</body>
</html>
